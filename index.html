<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天体色数® 鑑定ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --gold:#C9A84C; --deep:#0D0D1A; --mid:#1A1A2E; --soft:#F5F0E8; --accent:#E8D5A3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--deep); color:var(--soft); font-family:'Noto Serif JP',serif; min-height:100vh; }
  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle var(--d,3s) ease-in-out infinite; opacity:var(--o,0.5); }
  @keyframes twinkle { 0%,100%{opacity:var(--o,0.5);transform:scale(1);}50%{opacity:1;transform:scale(1.5);} }
  .container { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:48px 24px; }
  header { text-align:center; margin-bottom:48px; }
  .title-en { font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:6px; color:var(--gold); text-transform:uppercase; margin-bottom:12px; }
  h1 { font-family:'Cormorant Garamond',serif; font-size:38px; font-weight:300; color:var(--accent); letter-spacing:4px; margin-bottom:8px; }
  .subtitle { font-size:12px; color:rgba(245,240,232,0.5); letter-spacing:2px; }
  .divider { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:20px auto; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(201,168,76,0.2); border-radius:2px; padding:36px; margin-bottom:24px; }
  .card-title { font-family:'Cormorant Garamond',serif; font-size:13px; letter-spacing:4px; color:var(--gold); text-transform:uppercase; margin-bottom:24px; }
  .field { margin-bottom:16px; }
  label { display:block; font-size:11px; letter-spacing:2px; color:rgba(245,240,232,0.6); margin-bottom:6px; }
  input, select { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(201,168,76,0.25); border-radius:1px; color:var(--soft); font-family:'Noto Serif JP',serif; font-size:13px; padding:10px 14px; outline:none; transition:border-color 0.3s; }
  input:focus, select:focus { border-color:var(--gold); }
  select option { background:var(--mid); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .section-label { font-size:10px; letter-spacing:3px; color:rgba(201,168,76,0.6); text-transform:uppercase; margin:20px 0 12px; border-bottom:1px solid rgba(201,168,76,0.15); padding-bottom:8px; }
  .btn { width:100%; padding:16px; background:transparent; border:1px solid var(--gold); color:var(--gold); font-family:'Cormorant Garamond',serif; font-size:15px; letter-spacing:4px; cursor:pointer; transition:all 0.3s; text-transform:uppercase; margin-top:16px; }
  .btn:hover { background:rgba(201,168,76,0.1); }

  /* 詳細鑑定文スタイル */
  .reading-wrap { margin-top:12px; }
  .reading-section { background:rgba(255,255,255,0.04); border:1px solid rgba(201,168,76,0.2); border-radius:2px; padding:28px 28px 24px; margin-bottom:18px; }
  .reading-mission { border-color:rgba(201,168,76,0.5); background:rgba(201,168,76,0.04); }
  .reading-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  .reading-icon { font-size:22px; line-height:1; margin-top:2px; flex-shrink:0; }
  .reading-title { font-family:'Cormorant Garamond',serif; font-size:17px; letter-spacing:3px; color:var(--gold); margin-bottom:3px; }
  .reading-sub { font-size:10px; letter-spacing:2px; color:rgba(245,240,232,0.45); }
  .reading-color-badge { margin-left:auto; font-size:10px; color:rgba(245,240,232,0.6); display:flex; align-items:center; white-space:nowrap; }
  .reading-body { font-size:13px; line-height:2; color:rgba(245,240,232,0.85); }
  .reading-body p { margin-bottom:12px; }
  .reading-body strong { color:var(--accent); font-weight:normal; }
  .reading-subsection { margin:16px 0; padding:16px 18px; background:rgba(255,255,255,0.03); border-left:2px solid rgba(201,168,76,0.35); }
  .reading-subsec-title { font-size:10px; letter-spacing:3px; color:var(--gold); margin-bottom:10px; text-transform:uppercase; }
  #result { display:none; animation:fadeIn 0.8s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);} }
  .unmei-section { text-align:center; margin-bottom:28px; }
  /* 天体図レイアウト */
  .chart-layout { margin-bottom:8px; }
  .chart-top-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .chart-unmei-center { text-align:center; flex:1; }
  .chart-unmei-label { font-size:10px; letter-spacing:3px; color:rgba(245,240,232,0.5); margin-bottom:4px; }
  .chart-total-row { display:flex; justify-content:center; margin-top:14px; }
  .chart-badge-box { background:rgba(13,13,42,0.85); border:1px solid #C9A84C; border-radius:2px; padding:10px; text-align:center; width:110px; height:110px; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .chart-badge-total { width:130px; height:auto; min-height:110px; }
  .chart-badge-label { font-size:9px; letter-spacing:2px; color:var(--gold); margin-bottom:7px; white-space:nowrap; }
  .chart-badge-dot { width:38px; height:38px; border-radius:50%; margin:0 auto 7px; border:1px solid rgba(201,168,76,0.4); flex-shrink:0; }
  .chart-badge-color { font-size:12px; color:var(--soft); }
  .chart-badge-ja { font-size:9px; color:rgba(245,240,232,0.45); margin-top:2px; }
  .unmei-num { font-family:'Cormorant Garamond',serif; font-size:80px; font-weight:300; font-style:italic; color:var(--gold); line-height:1; }
  .unmei-label { font-size:11px; letter-spacing:3px; color:rgba(245,240,232,0.5); margin-top:8px; }
  .unmei-calc { font-size:11px; color:rgba(245,240,232,0.4); margin-top:6px; }
  .mapping-table { width:100%; border-collapse:collapse; margin-bottom:20px; font-size:12px; }
  .mapping-table th { color:var(--gold); letter-spacing:2px; padding:8px 6px; border-bottom:1px solid rgba(201,168,76,0.2); text-align:center; }
  .mapping-table td { padding:7px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.05); }
  .mapping-table tr.highlight td { background:rgba(201,168,76,0.12); color:var(--accent); font-weight:bold; }
  .planet-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:24px; }
  @media(max-width:500px){ .planet-grid{grid-template-columns:repeat(2,1fr);} }
  .planet-card { background:rgba(255,255,255,0.03); border:1px solid rgba(201,168,76,0.15); padding:14px 8px; text-align:center; border-radius:1px; position:relative; }
  .planet-card.support { border-color:var(--gold); box-shadow:0 0 10px rgba(201,168,76,0.2); }
  .support-star { position:absolute; top:5px; right:7px; color:var(--gold); font-size:13px; }
  .planet-num-badge { position:absolute; top:5px; left:7px; font-family:'Cormorant Garamond',serif; font-size:15px; color:rgba(201,168,76,0.7); }
  .planet-name { font-size:10px; letter-spacing:2px; color:rgba(245,240,232,0.45); margin-bottom:4px; margin-top:4px; }
  .planet-meaning { display:none; }
  .color-dot { width:30px; height:30px; border-radius:50%; margin:0 auto 7px; border:2px solid rgba(255,255,255,0.15); }
  .color-name { font-size:11px; color:var(--accent); }
  .sign-name { font-size:10px; color:rgba(245,240,232,0.4); margin-top:3px; }
  .summary-cards { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; }
  .summary-card { background:rgba(201,168,76,0.06); border:1px solid rgba(201,168,76,0.3); padding:18px 10px; text-align:center; }
  .summary-label { font-size:10px; letter-spacing:2px; color:var(--gold); margin-bottom:10px; }
  .summary-dot { width:38px; height:38px; border-radius:50%; margin:0 auto 8px; border:2px solid rgba(255,255,255,0.2); }
  .summary-color { font-size:13px; color:var(--soft); }
  .summary-num { font-size:10px; color:rgba(245,240,232,0.4); margin-top:4px; }
  .calc-detail { display:none; }
  .nenun-row { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid rgba(201,168,76,0.1); }
  .nenun-year { font-size:12px; color:rgba(245,240,232,0.5); min-width:90px; }
  .nenun-num { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold); }
  .nenun-color { font-size:11px; color:var(--accent); display:flex; align-items:center; gap:6px; }
  .nenun-dot { width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .current-year { background:rgba(201,168,76,0.08); border-radius:2px; padding:4px 8px; margin:-4px -8px; }
  .note { font-size:11px; color:rgba(245,240,232,0.35); text-align:center; line-height:1.8; margin-top:16px; padding-top:16px; border-top:1px solid rgba(201,168,76,0.1); white-space:pre-line; }
  .reset-btn { width:100%; padding:12px; background:transparent; border:1px solid rgba(245,240,232,0.2); color:rgba(245,240,232,0.4); font-family:'Noto Serif JP',serif; font-size:12px; letter-spacing:2px; cursor:pointer; transition:all 0.3s; margin-top:16px; }
  .reset-btn:hover { border-color:rgba(245,240,232,0.5); color:var(--soft); }
  .loading { text-align:center; padding:32px; color:var(--gold); font-size:12px; letter-spacing:3px; display:none; }
  .error-msg { background:rgba(255,80,80,0.1); border:1px solid rgba(255,80,80,0.3); color:#ff9090; padding:12px 16px; font-size:12px; margin-top:12px; display:none; }
  .month-row{display:grid;grid-template-columns:58px 1fr auto;align-items:center;padding:16px 4px;border-bottom:1px solid rgba(201,168,76,0.08);gap:8px;}
  .month-row.current-month{background:rgba(201,168,76,0.08);border-radius:2px;padding:16px 8px;margin:0 -4px;}
  .month-num-col{display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
  .month-num{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--gold);}
  .month-sign{font-size:15px;color:var(--accent);}
  .month-theme{font-size:13px;color:rgba(245,240,232,0.45);margin-top:4px;}
  .month-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle;}
  .month-direction{font-size:14px;padding:6px 9px;border-radius:10px;text-align:center;}
  .month-direction.outward{background:rgba(201,168,76,0.15);color:var(--gold);}
  .month-direction.inward{background:rgba(255,255,255,0.05);color:rgba(245,240,232,0.4);}
  .month-badge{font-size:13px;color:var(--gold);text-align:right;line-height:1.8;}
  .pdf-btn{width:100%;padding:16px;background:rgba(201,168,76,0.12);border:1px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:4px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;margin-top:8px;}
  .pdf-btn:hover{background:rgba(201,168,76,0.25);}
  @media print{
    @page { margin: 10mm 8mm; size: A4; }
    html { font-size: 12pt !important; }
    body{background:#fff !important;color:#1a1a1a !important;}
    .stars,.reset-btn,.pdf-btn,.print-note{display:none !important;}
    .container{padding:4px !important;max-width:100% !important;width:100% !important;}
    .card{background:#fff !important;border:1px solid #ddd !important;break-inside:avoid;margin-bottom:10px !important;padding:12px !important;}
    .card-title{color:#8B6914 !important;font-size:11pt !important;letter-spacing:2px !important;}
    .unmei-num{color:#8B6914 !important;font-style:italic;}
    h1,.title-en,.subtitle{color:#1a1a1a !important;}
    .divider{background:#8B6914 !important;}
    label,.section-label,.unmei-label,.unmei-calc{font-size:11pt !important;}
    .planet-grid{display:grid !important;grid-template-columns:repeat(4,1fr) !important;break-inside:avoid;}
    .planet-card{background:#f9f9f9 !important;border:1px solid #ddd !important;break-inside:avoid;}
    .planet-card.support{border-color:#8B6914 !important;}
    .planet-name,.color-name,.sign-name,.planet-num-badge{font-size:11pt !important;color:#444 !important;}
    .planet-num-badge{color:#8B6914 !important;}
    .summary-cards{display:grid !important;grid-template-columns:1fr 1fr 1fr !important;break-inside:avoid;}
    .summary-card{background:#f9f9f9 !important;border:1px solid #ddd !important;break-inside:avoid;}
    .summary-label,.summary-color,.summary-num{font-size:11pt !important;color:#444 !important;}
    .chart-badge-box{background:#fdfaf3 !important;border:1px solid #C9A84C !important;}
    .chart-badge-label,.chart-badge-color,.chart-badge-ja,.chart-unmei-label{font-size:11pt !important;color:#333 !important;}
    .reading-section{background:#fff !important;border:1px solid #c9a84c !important;break-inside:avoid;margin-bottom:28px !important;padding:14px !important;}
    .reading-mission{border-color:#c9a84c !important;background:#fffdf5 !important;}
    .reading-title{color:#8B6914 !important;font-size:12pt !important;}
    .reading-sub,.reading-color-badge{color:#666 !important;font-size:10pt !important;}
    .reading-body{color:#1a1a1a !important;font-size:12pt !important;line-height:1.85 !important;}
    .reading-body p{font-size:12pt !important;margin-bottom:8px !important;}
    .reading-body strong{color:#8B6914 !important;}
    .reading-subsection{background:#fffdf5 !important;border-left:2px solid #c9a84c !important;break-inside:avoid;}
    .reading-subsec-title{color:#8B6914 !important;font-size:10pt !important;}
    .mapping-table,.mapping-table td,.mapping-table th{font-size:11pt !important;color:#1a1a1a !important;}
    .mapping-table tr.highlight td{background:#fef9e7 !important;color:#8B6914 !important;}
    .nenun-row{border-bottom:1px solid #eee !important;}
    .nenun-num{color:#8B6914 !important;font-size:11pt !important;}
    .nenun-year,.nenun-color{font-size:11pt !important;color:#444 !important;}
    .month-row{padding:12px 4px !important;gap:8px !important;}
    .month-row.current-month{background:#fef9e7 !important;padding:12px 8px !important;}
    .month-sign{font-size:10pt !important;color:#333 !important;}
    .month-theme{font-size:11pt !important;color:#555 !important;}
    .month-direction{font-size:11pt !important;padding:5px 8px !important;}
    .month-direction.outward{background:#fef9e7 !important;color:#8B6914 !important;}
    .month-direction.inward{background:#f5f5f5 !important;color:#666 !important;}
    .month-badge{font-size:11pt !important;line-height:1.8 !important;color:#8B6914 !important;}
    .support-star{color:#8B6914 !important;}
    .note{color:#666 !important;font-size:10pt !important;}
    #result{display:block !important;}
  }

/* ===== 入力フォーム（天体式図ツールと同じ入力方式） ===== */
#form-section label small{font-size:11px;color:var(--gold);margin-left:6px;letter-spacing:0;}
#form-section input,#form-section select{font-size:16px;}
#form-section .date-row{display:flex;gap:6px;align-items:center;}
#form-section .date-row input{text-align:center;padding-left:4px;padding-right:4px;}
#form-section .date-row span{font-size:13px;color:rgba(245,240,232,.6);}
#birth-year{flex:2.2;} #birth-month,#birth-day{flex:1;}
#birth-time{text-align:center;letter-spacing:2px;}
.in-hint{font-size:12px;margin-top:6px;line-height:1.6;color:rgba(245,240,232,.5);}
.in-hint.ok{color:#8fd19e;} .in-hint.warn{color:#e8c46a;}
</style>

function geocode(place){
  var q=place.toLowerCase().replace(/\s+/g,'').replace(/[市区町村都道府県]/g,'');
  for(var i=0;i<JP_CITIES.length;i++){
    var city=JP_CITIES[i];
    for(var j=0;j<city.k.length;j++){
      if(q.includes(city.k[j]) || city.k[j].includes(q)){
        return Promise.resolve({lat:city.lat,lon:city.lon,tz:city.tz,name:place});
      }
    }
  }
  // 見つからない場合：日本と仮定して経度から推定
  return Promise.resolve({lat:35.0,lon:135.0,tz:9,name:place+'（日本・概算）'});
}

function tzFromLon(lon){ return Math.round(lon/15); }


// astronomy-engineを使った天体計算
function calcPlanetsAstroEngine(year,month,day,hour,minute,lat,lon,tzOffset){
  // UTCに変換
  const utcHour=hour-tzOffset+minute/60;
  let d=day+utcHour/24, m=month, y=year;
  if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;

  // AstronomyライブラリのGeoVector/EclipticLongitude
  const Astronomy=window.Astronomy;
  const date=new Date(Date.UTC(year,month-1,day,Math.floor(utcHour),Math.round((utcHour%1)*60)));

  const planets={};
  const bodyMap={Sun:'Sun',Moon:'Moon',Mercury:'Mercury',Venus:'Venus',Mars:'Mars',Jupiter:'Jupiter',Saturn:'Saturn'};
  Object.keys(bodyMap).forEach(function(key){
    try{
      var body=Astronomy.Body[bodyMap[key]];
      var ecl=Astronomy.EclipticGeoMoon ? null : null;
      var lon2;
      if(key==='Sun'){
        var sunEcl=Astronomy.SunPosition(date);
        lon2=sunEcl.elon;
      } else if(key==='Moon'){
        var moonEcl=Astronomy.EclipticGeoMoon(date);
        lon2=moonEcl.lon;
      } else {
        var geoVec=Astronomy.GeoVector(body,date,true);
        var eclVec=Astronomy.Ecliptic(geoVec);
        lon2=eclVec.elon;
      }
      planets[key]=lonToSign(lon2);
    }catch(e){
      planets[key]=null;
    }
  });

  // ASC計算（出生地の緯度経度必要）
  try{
    var lst=calcLST(jd,lon);
    var asc=calcASC(lst,lat);
    planets['Asc']=lonToSign(asc);
  }catch(e){ planets['Asc']=null; }

  return planets;
}

// 恒星時計算
function calcLST(jd,lon){
  var T=(jd-2451545.0)/36525;
  var theta0=280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T;
  return ((theta0+lon)%360+360)%360;
}

// ASC計算
function calcASC(lst,lat){
  var DEG=Math.PI/180;
  var e=23.4397*DEG;
  var L=lst*DEG;
  var phi=lat*DEG;
  var y=-(Math.cos(L)+Math.sin(e)*Math.tan(phi));
  var x=Math.cos(e)*Math.cos(L)/Math.sin(L);
  // 二象限に注意
  var asc=Math.atan2(y,Math.cos(e)*Math.cos(L))/DEG;
  if(Math.cos(L)<0) asc+=180;
  return (asc%360+360)%360;
}

// メイン：自動計算して鑑定実行
async function autoCalcAndRun(){
  const birthdate=getBirthdate();
  const btimeRaw=document.getElementById('birth-time').value;
  const bplace=document.getElementById('birth-place').value.trim();
  const errEl=document.getElementById('error-msg');
  errEl.style.display='none';

  if(!birthdate){errEl.textContent='生年月日を入力してください';errEl.style.display='block';return;}
  if(!bplace){errEl.textContent='出生地を入力してください';errEl.style.display='block';return;}

  if(!window.Astronomy){
    errEl.textContent='天文計算ライブラリが読み込まれていません。ページをリロードしてください。';
    errEl.style.display='block';return;
  }

  document.getElementById('auto-btn').disabled=true;
  document.getElementById('auto-loading').style.display='block';
  document.getElementById('auto-result-msg').style.display='none';

  try{
    // ジオコーディング
    var geo=await geocode(bplace);
    var lat=geo.lat, lon=geo.lon;
    var tzOffset=geo.tz!==undefined?geo.tz:tzFromLon(lon);

    // 日時パース
    var parts=birthdate.split('-');
    var year=parseInt(parts[0]),month=parseInt(parts[1]),day=parseInt(parts[2]);
    var hour=12,minute=0;
    if(btimeRaw){
      var tp=btimeRaw.split(':');
      hour=parseInt(tp[0]);minute=parseInt(tp[1]||0);
    }

    // 天体計算
    var planets=calcPlanetsAstroEngine(year,month,day,hour,minute,lat,lon,tzOffset);

    // 不足確認
    var missing=[];
    ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn'].forEach(function(k){
      if(!planets[k]) missing.push(k);
    });
    if(missing.length>0) throw new Error('計算できなかった天体：'+missing.join(','));

    // ドロップダウンに自動セット
    ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn'].forEach(function(k){
      var el=document.getElementById('p-'+k);
      if(el && planets[k]) el.value=planets[k];
    });

    var locShort=bplace+' ('+lat.toFixed(2)+'N, '+lon.toFixed(2)+'E, UTC'+(tzOffset>=0?'+':'')+tzOffset+')';
    document.getElementById('auto-result-msg').textContent='✦ 計算完了：'+locShort;
    document.getElementById('auto-result-msg').style.display='block';
    document.getElementById('auto-loading').style.display='none';
    document.getElementById('auto-btn').disabled=false;

    // 鑑定実行
    calculate();

  }catch(e){
    document.getElementById('auto-loading').style.display='none';
    document.getElementById('auto-btn').disabled=false;
    errEl.textContent='自動計算エラー：'+e.message+'　→ 手動入力をお試しください';
    errEl.style.display='block';
  }
}

// 運命数（10,11,12はそのまま / マスター11,22,33,44はそのまま / 13以上は足す）
function calcUnmei(dateStr){
  let sum=dateStr.replace(/-/g,'').split('').map(Number).reduce((a,b)=>a+b,0);
  const isMaster=n=>[11,22,33,44].includes(n);
  while(true){
    if(isMaster(sum)) break;
    if(sum<=12) break;
    sum=sum.toString().split('').map(Number).reduce((a,b)=>a+b,0);
  }
  return sum;
}

// 年運数（1〜9）
function calcNenun(year){
  let s=year.toString().split('').map(Number).reduce((a,b)=>a+b,0);
  while(s>9) s=s.toString().split('').map(Number).reduce((a,b)=>a+b,0);
  return s;
}

// 色数約分（1〜12）
function reduceColorNum(n){
  while(n>12) n=n.toString().split('').map(Number).reduce((a,b)=>a+b,0);
  return n;
}

// サポート番号（マスターナンバーの対応）
function getSupportNum(unmei){
  if(unmei===22) return 10;
  if(unmei===33) return 9;
  if(unmei===44) return 8;
  return unmei;
}

function getInfoByNum(n){
  if(typeof window._lastMapping !== 'undefined' && window._lastMapping){
    return window._lastMapping.find(m=>m.num===n)||{color:'—',hex:'#888',ja:'—',sign:''};
  }
  // fallback via OUTER_RING_CW
  return OUTER_RING_CW.find(o=>o.num===n)||{color:'—',hex:'#888',ja:'—',sign:''};
}

function getSignInfo(sign){
  return OUTER_RING_CW.find(o=>o.sign===sign)||{ja:sign,hex:'#888',color:'—'};
}

    const mapping=[];

      mapping.push({num:i+1,...OUTER_RING_CW[(startIdx+i)%12]});

    // 各天体の外周番号（計算用）
    const planetNums={};

      const m=mapping.find(m=>m.sign===planetVals[p.key]);
      planetNums[p.key]=m?m.num:0;
    });

    // 固定外周：天体の内側位置に対応する外周星座（図で固定）
    // 火星→うお座, 木星→さそり座, 土星→やぎ座
    // 水星→おとめ座, 月→おうし座, 金星→かに座
    const n=planetNums;
    const fixedOuter = {
      Mars:    (mapping.find(m=>m.sign==='Pisces')||{num:0}).num,     // うお座
      Jupiter: (mapping.find(m=>m.sign==='Scorpio')||{num:0}).num,    // さそり座
      Saturn:  (mapping.find(m=>m.sign==='Capricorn')||{num:0}).num,  // やぎ座
      Mercury: (mapping.find(m=>m.sign==='Virgo')||{num:0}).num,      // おとめ座
      Moon:    (mapping.find(m=>m.sign==='Taurus')||{num:0}).num,     // おうし座
      Venus:   (mapping.find(m=>m.sign==='Cancer')||{num:0}).num,     // かに座
    };
    // 男性色数: 火星固定外周(うお) + 火星 + 太陽 + 金星 + 水星固定外周(おとめ)
    // 女性色数: 木星固定外周(さそり) + 木星 + 太陽 + 水星 + 月固定外周(おうし)
    // 統合色数: 土星固定外周(やぎ) + 土星 + 太陽 + 月 + 金星固定外周(かに)
    const maleNumsArr  =[fixedOuter.Mars,    n.Mars,    n.Sun, n.Venus,   fixedOuter.Mercury];
    const femaleNumsArr=[fixedOuter.Jupiter, n.Jupiter, n.Sun, n.Mercury, fixedOuter.Moon];
    const totalNumsArr =[fixedOuter.Saturn,  n.Saturn,  n.Sun, n.Moon,    fixedOuter.Venus];

      </div>`;

    // ===== 今年の月別運気 =====
    const thisYear = targetYear;
    const thisMonth = new Date().getMonth() + 1;
    const nenunThisYear = calcNenun(thisYear);

    // 外向き星座（太線）と内向き星座（細線）
    const OUTWARD_SIGNS = ['Taurus','Cancer','Virgo','Scorpio','Capricorn','Pisces'];

    // ★サポート色数の位置（外周マッピングでsupportNumに対応する星座）
    const supportSign = mapping.find(m=>m.num===supportNum)?.sign;
    const supportRingIdx = OUTER_RING_CW.findIndex(o=>o.sign===supportSign);

    // サポート位置を0として、年運数分時計回りに進んだ位置が1月
    const month1RingIdx = (supportRingIdx + nenunThisYear) % 12;
    // ★から nenunThisYear コマ時計回りが今年のサポートカラー（正しい算出）
    const nenunInfo = OUTER_RING_CW[month1RingIdx];

    // 太陽星座・月星座の外周上の位置インデックス
    const sunSign = planetVals['Sun'];
    const sunRingIdx = OUTER_RING_CW.findIndex(o=>o.sign===sunSign);
    const moonRingIdx = OUTER_RING_CW.findIndex(o=>o.sign===moonSign);

      Taurus:     '女性性・五感・美・浄化・癒し・謙虚・共感・共同体感覚',
      Gemini:     '至福・歓喜・ユーモア・社交性・コミュニティ・学びの楽しさ・活発',
      Cancer:     '自己価値・本質の見極め・引き寄せ・探究心・開拓者精神・華やかさ',
      Leo:        '自己を知る・ポジティブ・元気・自分らしさ・明晰性・喜び・明るさ',
      Virgo:      '勇気・希望・成長・努力・チーム力・有言実行・実務・仕組み作り',
      Libra:      '調和・バランス・リフレッシュ・自然体・リラックス・癒し・方向性',
      Scorpio:    '自由・個性・遊び心・ハートの表現・創造性・開放・クリスタル',
      Sagittarius:'信頼・コミュニケーション・安らぎ・解放・清らかさ・無条件の許し',
      Capricorn:  '神秘・超感覚・潜在能力・説得力・感受性・インスピレーション',
      Aquarius:   'ヒーリング・変容・瞑想・発想・芸術性・スピリチュアリティ',
      Pisces:     '慈愛・感謝・献身・守護天使・受容力・天からの愛・繋がりの力',
    };

    const monthlyEl = document.getElementById('monthly-section');

        else badges.push('🌙 内面・価値観・心境の変化がある月');
      }

      monthlyEl.innerHTML += `
        <div class="month-row${isCurrent?' current-month':''}">
          <div class="month-num-col">
            <div class="month-num">${mo}月${isCurrent?' ◀':''}</div>
            <div class="month-direction ${isOutward?'outward':'inward'}">${isOutward?'▲外向き':'▽内向き'}</div>

          <div class="month-sign">
            <span class="month-dot" style="background:${signData.hex}"></span>${signData.ja}
            <div class="month-theme">${theme}</div>
          </div>
          <div class="month-badge">${badges.join('<br>')}</div>

    }

    const moonInfo=getSignInfo(moonSign);
    document.getElementById('result-note').textContent=
      `月星座：${moonInfo.ja} ／ 運命数：${unmei} ／ サポート色数：${getInfoByNum(supportNum).color}`;

    // ===== 詳細鑑定文 =====
    const maleSignInfo   = getInfoByNum(maleSum);
    const femaleSignInfo = getInfoByNum(femaleSum);
    const totalSignInfo  = getInfoByNum(totalSum);
    const supportSignInfo= getInfoByNum(supportNum);
    const yearColorInfo  = OUTER_RING_CW[month1RingIdx]; // ★からnenunThisYearコマ時計回り

    document.getElementById('detail-reading').innerHTML = buildDetailedReading(
      planetVals,
      maleSignInfo.sign,
      femaleSignInfo.sign,
      totalSignInfo.sign,
      supportSignInfo.sign,
      yearColorInfo.sign,
      targetYear
    );

    document.getElementById('loading').style.display='none';
    document.getElementById('result').style.display='block';

  }catch(e){

    document.getElementById('error-msg').style.display='block';
  }
}

function buildChart(planets, mapping, supportNum) {
  const RING = [
    {sign:'Capricorn',   ja:'やぎ',    hex:'#1A237E'},
    {sign:'Sagittarius', ja:'いて',    hex:'#4A90D9'},
    {sign:'Scorpio',     ja:'さそり',  hex:'#2CBFBF'},
    {sign:'Libra',       ja:'てんびん',hex:'#4CAF50'},
    {sign:'Virgo',       ja:'おとめ',  hex:'#8B9A1A'},
    {sign:'Leo',         ja:'しし',    hex:'#FFE83F'},
    {sign:'Cancer',      ja:'かに',    hex:'#fa7331'},
    {sign:'Gemini',      ja:'ふたご',  hex:'#FF9F1C'},
    {sign:'Taurus',      ja:'おうし',  hex:'#ee9f8a'},
    {sign:'Aries',       ja:'おひつじ',hex:'#E63946'},
    {sign:'Pisces',      ja:'うお',    hex:'#E91E8C'},
    {sign:'Aquarius',    ja:'みずがめ',hex:'#9C27B0'},
  ];
  const OUTWARD = ['Taurus','Cancer','Virgo','Scorpio','Capricorn','Pisces'];

  const W=500, H=500, cx=250, cy=250;

  // ===== フルーツオブライフ形状 =====
  // 全ての円が同じ半径r、隣同士が接するジオメトリ
  // 外周12円（30°間隔）: 半径R=147、接するにはr = R*sin(15°) ≈ 38.0
  // 内周6円（60°間隔）: 距離ir=2r=76 → 互いに接し、中心円にも接する
  const R = 174;
  const r = 45; // R*sin(15°)≈45, 全円同サイズ
  const ir = 2 * r;  // 内周円の中心距離 = 2r → 中心円と接する

  function ringPos(i) {
    const angle = (270 + i*30) * Math.PI/180;
    return { x: cx + R*Math.cos(angle), y: cy + R*Math.sin(angle) };
  }
  function innerPos(i) {
    // 内側6天体：60°間隔、土星=上から時計回り
    const angle = (270 + i*60) * Math.PI/180;
    return { x: cx + ir*Math.cos(angle), y: cy + ir*Math.sin(angle) };
  }
  function getMapNum(sign) {
    const m = mapping.find(m=>m.sign===sign);
    return m ? m.num : null;
  }

  const PLANET_ORDER = ['Saturn','Jupiter','Venus','Moon','Mercury','Mars'];
  const PLANET_JA = {Sun:'太陽',Moon:'月',Mercury:'水星',Venus:'金星',Mars:'火星',Jupiter:'木星',Saturn:'土星'};

  const PLANET_POS = {};
  PLANET_ORDER.forEach((key,i) => { PLANET_POS[key] = innerPos(i); });
  PLANET_POS['Sun'] = {x:cx, y:cy};

  // ===== ネイビー星空SVG背景 =====
  // 星の座標（決定論的に生成）
  const stars = [];
  let sx=0.7141, sy=0.3731;
  for(let i=0;i<120;i++){
    sx=(sx*7.42+0.321)%1; sy=(sy*5.83+0.147)%1;
    const pr=0.3+((i*73)%100)/100*1.8;
    const op=0.2+((i*37)%100)/100*0.7;
    stars.push({x:sx*W, y:sy*H, r:pr, op:op.toFixed(2)});
  }

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="430" height="430" style="max-width:100%;display:block;margin:0 auto;">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a5e"/>
      <stop offset="60%" stop-color="#0d0d3b"/>
      <stop offset="100%" stop-color="#05050f"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#bgGrad)" rx="4"/>`;

  // 星を描画
  stars.forEach(s => {
    svg += `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r}" fill="white" opacity="${s.op}"/>`;
  });

  // 外周ゴールドサークル
  svg += `<circle cx="${cx}" cy="${cy}" r="${R+r+2}" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.8"/>`;

  // 内側補助線
  const PP = PLANET_POS;
  const lines = [
    [PP.Saturn,PP.Mars],[PP.Saturn,PP.Jupiter],[PP.Saturn,PP.Moon],
    [PP.Mars,PP.Mercury],[PP.Mars,PP.Venus],[PP.Mars,PP.Moon],
    [PP.Jupiter,PP.Mercury],[PP.Jupiter,PP.Venus],[PP.Jupiter,PP.Moon],
    [PP.Mercury,PP.Venus],[PP.Mercury,PP.Moon],[PP.Venus,PP.Moon],
    [PP.Sun,PP.Saturn],[PP.Sun,PP.Mars],[PP.Sun,PP.Jupiter],
    [PP.Sun,PP.Mercury],[PP.Sun,PP.Venus],[PP.Sun,PP.Moon],
  ];
  lines.forEach(([a,b])=>{
    svg+=`<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="rgba(201,168,76,0.18)" stroke-width="0.6"/>`;
  });

  // 外周12星座（全て同じ半径r）
  RING.forEach((s,i) => {
    const pos = ringPos(i);
    const mapNum = getMapNum(s.sign);
    const isSup = mapNum === supportNum;
    const isOutward = OUTWARD.includes(s.sign);
    const strokeW = isOutward ? 2.5 : 1.0;
    svg+=`<circle cx="${pos.x.toFixed(1)}" cy="${pos.y.toFixed(1)}" r="${r}" fill="${s.hex}" stroke="rgba(255,255,255,0.85)" stroke-width="${strokeW}" opacity="0.96"/>`;
    if(isSup){
      svg+=`<circle cx="${pos.x.toFixed(1)}" cy="${pos.y.toFixed(1)}" r="${r+5}" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,2"/>`;
    }
    if(mapNum){
      svg+=`<text x="${pos.x.toFixed(1)}" y="${(pos.y-7).toFixed(1)}" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="serif">${mapNum}${isSup?'★':''}</text>`;
    }
    svg+=`<text x="${pos.x.toFixed(1)}" y="${(pos.y+12).toFixed(1)}" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">${s.ja}</text>`;
  });

  // 内側7天体（同じ半径r、中心は太陽）
  Object.entries(PLANET_POS).forEach(([key,pos])=>{
    const sign = planets[key];
    const signInfo = RING.find(ri=>ri.sign===sign)||{hex:'#444'};
    const mapNum = getMapNum(sign);
    svg+=`<circle cx="${pos.x.toFixed(1)}" cy="${pos.y.toFixed(1)}" r="${r}" fill="${signInfo.hex}" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" opacity="0.96"/>`;
    svg+=`<text x="${pos.x.toFixed(1)}" y="${(pos.y-6).toFixed(1)}" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="sans-serif">${PLANET_JA[key]}</text>`;
    svg+=`<text x="${pos.x.toFixed(1)}" y="${(pos.y+12).toFixed(1)}" text-anchor="middle" fill="white" font-size="12" font-family="serif">${mapNum||''}</text>`;
  });

  svg+=`</svg>`;
  return svg;
}

function downloadSNS(){ downloadSNSAll(); }

function downloadSNSAll(){
  var nameVal = document.getElementById('clientname').value || '';
  var unmeiVal= (window._snsUnmei || document.getElementById('unmei-display').textContent || '').trim();
  var yearVal = window._snsYear || new Date().getFullYear();
  var chartEl = document.getElementById('celestial-chart');
  var svgEl   = chartEl ? chartEl.querySelector('svg') : null;
  if(!svgEl){ alert('先に鑑定を実行してください'); return; }
  var btn = document.getElementById('sns-dl-btn');
  btn.textContent = '⏳ 生成中...'; btn.disabled = true;
  var clone = svgEl.cloneNode(true);
  clone.setAttribute('width','800'); clone.setAttribute('height','800');
  clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  var svgStr = new XMLSerializer().serializeToString(clone);
  var svgB64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
  var img = new Image();
  img.onload = function(){ buildAndZip(img, nameVal, unmeiVal, yearVal, btn); };
  img.onerror= function(){ buildAndZip(null, nameVal, unmeiVal, yearVal, btn); };
  img.src = svgB64;
}

function buildAndZip(chartImg, nameVal, unmeiVal, yearVal, btn){
  var c1 = makePage1(chartImg, nameVal, unmeiVal);
  var prefix = nameVal ? nameVal : '天体色数';
  var a = document.createElement('a');
  a.download = prefix + '_SNS.png';
  a.href = c1.toDataURL('image/png');
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  btn.textContent = '↓ SNS用画像をダウンロード'; btn.disabled = false;
}

function snsDrawBase(ctx,W,H){
  // 白背景
  ctx.fillStyle='#FDFAF4'; ctx.fillRect(0,0,W,H);
  // 上部ゴールドライン
  ctx.fillStyle='#C9A84C'; ctx.fillRect(0,0,W,5);
  ctx.fillStyle='#C9A84C'; ctx.fillRect(0,H-5,W,5);
  // タイトル
  ctx.textAlign='center';
  ctx.fillStyle='#8B6914'; ctx.font='italic 24px Georgia,serif';
  ctx.letterSpacing='4px';
  ctx.fillText('Celestial Color Number',W/2,68);
  ctx.fillStyle='#1a1a1a'; ctx.font='300 48px Georgia,serif';
  ctx.fillText('天体色数',W/2,130);
  // 商標マークを小さく上付きで
  ctx.font='300 22px Georgia,serif';
  ctx.fillText('®',W/2+82,108);
  snsLine(ctx,W/2,152,180);
}

function snsLine(ctx,cx,y,half){
  var g=ctx.createLinearGradient(cx-half,0,cx+half,0);
  g.addColorStop(0,'transparent'); g.addColorStop(0.5,'rgba(139,105,20,0.6)'); g.addColorStop(1,'transparent');
  ctx.strokeStyle=g; ctx.lineWidth=1.0;
  ctx.beginPath(); ctx.moveTo(cx-half,y); ctx.lineTo(cx+half,y); ctx.stroke();
}

function snsFooter(ctx,W,H,label){
  snsLine(ctx,W/2,H-65,130);
  ctx.fillStyle='#8B6914'; ctx.font='18px Georgia,serif'; ctx.textAlign='center';
  ctx.fillText(label,W/2,H-30);
}

function snsDot(ctx,x,y,hex,r){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=hex; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1; ctx.stroke();
}

function makePage1(chartImg,name,unmei){

  // ===== 図の配置（中央） =====
  var chartTop = name ? 220 : 200;

  // 図の上：「運命数（誕生数）」ラベル

  var fx = W-60-160, fy = chartTop + 20;

    var mci=OUTER_RING_CW[(m1+i)%12]||{};
    var mcd=COLOR_DATA[mci.sign||'']||{};
    var mhex=mci.hex||'#555', mcname=mcd.name||'';
    ctx.fillStyle='rgba(0,0,0,0.03)'; ctx.fillRect(cx-cw/2+5,cy+5,cw-10,ch-10);
    ctx.fillStyle=mhex; ctx.fillRect(cx-cw/2+5,cy+5,4,ch-10);
    snsDot(ctx,cx,cy+46,mhex,18);
    ctx.fillStyle='#555'; ctx.font='18px Georgia,serif'; ctx.textAlign='center'; ctx.fillText(m,cx,cy+26);
    ctx.fillStyle=mhex; ctx.font='bold 20px Georgia,serif'; ctx.fillText(mcname||'—',cx,cy+80);
  });
  snsFooter(ctx,W,H,'天体色数® 鑑定');
  return canvas;
}
