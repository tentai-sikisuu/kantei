function prefShort(p){ return p==='北海道'?p:p.replace(/[都府県]$/,''); }
function matchCity(pref, rest){
  if(!rest) return null;
  const list=PREF_INDEX[pref]; let best=null, bestLen=0;
  list.forEach(e=>{
    const n=normText(e.name), noGun=n.replace(/^.+?郡/,''), short=n.replace(/[市区町村郡]$/,'');
    [[n,3],[noGun,2],[short,1]].forEach(([cand,w])=>{
      if(cand.length>=2 && rest.startsWith(cand)){ const score=cand.length*10+w; if(score>bestLen){bestLen=score;best=e;} }
    });
  });
  return best;
}
function findPlace(input){
  const s=normText(input); if(!s) return null;
  const lower=s.toLowerCase();
  for(const c of WORLD_CITIES){
    if(c.k.some(k=>lower.includes(k.replace(/\s+/g,'')))) return {lat:c.lat,lon:c.lon,tz:c.tz,label:input.trim(),japan:false,level:'city'};
  }
  for(const p of PREF_NAMES){
    for(const head of [p,prefShort(p)]){
      if(s.startsWith(head)){
        const rest=s.slice(head.length), c=matchCity(p,rest);
        if(c) return {lat:c.lat,lon:c.lon,tz:9,label:p+c.name,japan:true,level:'city'};
        if(head===p || !rest) return {lat:JP_DB[p].c[0],lon:JP_DB[p].c[1],tz:9,label:p,japan:true,level:'pref'};
      }
    }
  }
  let best=null,bestScore=0;
  for(const p of PREF_NAMES){
    const c=matchCity(p,s);
    if(c){ const sc=normText(c.name).length; if(sc>bestScore){bestScore=sc;best={lat:c.lat,lon:c.lon,tz:9,label:p+c.name,japan:true,level:'city'};} }
  }
  return best;
}
// 日本のサマータイム（1948〜1951年）
function japanDST(y,m,d,h){
  const P={1948:[[5,2],[9,12]],1949:[[4,3],[9,11]],1950:[[5,7],[9,10]],1951:[[5,6],[9,9]]};
  if(!P[y]) return false;
  const v=m*100+d, s=P[y][0][0]*100+P[y][0][1], e=P[y][1][0]*100+P[y][1][1];
  return v>=s && (v<e || (v===e && h<1));
}

// 出生地の検索を全国の市区町村データに差し替え
geocode=function(place){
  const g=findPlace(place);
  if(!g) return Promise.resolve({lat:35.0,lon:135.0,tz:9,name:place+'（日本・概算）'});
  let tz=g.tz;
  if(g.japan){
    const y=+document.getElementById('birth-year').value, m=+document.getElementById('birth-month').value, d=+document.getElementById('birth-day').value;
    const t=document.getElementById('birth-time').value.split(':'), h=t[0]?+t[0]:12;
    if(japanDST(y,m,d,h)) tz=10;
  }
  return Promise.resolve({lat:g.lat,lon:g.lon,tz:tz,name:g.label});
};

(function(){
  const $=id=>document.getElementById(id);
  const toHalf=el=>{ const v=el.value.normalize('NFKC').replace(/[^0-9]/g,''); if(v!==el.value) el.value=v; };
  const pad2=el=>{ if(el.value.length===1) el.value='0'+el.value; };
  const ORDER_IDS=['birth-year','birth-month','birth-day','birth-time','birth-place'];
  const next=id=>{ const n=$(ORDER_IDS[ORDER_IDS.indexOf(id)+1]); n.focus(); if(n.select) n.select(); };
  $('birth-year').addEventListener('input',e=>{ toHalf(e.target); if(e.target.value.length>=4) next('birth-year'); });
  $('birth-month').addEventListener('input',e=>{ const el=e.target; toHalf(el); if(el.value.length===1 && +el.value>=2) el.value='0'+el.value; if(el.value.length>=2) next('birth-month'); });
  $('birth-day').addEventListener('input',e=>{ const el=e.target; toHalf(el); if(el.value.length===1 && +el.value>=4) el.value='0'+el.value; if(el.value.length>=2) next('birth-day'); });
  ['birth-month','birth-day'].forEach(id=>$(id).addEventListener('blur',e=>pad2(e.target)));
  // 時刻：数字だけで「:」を自動で入れる（0640 → 06:40）
  $('birth-time').addEventListener('input',e=>{
    const el=e.target;
    let v=el.value.normalize('NFKC').replace(/[^0-9]/g,'').slice(0,4);
    if(v.length===1 && +v>=3) v='0'+v;
    if(v.length>=3) v=v.slice(0,2)+':'+v.slice(2);
    else if(v.length===2 && !(e.inputType||'').startsWith('delete')) v=v+':';
    el.value=v;
    if(v.length===5) next('birth-time');
  });
  $('birth-time').addEventListener('blur',e=>{
    const el=e.target, v=el.value.replace(/[^0-9]/g,'');
    if(v.length===2) el.value=v+':00';
    else if(v.length===3) el.value='0'+v[0]+':'+v.slice(1);
  });
  // 出生地：入力するとその場で確認を表示
  function updatePlaceHint(){
    const v=$('birth-place').value.trim(), h=$('place-hint');
    if(!v){h.textContent='';h.className='in-hint';return;}
    const g=findPlace(v);
    if(!g){h.textContent='見つかりません。都道府県から入力してください（例：大阪府大阪市）';h.className='in-hint warn';}
    else if(g.level==='pref'){h.textContent='✓ '+g.label+'（市・郡まで入れるとより正確です）';h.className='in-hint warn';}
    else {h.textContent='✓ '+g.label+' として計算します';h.className='in-hint ok';}
  }
  $('birth-place').addEventListener('input',updatePlaceHint);

  // 実行前チェック
  const _auto=window.autoCalcAndRun;
  window.autoCalcAndRun=function(){
    const err=$('error-msg'); err.style.display='none';
    const show=m=>{ err.textContent=m; err.style.display='block'; };
    const y=+$('birth-year').value, m=+$('birth-month').value, d=+$('birth-day').value;
    const dt=new Date(y,m-1,d);
    if(!y||!m||!d||y<1900||y>2100||dt.getMonth()!==m-1||dt.getDate()!==d){ show('生年月日を半角数字で正しく入力してください（例：1985 / 03 / 15）'); return; }
    const t=$('birth-time').value.trim();
    if(t){ const mt=t.match(/^(\d{1,2}):(\d{2})$/); if(!mt||+mt[1]>23||+mt[2]>59){ show('出生時刻は 06:40 のように入力してください（24時間表記）'); return; } }
    if(!$('birth-place').value.trim()){ show('出生地を入力してください（例：大阪府大阪市）'); return; }
    return _auto();
  };
})();
