  'Mercury_Aries': { essence: '自分に起きてくることに対して、最初から拒否したり、シャットアウトすることなく、何事にも、「とりあえずやってみよう」、「やればできるのではないか」という考えで対応することができる人。\n人とのコミュニケーションも同様に、どんな相手でも第一印象で毛嫌いすることなく、自分のほうから関わっていくのではないでしょうか。\n集団の中で一人ぼっちになっている人を見かけると、あなたの方から近づいて声を掛けてあげたりと、自分から歩み寄っていきます。\nそれはあなたの愛と情熱から出るものです。\n自分の考えや気持ち、思いなどもストレートに伝えることができます。\nまた、困難な場面でもあきらめずに取り組むなど、粘り強さも持っています。\n「困難は乗り越えられる」「道は切り開くもの」「中途半端では終わらせない」などの考えを持ち、また知らず知らずにそのような言動も多いかもしれません。\n基本的に「自分の力で生きていく」という姿勢で生きているので、他者に甘えたり、サポートを求めたりと人に頼ることは少ないのでしょう。\n「人に頼ってやってもらうよりも、自分でやったほうが早いから」という思考で物事をこなしていきます。\n頑固な部分もあります。人の意見を聞かなかったり一方的になる傾向もあります。\n負けず嫌いで、威圧的な言動になりやすい面もあります。\n自己主張はできるほうなので、人の意見を真摯に聞くことや、気持ちに寄り添うこと、「時にはできないこともある」という寛容さを意識すると、あなたの持っている積極性がより生かされるでしょう。' },
  'Venus_Aries': { essence: 'あなたの愛情表現は、とてもパワフルで情熱的です。\n好きなことや好きな人にエネルギーを惜しみなく注ぎ、出し惜しみはしません。\n誰かを助けたいと思えば、持ち前の面倒見の良さで積極的にかかわり、力になろうとします。\nストレートで正直に愛を表現でき、複雑な駆け引きや遠回しなアプローチは好みません。\nですから相手の表現が曖昧だったり、煮え切らない態度だったりすると、少しでも早くYESかNOかはっきりしてほしいという思いにかられます。\n負けず嫌いなところがあるため、ライバルがいればより一層燃えることがあるかもしれません。\nその分押しが強すぎて相手を戸惑わせたり、なにかと主導権を握りたがる傾向も。\n待つ・ゆだねる・任せることが鍵になります。\nあなたが惹かれるものは、情熱的なものやパワフルなもの。\nそして、そんな生き方をしている人。\n困難にも立ち向かい乗り越えていく姿や、決めたことを最後までやり遂げる意志の強さに惹かれ、そんな人を応援したくなったり、自分自身もそうありたいと思っています。\n地に足がついた生き方をしている人、現実的に物事を考えられる人を好み、バイタリティに溢れ、勇気をもってチャレンジしている人に惹かれます。\nチャレンジ精神・勇気・行動力・サバイバル・生命力・目覚めといったキーワードにも惹かれます。', plus: '自分の中の情熱、意欲、活力が高まるものに魅かれます。\nより自分を高めてくれるもの、ワンランク豊かに近づけるものを好みます。' },
  'Mars_Aries': { essence: '自分を奮い立たせてくれるような人、場所に足が向かいます。\n自分への挑戦、現状突破ができるものに対して貪欲に求めていきます。\n物事に取り組む時には情熱をもってエネルギーを注ぎ込みます。\nあなたは持ち前の情熱とエネルギーの高さで何事にも前向きにチャレンジしていきます。\nやりたいことが見つかると、そこに惜しみなく時間を使い、困難なことも乗り越えます。\nまた、本来親分肌のところがあり愛情も深いので、誰かの力になれる事には全力で動こうとします。\n負けず嫌いで勝ち負けで動く面や、情熱が行き過ぎて感情的に動いてしまう面もあるのかもしれません。\n熱くなりすぎた時は、少しクールダウンすることを意識しましょう。', plus: 'とてもエネルギッシュでパワフルな前向きなエネルギーをもっています。' },
  'Jupiter_Aries': { essence: 'あなたを幸福へと導くカギはレッドの持つ情熱とパワーです。\nあなたが好きなことや実現したいことに向かって積極的に行動すること、一歩踏み出すために「とりあえずやってみる」こと。\nそれはほんの些細なことでもかまいません。\nそうやって踏み出した一歩が意欲や集中力を発揮させ、良い循環が生まれるきっかけになります。\nそこからはレッドの特性である前向きな力や生命力、困難を乗り越えるサバイバル力などがどんどん発揮され、あなたをより輝かせていくことでしょう。\nあなた自身の野生の勘は大切にしてください。\nピンときたものに大きなチャンスが含まれている可能性が大いにあります。\n集中力や決断力が必要になることへの取り組みは、どんどん発展へと向かっていくでしょう。\n勇気を出してチャレンジすることを忘れず、目標を持って取り組んでいくことが拡大へと向かい、着実に進んでいくことができます。' },
  'Saturn_Aries': { essence: 'あなたは本来パワーがあるので、やろうと思えば大抵のことはできてしまいます。\nそのため何でもやりすぎて自分が疲弊してしまったり、親分肌なのでついつい何でも引き受けてしまい、時には体に不調が出たり、人の成長のチャンスを奪ってしまうことがあるのかもしれません。\nそんな時は人に任せたり、広い視野で客観的に物事をとらえ、力を入れるもの、そうでないもののバランスをとることに意識をしてみて下さい。\nまた負けず嫌いで、人の意見を受け入れにくい部分も持っており、自分の期待通りにいかないと不満が貯まり、威圧的になったり攻撃的になる傾向も。\n自分の感情を眺め、柔軟性をもって、人の気持ちに寄り添うことであなたの中に安らぎが増していくのを感じられるでしょう。' },
  'Support_Aries': { essence: 'あなたを一生サポートしてくれているスピリットカラーはレッドです。\nレッドはしっかりと地に立ち、力強く現実を生きるパワーを表しています。\nレッドは大地の色です。地に足をつけ、心と身体が目覚めた状態を表します。\n赤ん坊は生まれたとき、へその緒を切った瞬間から母親と分離します。\nこれは、今まで母と一体だった安心感の世界から抜け出し、これから人生の中で起きてくる事に対して、個として、『自分自身』が対応していくしかない、というサバイバルのスタートでもあります。\n自分自身が対応していく時には勇気や情熱、活力、地に足をつけて生き抜く力やチャレンジ精神が必要となってくるでしょう。\nレッドは人生に対しての意欲と勇気、行動力、愛、情熱を表します。\n自分が犠牲になっても他の人へ愛と情熱を与えるパワーを持っています。\nあなたがもうこれ以上前に進めないと諦めそうになったとしても、レッドはあなたのサポートをしています。\nそういった逆境のときほど、やる気や活力、困難にも立ち向かっていくパワーを感じたという経験を多く体験しているのではないでしょうか。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、レッドがサポートしているということを思い出してください。\n・エネルギッシュでパワフル\n・どんな事でも前向きにチャレンジ\n・勇気を持って現実的に進んでいく\n・着実に願いを実現していく能力がある\n・実行力と決断力をフルに生かす\n・行動すればする程、良い結果がでる\n・好きな事にエネルギーを注ぐと形になる\n・集中力が高く、情熱を持って取り組む\n・人生に対して生きる意欲\n・何かしたいという行動への情熱のパワー\n・出し惜しみせずに思い切りパワーをだす\n・困難にも立ち向かうパワー\n・決めたことを達成するまで成し遂げる力\n・自ら道を切り開くバイタリティー\n・中途半端にして逃げ出さない強さ\n・人を感化する影響力をもっている\n・出来るという確信で現状突破\nあなたがつらい時も嬉しい時もどんな時もレッドはあなたのサポートをしています。\nもし、サポートが必要な時はレッドのパワーを使ってください。' },
  'YearColor_Aries': { essence: '今年のあなたはレッドが力強い味方となります。\nレッドは情熱、目覚め、一歩踏み出す、豊かさ、地に足をつける、活力といった意味があります。\n何かに積極的にチャレンジしたり、好きなことに取り組む意欲が湧き上がってきたりと、\n今年はあなたが何かを始めたり一歩踏み出す後押しをしてくれることでしょう。\n今年の幕があけてから特に人生に対して生きる意欲をあなた自身も感じているかもしれません。\n何かしたいという行動への情熱のパワーが湧いてくる年になりそうです。\n今までやりたくても中途半端にしていたこと、困難だと思って諦めていたことも今年のあなたは、立ち向かう強さを持ち、自ら道を切り開くバイタリティーに溢れています。\n今年、挑戦したいことがあれば一歩を踏み出すときです。\nそのためには好きな事に出し惜しみせずに、思い切りエネルギーを注いでください。\nあなたが情熱を感じることはどんなことでしょうか。\nとてもエネルギッシュにパワフルに進んでいくことができるので、勇気を持って、チャレンジしていきましょう。\nあなたが行動すればする程、良い結果が出ますし、そんなあなたに感化され、影響を受ける人も現れてくるでしょう。\n行動すればするほど、あなたも周りの人もより豊かになっていく。\nそんな素敵なエネルギーがあふれる1年になりそうです。' },
  'Sun_Taurus': { essence: 'コーラルが表すのは、愛の知恵と共同体、そして、珊瑚のような繊細さと優しさです。\n縁の下の力持ちで、知恵を使い自分自身や周りの人に配慮し、支えあう人間関係を作り、人と共に生きていくことができる方です。\nあなたは愛を生きる智恵が備わっており、色んな人の状態を感じ取れる能力が高く、多くの人と繋がりをもつことができるのではないでしょうか。\nですから、他者の微妙なエネルギーの変化にさえ、敏感に察知し、配慮しながら、愛を与えることができます。\nその愛の与え方も、強引ではなく控えめに、相手に気を配りながら、関わります。\nそんなあなたの愛に触れ、周りの人はマイナスの心の状態からプラスの状態へと変わっていく感覚を得ているでしょう。\n周りの人に対してだけでなく、自分で自分を癒す力もあり、過去を乗り越えた分、新しい自分を生み出す力に変えていくことができます。\n珊瑚は美しい環境でしか育ちません。\nそういった側面として環境に敏感で傷つきやすさを表します。\n敏感さが過敏さになって誰かに頼りたいといった依存心を感じることがあるかもしれません。\n批判や非難、拒絶されることに過剰に反応してしまい、新しいことにチャレンジすることへの不安がでてくることがあるのでしょう。\nそんな時は、インナーチャイルドを癒したり、安心できる人から自己開示をしていくと調和のとれた自分自身に戻っていくでしょう。' },
  'SunRealize_Taurus': { plus: 'あなたはとても受容的で共感力に長けています。\nですからどんな人をも包み込み、しなやかな表現力と女性性のパワーでたくさんの人と繋がりをもち、人々を癒し、そのエネルギーは美しく、多くのものを浄化していきます。\nあなたが皆をまとめていこうと思わなくとも、あなたには本来の愛を伝える力があります。一人一人自立しながら支えあう共同体を構築していくでしょう。\n人間全体の愛に目覚めていき、知恵と勇気をもって支えあう人間関係を作り出していきます。調和をもたらす力と他者のエネルギーを感じ取る明晰性で無から有を創り出し、多くの人を応援し、育んでいきます。' },
  'Moon_Taurus': { essence: 'レッドにゴールドが加わるとコーラルとなります。\n愛（レッド）と自己価値（ゴールド）に気づき生きていくというメッセージが込められています。\n自分の持っている価値に気づき、自分を愛しながら生きていくこと。\nそれは、他者や他の何かに人生を明け渡さない、ということ。\nそれが新しい時代の私たちの生き方です。\n昔は『自分を犠牲にして生きることが美しい』といった観念がありました。\n自分を抑えて、我慢し、誰かに合わせて生きるのではなく、知恵と気づきを求めていけば喜びを持って新しい愛を生きていくことができる、と教えてくれているのがコーラルです。\n新しい時代を生きる私たちに、過去のルールは必要ありません。\nあなたは他者のことを自分のことのように考えることのできる、とても優しい心の持ち主。\n博愛精神が高く、いち早く他者の気持ちに気づき、そっと手を差し伸べることは、自然とできてしまうのではないでしょうか。\n相手に対する思いやりが強く協調性が高いあなたは、その感受性の高さ故に、自分のことは脇に置き、相手を優先して我慢してしまうことが多いのかもしれません。\nコーラル（珊瑚）は、美しい環境でしか育たないことから、環境に敏感で傷つきやすさを表します。\nけれど、同時に、母なる海に包まれて成長してきた、この美しい生物は私たちの悲しみや苦しみなどの傷を癒してくれるといった浄化のエネルギーも持っているのです。\nこれは、ショックや過去の苦しみを癒してくれるとても優しいエネルギーで本来の愛を伝えることができるということ。\n競争意識ではなく、共同体の意識で人と関わることのできるあなたは、人に安心感を与え、育み育成することができる包容力を持っています。\n温かいエネルギーで心を緩め、ショックやトラウマから立ち直ろうとするサポートができ支え合いながら伸びていくことを助けます。\nあなた自身が過去を乗り越えた分、新しい自分を生み出す力へと変わっていきます。\nその姿は、まさに奥ゆかしさと芯の強さを持ち合わせた女神のようです。' },
  'Mercury_Taurus': { essence: 'コーラルのあなたは芯が強く、線がやわらかいので、自分自身を持ちながらも相手に合わせられたり、共感することが出来る人。\n感受性が豊かなので、いろんな人の状態を感じれる能力に長けていて、誰かを応援したり、支えたりすることも得意です。\n珊瑚（コーラル）はさまざまな魚や貝や海藻たちと共存して生きています。\nその様に、コーラルは全体との調和やつながり、支えあいの心のエネルギーがあります。それは社会や地球等、より大きなものに対して、競争ではなく調和をもたらすエネルギーです。\nあなたは家族や兄弟、恋人、職場や友人間など、人間関係において人と競争することを好みません。\n今までも人と競争することで意欲が上がった、ライバル意識が自分自身を向上させたという経験は少ないのではないでしょうか。\nそして、相手から競争意識やライバル意識を持たれるとあなたの良さが出にくくなり、うまくコミュニケーションが取れなくなることがあります。\nそうなると、言いたいことを抑えてしまう引っ込み思案という形で表れます。\n人と勝ち負けや優劣をつけあうのではなく、平和や調和を大切にします。\n周りのことを敏感に察知しすぎてしまうこともあり、そうなると、プラスのエネルギーだけでなく、マイナスのエネルギーも吸収し、受け取ってしまう傾向が出てしまうようです。\n自分の繊細さや支えあいの心など、ありのままを受け入れられると、いいエネルギーが発せられ、周囲を調和の取れた和やかで穏やかな雰囲気をもたらすことができるでしょう。' },
  'Venus_Taurus': { essence: 'あなたの愛情表現は、美しく柔らかでとても共感的です。\n好きなことや好きな人を女神のような大きな愛のエネルギーで包みます。\n誰かを助けたいと思えば、持ち前の受容力で、側でそっと支えながら、相手のマイナスのエネルギーを緩和し、力になろうとします。\n相手の気持ちを推し量らず、自分の思いをぶつけるといったことは好みません。\nですから、相手の表現がストレートだったり、返答を急かされたり、問い詰められると、言いたいことを抑えてしまい、戸惑ってしまうようです。\n人と競争したり、対立することは好みませんので、ライバルが現われると、そのライバルの気持ちを察してしまい、チャレンジすることから一歩引いてしまう部分も持ち合わせています。\n恥ずかしさや傷つくかもしれないというリスクがあっても、一歩踏み出す勇気が鍵になります。\nあなたが惹かれるものは、美しく癒されるもの。\nそして、そんな生き方をしている人。\n他の人の気持ちに配慮しながら、人との繋がりを大切にする姿や、控えめでなかなか一歩を踏み出せないでいる人を応援したくなるのではないでしょうか。\nそういった人を見ると、一歩踏み出す勇気を与えたいという思いが湧き上がり、あなたの愛が目覚めていきます。\n立ち居振る舞いが美しい人や表現がきれいな人に魅力を感じます。\n美に関すること、五感に関すること、癒しや浄化といったキーワードにも惹かれます。', plus: '美しいもの、五感を満足させるもの、安心感が得られるものに魅かれます。\n浄化作用があるもの、ストレスが緩和できるものを好みます。' },
  'Mars_Taurus': { essence: '五感が満足できるものに足が向かいます。ランチをするにしても、てっとり早く済ますということはなく行くなら、美味しく、盛り付けも美しく、雰囲気がよく、素敵な音楽が流れていて、いい香りが漂うお店に行く、といった具合です。\n美に関連するもの（自分自身が美しくなれる場所や浄化作用があるものや場所）に足が向くようです。\nあなたの持ち前の優しさと協調性で人との繋がりが広がっていきます。\nただ、引っ込み思案な面や、自己犠牲しやすい面があるため、複数で行動する時には、自分の意見を抑えてしまい、相手に合わしてしまうことがあるのではないでしょうか。\n最初はあなたの優しさから、みんなの意見を聞いて、みんなの満足いくものを、と気を配りすぎると、虚しくなったり、報われないという感覚にさいなまれたという経験があるのかもしれません。そんな時は、我慢せず、自己開示することを意識しましょう。', plus: '女性性の柔らかな癒しのエネルギーをもっています。' },
  'Jupiter_Taurus': { essence: 'あなたを幸福へと導く鍵は、コーラルの持つ愛の知恵と共同体です。\nあなたの中で過去にまだ癒されていない気持ちや傷があるなら、自分自身を癒し、浄化してください。\n自分のインナーチャイルドを癒しましょう。\nあなた自身が癒されれば癒されるほど、受容力、包容力といった女性性のパワーを発揮し、多くの人に調和をもたらし支えあう人間関係を創造していきます。\n過去の必要のなくなった関係性や、報われない愛は解放していきましょう。\nそこからはコーラルの特性である共感能力、博愛精神、しなやかな芯の強さがどんどん発揮され、あなたをより輝かせていくことでしょう。\nあなた自身の直感、女神のような感覚、美しいと感じる感性は大切にしてください。\nあなたの他者のエネルギーを感じ取る明晰性をあなた自身に使うのです。\n新しいことへのチャレンジを忘れず、その愛の知恵を使って周囲と分かち合っていくことが拡大へと向かい、一人一人自立しながら支えあう共同体へと発展していきます。' },
  'Saturn_Taurus': { essence: '珊瑚のような優しさと繊細さをもっているあなたは、周りに気を回しすぎて、自分の気持ちを我慢してしまったり、自己犠牲をしてしまうことがあるようです。\nそのため、敏感さが過敏さになってしまい、報われないという感覚を感じやすいのではないでしょうか。\n自分が居心地のよくない環境で我慢すると、傷ついた過去の傷が浮上しやすくなります。\nそんな時は自分自身が快適で幸せにいれる場所へ一歩踏み出すことを覚えていてください。恐れを越え、自己開示をすることが大切です。\n縁の下の力持ちで調和をもたらす博愛主義の傾向が強いので、目立つことや批判される恐れを感じやすいようです。新しいことには不安がつきものです。あなたの持つ芯の強さでどんどんチャレンジしていきましょう。\n過去の必要のなくなった人間関係や報われない愛の深い解放が進めば進むほど、自分自身と人間全体の愛に目覚めていくでしょう。' },
  'Support_Taurus': { essence: 'あなたを一生サポートしてくれているスピリットカラーはコーラルです。\nレッドの『愛』にゴールドの『知恵』が加わるとコーラル『愛の知恵』となります。\nコーラル（珊瑚）は、美しい環境でしか育ちません。\nそういった側面として、環境に敏感で傷つきやすさを表します。\n知恵を使い自分自身や他の人に配慮し、周囲の環境を美しくすることを意味します。\n今までも、もしかしたら環境によって自分自身の状態が大きく変化するということがあったのではないでしょうか。\n自分自身の状態が環境によって左右されやすいので、そういった自分に気づいたら、自分自身が快適に幸せに、ポジティブで明るい場所へ一歩踏みだしてみてください。\n珊瑚は藻や岩と共生しながら、単体の珊瑚が集合体を形成して、大きな珊瑚礁へと育っていきます。\nこれは『一人一人自立しながら支えあう共同体』という新しい時代感覚を表します。\n過去の必要のなくなった関係性や、報われない愛の深い解放とともに、自分自身と人間全体の愛に目覚めていき、新しい人間として新時代を生きることを示します。\nこれは、過去を乗り越えた分、新しい自分を生み出す力があるということ。\nそして、いろんな人の状態を感じ取り愛を与えられる女性性のパワーと調和する力で人と共に生きていくことができます。\n傷ついた過去の傷が浮上したり、ついつい我慢して自己犠牲してしまったり、引っ込み思案な部分が出てきてしまったとしてもコーラルはいつでもあなたのサポートをしています。\n・珊瑚のような繊細さと優しさ\n・愛を生きる知恵\n・浄化作用\n・多くの人と繋がりをもつことができる\n・共に生きていくことができる\n・調和をもたらす力\n・自分で自分を癒す力\n・感受性の強さ\n・いろんな人の状態を感じ取れる能力\n・感じ取り、愛を与えられるパワー\n・過去を乗り越えた分、新しい自分を生み出す力\n・共同体感覚\n・育成する力\n・調和する力\n・支えあう人間関係を作る能力\n・無から有を創る力\n・他者のエネルギーを感じ取る明晰性\n・癒す力・美しい表現力\n・安心感を与える\n・人間全体の愛\n・女性性のパワー\n・受容力、包容力に長けている\n・本来の愛を伝える力\n・緩和する力\n・マイナスをプラスに変える再生力\nあなたがつらい時も嬉しい時もどんな時もコーラルはあなたのサポートをしています。\nもし、サポートが必要な時はコーラルのパワーを使ってください。' },
  'YearColor_Taurus': { essence: '今年のあなたはコーラルが力強い味方となります。\nコーラルは共同体感覚、浄化、受容力、女性性、五感や美に関すること、などといった意味があります。\nあなたの優しさ、思いやり、受容力が増し、周りの人との繋がりが広がっていく年となるでしょう。\nあなたも自分自身の愛が広がっているのを感じられているのではないでしょうか。\n今年はあなたの女性性のエネルギー（受容力や包容力、五感を発展させるもの、浄化するもの、育成するもの）が溢れています。\nもし、あなたの中で、過去にまだ癒されてない気持ちや、傷があるなら、自分自身を癒し、浄化していくことです。\nそして過去の必要のなくなった関係性からは自分自身を解き放していきましょう。\n解放が進めば、進むほど、自分自身と人間全体の愛に目覚め、より快適に、より幸せに明るくポジティブなフィールドが広がっていきます。\n美に対する関心も高まります。内面の美しさだけではなく、外面の美しさにも磨きがかかる年となりそうです。\n受容力、包容力といった女性性のパワーを発揮すればするほど、多くの人に調和をもたらし支えあう人間関係を創造していく。\nそんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Gemini': { essence: 'オレンジが表すのは、社交性、ユーモア、陽気さです。\n物事のポジティブな側面にフォーカスすることが得意で何事にも楽しみを見つける力があります。\nあなたは人との繋がりをサポートできる力が備わっており、色んな人のポジティブな面を見つける能力が高く、多くの人と楽しみを共有することができるのではないでしょうか。\nですから、他者のプラスの側面を相手が受け取りやすいように伝えることができます。\nその伝え方はとても分かりやすく、時にはユーモアも使いながら楽しく伝えます。\nそんなあなたの楽しさに触れ、周りの人は生き生きとはつらつとしたエネルギーを取り戻していくでしょう。\n周りの人に対してだけでなく、自分で自分をケアできる力もあり、自立した分、至福のエネルギーが増し、自分らしく輝くことができます。\nオレンジは自分の足で立つ、「自立」というテーマがあります。\nそういった側面として手放すことへの躊躇が表れやすいようです。\n執着心のコントロールや過去の傷の解放、悪習慣からの脱却などへの難しさを感じることがあるかもしれません。\n過去の失敗の記憶が蘇ったり、孤独に対する怖さが浮上したりと自信のなさがでてくることがあるのでしょう。\nそんな時は、感情を溜め込まず、自分の気持ちを洞察し、自分自身の欲求を認めてあげることでバランスがとれていくでしょう。' },
  'SunRealize_Gemini': { plus: 'あなたは何事にも楽しむことが得意な人です。\nあなたの心の底からの「楽しい！」「嬉しい！」というエネルギーは、太陽のようで多くの人に幸せと喜びを与えます。\nそれはまさに『あなたが喜んでいれば幸せになる』という状態。\nあなたの豊かさに人や物が集まってくるでしょう。\n内側からの深い直感を使い、その神聖で深遠なエネルギーで人々の過去のショックやトラウマ、傷を解放し、傷ついてバラバラになった人たちの心をまとめていきます。\nコミュニティ作りの才能を発揮し、あなたの生き生きとした輝きで、多くの人との繋がりをサポートし、その縁はどんどんと広がっていくでしょう。' },
  'Moon_Gemini': { essence: 'オレンジには、みんなとおしゃべりしたり笑い合ったりする時間をより楽しくする社交的な明るいエネルギーがあります。\n心の底から「楽しい！」「嬉しい！」と思える体験はあなたにとってとても至福を感じることです。\n明るさ、ポジティブな温かさがオレンジの特徴です。\n人生における困難なことも、笑いとユーモアで深刻さを越えていくことができる人です。\nだからこそ真剣に、徹底的に「私」が喜ぶことをやってみましょう。\nそのことに罪悪感を感じる必要はありません。\nあなたの歓喜や至福のエネルギーは、太陽のように多くの人に幸せと喜びを与えるからです。\nあなたが輝くと、あなたの輝きで周りを照らし出し、その明るさに人や物が集まるのです。\nそしてそんな生き方を望んでいるのではないでしょうか。\nオレンジは「自立」というテーマがあります。\nこの自立というのは、自分で自分の人生に責任をとるということです。\n地に足をつけ、自分らしく生きている状態のことです。\n人に依存している状態ですと、そこには必ず期待が生まれてしまいます。\nそして、期待には必ず失望がセットでついてきてしまうのです。\nいつもその「誰か」が自分の思いどおりに行動してくれるとは限らないので、相手の言動に一喜一憂してしまいます。\n一喜一憂する自分から、自立した自分らしく輝く生き方をしたいという思いが強いのでしょう。\nたくさんの知識、学びをもっているので、準備万端でなくても、その学びを使い、自分でやるという経験を少しずつ増やしていくと「一人でこんなにできるんだ！」と実感し、力強さが生まれてきます。\nそしてその積み重ねた経験が自信となり、生き生きとはつらつとしたあなたの輝きに磨きがかかっていきます。\nオレンジの朗らかさ、無邪気さを取り入れ、負の連鎖を断ち切るパワーを使い、人生を作り上げていく楽しさを味わいつくしてください。' },
  'Mercury_Gemini': { essence: 'オレンジのあなたは社交的で活発な人間関係を作ることができる人。\nユーモアをもって人とコミュニケーションすることができます。\n物事のポジティブな側面にフォーカスし、何事にも楽しみを見つけ出し、コミュニティを作っていく才能があります。\n一見、バラバラなものの中から共通のものを見つけ出したり、学びの楽しさや、物事を分かりやすく伝えることができるのではないでしょうか。\nそんなあなたの周りは明るく照らされ、そこにいる人たちも陽気で楽しい雰囲気を味わっているでしょう。\n時には過去のショックやトラウマが浮上したり、過去の関係性にこだわりを持ったりすることがあるかもしれません。\nネガティブな感情は持ってはいけないと思っている傾向があり、感情を溜め込んでしまうところがあります。\n感情を溜め込んでしまうと、自分を特別に扱ってほしいと思い、人や情報をコントロールしたくなってしまうことがあるかもしれません。\n必要のないものや同じものを買い込んでしまったりと所有欲や物欲の強さが出てくることがあります。\n物がたくさんある＝安心感という考えがあり、断捨離しようと頭では思っても、なかなか行動に移すことができず、また別の物が欲しくなるということがあるようです。\nですが、多くの経験に基づいた自信と深い洞察力、内側からの深い直感を持っているので、自律した分、負の連鎖を断ち切り、周りの人の傷やショック、トラウマを解放する関わりができるようになります。' },
  'Venus_Gemini': { essence: 'あなたの愛情表現は、ポジティブで温かく、ユーモアがあります。\n好きなことや好きな人には「嬉しい！楽しい！」という気持ちを素直に表現されるのではないでしょうか。\n例え、言葉にしていなくてもそんなあなたの至福のエネルギーは溢れています。\nたくさんお喋りしたり笑い合ったり、たくさんの体験を共有したいと思うようです。\n色々な体験を話し合う中で、お互いの違いが出てきたとしても、あなたはまたそこから共通のものを見つけ出すことが得意です。\n人に期待して失望したり、相手に寄りかかってしまったりと共依存の関係を作りやすい傾向があるようです。\n過去にショックなことやトラウマを持っているのなら自分自身を癒し、執着しているもの、今のあなたに必要のないものをどんどん解放していきましょう。\nあなたが自律した分、真のパートナーシップを結んでいくことができ、人生が展開して可能性が何倍にも広がっていきます。\nあなたが惹かれるものは、温かで楽しく豊かなもの。\nそして、そんな生き方をしている人。\n人との繋がりを大切にし、ユーモアがあって、知識を分かりやすく教えてくれるような人に魅力を感じます。\n誰かが落ち込んでいると、あなたは相手が喜ぶことを洞察し、生き生きとはつらつとしたエネルギーで太陽のように明るく心を照らしてあげるのでしょう。\n相手はあなたのそんな温かさに触れ、プラス思考で考えられたり、自信を取り戻すことができるのです。\nそれはあなたが人のポジティブな側面にフォーカスできるからなのです。', plus: '社交的で活発な人間関係がある明るいコミュニティや学びの場。\n過去のショックやトラウマを解放できると感じるところや、負の連鎖を断ち切れるところ、依存から自立へと向かっていけるという感覚を感じ取れるものや場所に魅力を感じるようです。\n社交的で活発な人間関係がある明るいコミュニティなどに属することを望みます。' },
  'Mars_Gemini': { essence: '楽しく人が集まり学びがあるものに足が向かいます。\n何かを学ぶにしても、ただ黙々と机に向かって取り組むようなところより、たくさんの人達とコミュニケーションを取りながら楽しさを共有できるような体験型の場を好みます。\n縁が広がったり、人とのコミュニティーが活発なところへ足が向かいます。\nあなたの持ち前の温かさ、陽気さ、ユーモアで人と喜び、縁を広げていきます。\n自信のなさや特別に扱ってほしいという気持ちが強くなると、学びが活用できなくなったり、集まりから遠ざかろうとしてしまう傾向があるようです。\n知識や物、人も『集める』ということが好きなので、ショッピングや食べ歩きを楽しんだり、生き生きと思いのままに行動することができます。\n自分自身の欲求にバランスをとり、執着していることがあれば解放していきましょう。', plus: 'はつらつとした温かいポジティブなエネルギーをもっています。' },
  'Jupiter_Gemini': { essence: 'あなたを幸福へと導く鍵は、至福・歓喜・陽気さ・楽しさがキーワードとなります。\n一言で言うと、あなた自身が至福を感じるものを選んでいくことが、あなたの発展や拡大に向かっていくのです。\n自分自身が楽しいと思うもの、喜びを感じるもの。\nあなたは自立したうえでたくさんの人々と楽しさを共有し、社交的で活発な人間関係を作り出すことができます。\n過去のショックやトラウマ、執着心の強さをコントロールできるようになると、あなたは自分らしくはつらつと輝き、何事にも楽しみを見つけ出して思いのままに行動できるようになっていきます。\nあなたが自立した分、真の人間関係を築くことができ、人生が展開して可能性が何倍にも広がっていきます。\nそれに応じて物や人が集まり、縁が広がり、太陽のように周りをどんどん明るく照らしていくでしょう。' },
  'Saturn_Gemini': { essence: '過去のショックやトラウマが残っているのかもしれません。\n過去の失敗への恐怖が時折、顔を出してしまうようです。\n執着心の強さをコントロールできず手放せずにいると共依存の関係性を作りやすくなり、自信のなさや自立できないといった思いにさいなまれてしまいます。\nその状態になると、ついつい必要のない物や同じ物を買い込んでしまったり、色々と学んできたことが活用できなくなってしまうことが。\n難しく考えず、自分らしく個性を生きることと自分自身の欲求にバランスをとることです。\n執着や孤独への恐れ、過去のトラウマなどに気づいたら、あなた自身が楽しいと思える空間や生き生きとはつらつとしたエネルギーの空間に身を置いたり、自分らしく在れるコミュニティに参加すると、バランスのとれた心のセンター（真ん中）に戻っていきます。' },
  'Support_Gemini': { essence: 'あなたを一生サポートしてくれているスピリットカラーはオレンジです。\nオレンジは自分の足で立つ、自立と関連しています。\nこの自立というのは、自分で自分の人生に責任をとるということです。\n地に足をつけ、自分らしく生きている状態のことです。\n自立したうえで、たくさんの人々と楽しさを共有し、社交的で活発な人間関係を持つことを示します。\nあなたが喜び、楽しく過ごしていれば、そのエネルギーで人や物が集まってくるのです。\nその生き生きとはつらつとしたエネルギーは至福、歓喜という豊かさのエネルギー。\nまた、過去からの多くの経験に基づいた自信と、深い洞察力、内側からの深い直感を持つことを示します。\nその洞察力から、物事のポジティブな側面を見つけ出したり、バラバラなものを一つにまとめることができたり、その中から共通のものを見つけたりする力を持ちます。\n逆の意味では、自分に自信がない、自立できないと感じ、依存しやすく、人間関係が困難な状態を示します。\nまた、過去の関係性や執着からの解放に関係しています。\nオレンジは、溜まった過去の深い感情や、過去のショックやトラウマを解放して、傷つきバラバラになったオーラを再び、ひとつにまとめる色です。\nあなたが自信がなくなったり、過去のショックが浮上し、心がバラバラになったように感じることがあったとしてもオレンジはいつもあなたをサポートしています。\n・過去のショックやトラウマ、傷を解放する力。\n・多くの経験に基づいた自信。\n・プラス思考。\n・人との繋がりをサポートできる能力。\n・ひとつにまとめることのできる力。\n・神聖で深遠なエネルギーをもつ。\n・自分らしく輝く。\n・コミュニティ作りの才能。\n・自分で自分をケアする力。\n・縁を広げる。\n・明るくユーモアに満ちた生き方ができる。\n・自立し真の人間関係を築く力。\n・新しく人生を作り上げていく粘り強さを持つ。\n・物事のポジティブな側面にフォーカスする。\n・何事にも楽しみを見つけ出す力。\n・思いのままに行動できる力。\n・楽しみの共有。\n・生き生きとはつらつとしたエネルギーをもつ。\n・負の連鎖を断ち切るパワー。\n・太陽のように周りを明るく照らす力。\n・物や人が集まる豊かさをもつ。\nあなたがつらい時も嬉しい時もどんな時もオレンジはあなたのサポートをしています。\nもし、サポートが必要な時はオレンジのパワーを使ってください。' },
  'YearColor_Gemini': { essence: '今年のあなたはオレンジが力強い味方となります。\nオレンジは至福、ユーモア、社交性、陽気さ、楽しさなどといった意味があります。\nあなたのユーモア、陽気さ、明るさ、楽しさが増し、周りの人との繋がりが広がっていく年となるでしょう。\nあなたも自分自身の豊かさが広がっているのを感じられているのではないでしょうか。\n今年はあなたの至福のエネルギー（喜びや楽しさ、社交性や陽気さ）が溢れています。\nもし、あなたの中で、過去にまだ完了していない人間関係や、傷やトラウマがあるなら、自分自身を癒し、手放していくことです。\nそして今のあなたに必要でないものには終わりを告げ次に進んでいきましょう。\n人間関係かもしれませんし、精神面かもしれませんし、物かもしれません。\nあなたは洞察力がありますのでそれが何かを知っています。\nきっとあなた自身が今、自覚のある『ため過ぎたもの』です。\n解放が進めば、進むほど、自分自身が軽くなり、より今の人間関係が明るく、楽しいものになり、あなたをとりまくコミュニティが活発になって、よりポジティブなフィールドが広がっていきます。\n学びに対する楽しみも高まります。自分に磨きがかかる年となりそうです。\n不必要なものを手放し、与えれば与えるほど、明るい人間関係を創造し、自分らしく輝いていく。\nそんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Cancer': { essence: 'ゴールドは内なる智恵。\n開拓者精神に溢れ、学んだ知識が多くの体験を通して知恵になっていることを感じ取ることができます。\n研究熱心で興味のあることには周りが驚くほどの集中力を発揮するとても探究心の強さをもっています。\nあなたは深いところまで本質を見抜く力に長けた鋭い洞察力の持ち主。\n長い付き合いではない人とでも少し関わるだけで、相手の本質を感じれる鋭い感性を持っています。\nそれ故、その人の深い闇の部分さえも感じ取ってしまい、どこまで入り込んでいいのかを迷ってしまうところがあるのではないでしょうか。\nそれと同じ様に自分自身に対しても、自分の中にある深い闇の部分を感じ取ってしまうことがあるでしょう。\n悲しみや苦しみといった自分が触れたくない部分、心の中のダークな部分を見つめるのは人は通り過ぎようとしますが、向き合うことが自分の価値を見出し輝くことができます。\n自己価値感や自分の本質を感じることができずにいると、理由の分からない恐れや深い混乱を感じてしまい、形で抑えられたり、決まったことで落ち着こうとするところが出てしまうのでしょう。\n宇宙の法則、内なる神の存在を示す生き方、お金を集めやすいエネルギー、引き寄せを実践し証明できるパワーといった意味がゴールドにはあります。\n自分の美しさとギフトに気づき、可能性を実現するために実際に行動したときに、幸運を引き寄せていきます。' },
  'SunRealize_Cancer': { plus: '独自の世界を形にすることができる能力の持ち主。\n自己価値が高く、知恵を使い、多くのものを引き寄せていきます。\n持ち前の本質を見抜く力、共感力を発揮し、人が正直に生きること、人の可能性を開くことをサポートしていくでしょう。\nあなたには引き寄せを実践し証明できるパワーがあります。\nですから宇宙の法則、内なる神の存在を示す生き方を通し、新しい価値を創造し、高次なものに引き上げる力を発揮していくでしょう。\nありのままで生きることで内面の輝きが自然と周りに伝わっていきます。\n存在そのもので与えられるパワーを持っているからです。\n他者が自分自身の価値を気づくことを助ける力を持ち、スターの気質を活かして自ずとお金が集まります。' },
  'Moon_Cancer': { essence: 'ゴールドはどの時代においても、価値ある金属として古代より尊ばれてきました。\n古代からゴールドには、魅了する特別な輝きがあります。\nゴールドはイエローとレッドを合わせた色。\n個人（イエロー）に光が入り、輝き始めた色です。\nゴールドはあなたの中にも輝いています。\nあなたは自分自身の価値を知っている方です。\n華やかさと高貴さを持ち、存在感のあるあなたのその光に引き寄せられるように人が集まってきます。あなたが輝けば、その輝きはおのずと周りを照らしていきます。\nそしてそんな輝いた生き方を求めています。\n自分らしく輝くということは、自分のよさを自分で見出して磨いていくということ。\nそれを楽しみながらやることに全力をかけるということ。\nみんなと同じなる必要もありませんし、自分以外の誰かになろうとする必要もありません。\nそのエネルギーを本当に自分のやりたいこと、自分らしく表現していくことに向けることが大切です。\n自分自身の輝きに気づくことができないとき、生きることに恐れを持ち始めます。\n自分を信じることができなくなるのです。\n足りないところを見るのではなく、今あるものに光をあて、今自分が持っている美しさを認めたとき、輝き始めます。\n誰かに自分の価値を認めてもらうためにいい子でいたり、自分を捨てたり虚勢を張ったりする必要はありません。\n自己価値、自信を思い出したあなたは自然体で、黙っていても光り輝いていきます。\nゴールドはオレンジ（喜び）とイエロー（個人）のコンビネーションでもあるのです。\n自分の価値を見出し、喜びを持って『私』を表現していきましょう。\n学んだ知識を自分なりに消化吸収して生まれた智恵を象徴するのがゴールドです。\nなかなか満足できないという思いをお持ちなので、答えを出すことを急ぐのではなく、柔軟性や曖昧さ、中途半端に対する理解を深めてご自身のこだわりを手放していきましょう。' },
  'Mercury_Cancer': { essence: 'ゴールドのあなたは深いところまで本質を見抜く力に長けた鋭い洞察力の持ち主。\n最初は外側からの刺激に対して『固さ』がでてしまうかもしれません。\n得体の知らない訳の分からないもの、未知のものに対しては恐怖を感じやすいようです。\nですがその中に本質を見出したり、自分の中で納得できると、深く知りたいという探究心が湧き出し、熱心に研究するようです。\nこの本質は何か、どうすればその価値に気づけるか、どうすればこの価値をより引き上げられるか、という様に物事を捉えます。\n本質を感じられずにいると、理由の分からない恐れや深い混乱を感じてしまうことがあるかもしれません。\n人とのコミュニケーションパターンも反応の仕方はよく似ていて、初めての人と出会う時は、相手がどんな人なのか、その人の本質を見極めようと努めます。\n（この人は心から信頼できる人かどうか。本音で表現しているかどうか。自分のテリトリーに入れていいかどうか。誠実かどうか。など）\nですから最初は少しお堅いコミュニケーションになりがちですが、一旦その人の本質を知り、受け入れると自信が増し、喜びと幸せを感じながらコミュニケーションを楽しみます。\nあなたがありのままでいることで、内面の輝きが自然に周りに伝わるでしょう。\nあなたは存在そのもので与えられるスターの気質があり、その光に引き寄せられるように人が集まります。\nコミュニケーションを通じて、持ち前の本質を見抜く力、共感能力を発揮し、人が正直に生きる事、人の可能性を開くこと、人が自分自身の価値に気づいていくことをサポートします。\n自己価値感を感じられずにいるときは、深く考えすぎたり、自己卑下したり、もしくは無理に自信過剰になりすぎたりとバランスが崩れてしまいます。\nそんなときは違う者になろうと努力するのではなく、ありのままの自分自身で十分だということ、存在そのもので与えられるパワーを持っているという事を思い出してください。' },
  'Venus_Cancer': { essence: 'あなたの愛情表現は、一言で言うと、積極的であり慎重です。\nというのは、それはゴールドの持つ、『本質を見極めて深いところまで見抜く』ということと『深く知りたい探究心』という両方の資質があるからです。\n好きな人や好きなことに対してあなたは深く見つめて本心や本質を知ろうととても積極的に熱心に努めるのではないでしょうか。\nその分、本質や本心が分からず納得できない状態のままでは不安を感じ動けなくなってしまいます。\nあなたの中でＧＯサインが出るまでは自分の気持ちを表現することは少ないのでしょう。ですから、慎重になりがち。\n口から出まかせの言葉や軽いノリでお世辞を言うようなことを嫌い、本心で思っていることを誠実に表現します。\nそして相手にも同じように誠実であることを求めます。\nあなたが惹かれるのは独自の世界を持っていて自ら創造している誠実な人。\n愛情表現は、曖昧ではなく、具体的にどこがどんな風に好きなのかを伝えます。\n説明ができない感覚は違和感を感じ、戸惑ってしまうことがあるでしょう。\n相手からの曖昧さや中途半端な愛の表現には満足することはなく、自分自身の本質を知ってきちんと答えを出してほしいと思うようです。\nあなたは引き寄せのパワー、スターの気質を持っています。自分の価値を感じながらありのままの自分で十分だという感覚で過ごしていると、好きな人や好きなものが自然と集まってきたという経験も多いのでしょう。', plus: '重厚感、高級感があるもの、パワーがあるものを好み、自己価値を高めてくれるものに惹かれます。その他、宇宙の法則や内なる神の存在を示すものなど、高次なものに引き上げるものに惹かれるのではないでしょうか。' },
  'Mars_Cancer': { essence: '自己価値が高まるところに足が向かいます。\n自分自身の自己価値を高め、学んだものを体験を通して知恵にかえていくことに意欲を感じるのではないでしょうか。\n自分の価値を否定している間はなかなか行動できない傾向がありますが、ありのままの自分に許可を出し行動した分、それがあなたの自信となり、輝きに磨きをかけていくのです。\nそこから独自の世界や新しい価値を創造することに繋げていくことがあるかもしれません。\nあなたの開拓者精神、深く知ろうとする探究心があなたの目標達成へ向かわせます。\nゴールドは自信と輝きの色。華やかさがあり、経済に関する力もあります。\nゴールドは引き寄せの力も強いので、情報やお金を集めるのも得意です。\nあなたがありのままでいることで、内面の輝きが周囲に伝わり、その光に引き寄せられるように人も集まってきます。', plus: '高貴で華やか、重厚感を感じさせるエネルギーを持っています。' },
  'Jupiter_Cancer': { essence: 'あなたを幸福へと導く鍵は、自己価値・知恵・開拓者精神・本質の見極めがキーワードとなります。\nあなたが深く知りたいと思うものを知恵を使って選択し、探求していくことが、あなたの発展に向かっていくのです。\nあなたが本質を知りたいと思うもの、熱心になれるもの、開拓していきたいと思う分野。\nあなたは深いところまで本質を見抜く力に長け、鋭い洞察力をもっています。\n多くの体験を通して学んだ知識を知恵に変えることが得意なので、決まったことで落ち着こうとせず、新しい価値を創造し、独自の世界を探求していくことが拡大に向かっていきます。\n自己卑下や自分を大きく見せることなく、ありのままの自分の価値を認め、自分の本質を感じとるとき、あなたのスターの気質はより輝きを増し、その光に集まるように、経済面・人間関係など多くのものを引き寄せていきます。\nそしてあなたの太陽のような明るさ、内面の輝きは自然と周りに伝わり、人が自分自身の価値に気づくことをサポートしていくでしょう。' },
  'Saturn_Cancer': { essence: '多くの体験を通して学んだ知識を知恵に変えることが得意なあなたは、その分、自分の本質を感じることができずにいると理由の分からない恐れや深い混乱を感じてしまうことがあるのではないでしょうか。\n知識が消化不良を起こすと深い混乱が起きてしまいます。\nまた自分の中の叡智を信頼できないとき、恐怖が生まれてしまいます。\nここでいう恐怖はわけのわからないところから来る深い恐怖を表します。\nなんだか分からないけど怖いという気持ちを越えるためには、自分の価値、自分の中の光を思い出すしかありません。また、明晰に見て識別するということが大事です。\n識別するとは裁くのではなく、物事を正しく見て理解するということです。\n物事の深みを理解し受け入れていくということです。\n自分の価値から目を背けると、本質を見失いやすくなり、納得するまで動けなくなる傾向があるかもしれません。\n研究熱心なため、納得いくまで動けなかったり、深く考えすぎたり、こだわりを捨てきれずなかなか満足できないこともあるでしょう。\nそんな時は曖昧なものを受け入れたり、ありのままの自分に許可を出す事を意識して\nすぐに答えがでないことに対しても受け入れていくことが大切です。' },
  'Support_Cancer': { essence: 'あなたを一生サポートしてくれているスピリットカラーはゴールドです。\nゴールドはオレンジ（喜び）とイエロー（個人）のコンビネーション。\n自分の価値を見出し、喜びを持って『私』を表現することにサポートしてくれます。\n学んだ知識を多くの体験を通して自分なりに消化吸収して生まれた知恵を象徴するのがゴールドです。\n自信と輝きの色。\n知恵の光は真実を照らし、表面的なことにだまされずに識別ができます。\nその反面、自分の本質を感じることができずにいると、理由の分からない恐れや深い混乱を感じてしまいます。\nまた、黄金は時を経ても変わらない価値を持ち続けます。\n身体のゴールドのエリアは、真のオーラが秘められた場所（おへその少し上、少し内側）であり、太陽のように自ら輝く、自己価値を表し、自分の知恵と本来のパワーを発揮することができます。\nあなたが自分の本質を感じられなくなったり、理由の分からない恐れを感じることがあったとしてもゴールドはいつもあなたをサポートしています。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、このメッセージから勇気やヒントをもらってください。\n・自分の内側にもつ、自分だけの輝きと価値を照らす力。\n・気づきをサポートする力。\n・豊かな智恵と賢さをもつ。\n・高貴さ。\n・重厚感。\n・太陽のような明るさ。\n・研究熱心。\n・輝く光のような自信に溢れている。\n・他者が自分自身の価値に気づくことを助けられる能力。\n・スターの気質をもつ。\n・ありのままでいることで、内面の輝きが自然に周りに伝わる。\n・華やかさ。\n・経済に関する力。\n・その光に引き寄せられるように人が集まる。\n・存在そのもので与えられるパワー。\n・独自の世界を広げられる力。\n・高次なものに引き上げる力をもつ。\n・新しい価値を創造する力。\n・共感力。\n・引き寄せを実践し証明できるパワーがある。\n・宇宙の法則、内なる神の存在を示す生き方ができる力。\n・お金を集めやすいエネルギー。\nあなたがつらい時も嬉しい時もどんな時もゴールドはあなたのサポートをしています。\nもし、サポートが必要な時はゴールドのパワーを思い出してください。' },
  'YearColor_Cancer': { essence: '今年のあなたはゴールドが力強い味方となります。\nゴールドは自己価値、知恵、叡智、深い喜び、存在感、引き寄せの力を持つ、などといった意味があります。\nあなたの内側に持つ輝き、価値が照らし出され、輝く光のような自信が溢れてくる年となるでしょう。\nあなたも自分自身の内側から湧き出るような深い幸せを感じられているのではないでしょうか。\n太陽のような明るさで周りの人が自分自身の価値に気づくことをサポートし、存在そのもので与えられる自分自身のパワーを感じとることが出来るでしょう。\n今年はあなたの開拓者精神（深く知りたいという探究心、研究への熱意、本質を見極めたいという欲求）が高まります。\nもしかすると、答えが出ないことの苛立ちやなかなか満足できず、こだわりが出てしまうことがあるかもしれません。\n柔軟に物事に向き合うことで、中途半端なものやことに対する理解を深めていくことができるでしょう。\nそして学んだ知識が、色々な体験を通して自分自身の知恵になり、新しい価値を創造する力となっていきます。\nありのままでいることで、内面の輝きが自然と周りに伝わっていき、その光に引き寄せられるように人、お金が集まってくる。\nそんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Leo': { essence: 'イエローが表すのは、喜び、明晰性、明るさ、知性、ユーモアです。\n機知に富んでいて、周囲を温かく明るく楽しませる力があります。\nあなたは自分に対しても、他人に対しても肯定感が高く、自分の意思を明確に持ち、自分の個性を大切にすることができるのではないでしょうか。\nイエローには『自己を知る』という意味があります。\nどんな状況でもポジティブに捉えて、暗闇の中に光を見出す力を与えてくれる色です。\nあなたは自分自身が喜び、楽しめる事を学び、学びを消化していく事で自分を知ります。自分を知るという事は、他の人との違いに気づく事でもあります。\n人を気にしてしまい、自分らしく振舞えないときに、緊張や恐れを感じやすくなったり、情報が消化しきれないと混乱したり、知的な反面、考えすぎて不安になることもあるかもしれません。そんな時は、あなたの個性を輝かす生き方を思い出して下さい。\nイエローのあなたはとにかく面白いことが大好きで好奇心が旺盛です。\nインスピレーションや閃きを大切にし、わくわく楽しいと思うことに集中して下さい。\nそうする事で周りの人に個性を生きるメッセージを伝える事もできるでしょう。\n真夏の太陽のように、明るく、陽気でポジティブ。\nイエローはスターの気質でもあるので、いつも場の中心で楽しく自分らしくいられる人です。\n人との違いを個性と認め、自他共にその個性を大切に出来る人。\nどんな状況に置かれても、イエローは光の質ですから、暗闇の状況の中から、一筋の光を見出せる力をもった人です。\n自分を知る事、学ぶ事をめいいっぱい楽しむ事ができるでしょう。' },
  'SunRealize_Leo': { plus: 'あなたの無邪気なエネルギーは他者を笑いやユーモアで楽しませる能力があります。\nまた知識が豊富で頭の回転も早く、知的でシャープ。\n個性を発揮し、場の中心となり、リーダーシップを発揮します。\n人をワクワクと躍動させ、周りに勇気と希望を与えるエンターティナーです。\n学ぶことに意欲的で、たくさんの自分への気づきを増やして学びを消化していきます。\nあなたののびのびとした生き方、どんな状況でもポジティブに捉えることのできるパワーは、多くの人に明るさと温かさを与え、個性を生きることの大切さ、個性を発揮するためのメッセージを伝えていくでしょう。\nそのメッセージはまさに多くの人にとって、夢や希望を与えてくれるインスピレーションの光となります。' },
  'Moon_Leo': { essence: 'イエローは太陽の色。幸せ、喜びの色です。\n喜び、幸せを感じているときあなたは真夏の太陽のようにきらきらと輝き、大いに自分らしさを発揮できている実感があるのではないでしょうか。\n自分だけでなく周囲の人にも明るさや温かさを与えています。\nイエローは私たちを元気づけ明るくしてくれます。\nエンターテイメント性に長け、どんな状況でもポジティブに捉えて他者をユーモアで喜ばせたり、わくわくと楽しいことをすることで希望や夢を与えることができる人です。\n純粋な創造性を発揮し、個性を生きるメッセージを伝え、自分らしくのびのびと生きたいという思い、そして自分の意思を明確に持ち、リーダーシップをとって王道を歩いて生きていきたいという気持ちをもっているのいます。\nイエローは、光の輝きを表現するポジティブな色。\n光は意識。光をあてるとは、自分に意識を向けることです。\n自分にたくさんの光をあてると、無意識の中にあったもの、心の闇の中にあったものを照らし出します。照らし出せばあなたはそこを光で満たすことができるのです。\n気づくことが光をあてることになるのです。\nそうしてその闇を手放すことができるようになるでしょう。\nあなたはどんな状況でもインスピレーションの光となり暗闇の中に光を見出す力を持っています。\nイエローは明晰性、知性を表します。\nあなたは楽しめることを学び、学びを消化して理解していくことで、自分を知っていきます。\n取り入れた知識をきちんと消化吸収できないとき、明晰性が上手に発揮されないとき、混乱に陥ってしまうことがあるのでしょう。\n自分は何がしたいのか、何を求めているのか分からないといった考えすぎてこんがらがった状態や常にパーフェクトでなければならないという思い込みにはまった状態のことを表します。\n混乱しやすいのは、知性があり考えることが得意だということ。\n頭が切れるあまり、物事を難しく考えがちになる傾向があるようです。\nそしてイエローには「自己を知る」という意味があります。\n無意識のパターンから自由になっていくこと、条件づけから解放されること、それができてくると「幸せな自分」を心から楽しむことができるようになってきます。\n光があたると影は消え、気づきが起きると、心が明るくなります。' },
  'Mercury_Leo': { essence: 'イエローのあなたは快活な明るい人間関係を作ることができる人。\nどんな状況の中でもポジティブに捉えることができ、そこから光を見つけ出し、楽しくコミュニケーションをとる才能があります。\nわくわく楽しいことを考えたり、どうすれば人が喜んでくれるかということを考えるのは得意なのではないでしょうか。\nそんなあなたもそこにいる人たちもユーモア溢れる陽気な雰囲気を味わっているでしょう。\n時には考えすぎて混乱したり、常にパーフェクトでなければいけないという思い込みが出てくることがあるかもしれません。\n頭が切れるあまり、外側からの刺激に対して最初は物事を難しく考えがちになるようです。\n考えすぎてしまって、不安や緊張感を味わうことが多いのかもしれません。\nですが、個性を発揮しても大丈夫だと安心すると、真夏の太陽のように、明るく楽しくポジティブに事にあたることができます。\n明晰に物事を捉えることが出来ると、素早く決断をします。\n人とのコミュニケーションパターンも初めての人と出会う時は、相手がどんな人なのか少し緊張感と不安をもっているのかもしれません。\n自分らしく振舞えるかどうか、のびのびとリラックスして関われるかどうか、という様に物事や人、出来事に対して捉えるようです。\nですから最初は人を気にしすぎる一面がありますが、一旦安心すると、他者を笑いやユーモアで喜ばせたり、無邪気さと快活さで人を躍動させていきます。\n機知に富んでいて周囲を楽しませる明るさを持っています。\nいつの間にか場の中心となっていることが多いのでしょう。' },
  'Venus_Leo': { essence: 'あなたの愛情表現は、楽しく明るくて無邪気です。\n好きなことや好きな人を笑顔にしたいという思いがあり、何が喜んでもらえるか考え、楽しませようと努めるのではないでしょうか。\nうまくいくように頭をフル回転させ、知性と明晰性を発揮させます。\n時にはエンターテイメント性を発揮し、ユーモアを使い無邪気に自分を表現します。\nうまくいくと思えたらすばやく決断し、一歩を踏み出しますが、考えた結果うまくいかないかもと結論づけてしまうと、光を失ったかのようにあなたの個性が発揮できなくなるようです。\n人目を気にしすぎて自分らしく振舞えない時は緊張や恐れを感じて混乱してしまう傾向があるのでしょう。\nそんな時はリラックスし、自分に光をあて、何を怖がる必要があるのか、どんな思い込みが自分を押さえているのかを意識して見てみることが鍵になります。\nあなたが惹かれるものは、ポジティブでわくわくと躍動させてくれるもの。\nそして知的でシャープなものや自分を知ることのできるもの。\n明るくユーモアに富んだ人や賢く知性を感じる人に魅力を感じるのでしょう。\nそういった人を見ると、ワクワクと元気いっぱいになり自分の心が光で満たされる感覚になるのでしょう。\nそして、あなたにとって、その人と一緒にいることで自分を知れたり、学びや発見があるということも大切なポイントのようです。', plus: '心が躍動するもの、エンターテイメント、学びがあるもの、個性を発揮できるものに魅かれます。元気が湧くもの、面白く楽しいものを好みます。' },
  'Mars_Leo': { essence: '自分自身を発見できる場、学びがあるところに足が向かいます。\n自分自身の個性を知ることに喜びを感じるあなたは、明晰性を発揮し、知識を豊かにすること、その知識を消化して理解していくことに意欲的なのではないでしょうか。\nそして、あなたは楽しいことに動く人です。\n何かを越えるためや誰かに勝つためにという気持ちでは行動する気になれないようです。とにかく面白そう、楽しそう、といったワクワクするものに足が向かい、ポジティブで明るいエネルギーを感じることにあなたの好奇心はムクムクと湧き出し、行動へと向かいます。\nエンターテイメント性が高く、人を躍動させ、笑顔やユーモアで人を喜ばせること、楽しませることが好きなのでしょう。\n頭が切れるあまり、パーフェクトでなければと難しく考えすぎると、混乱して行動できなくなってしまうようです。\nそんな時は、一旦その考えを脇に置いてリラックスすることを心がけましょう。', plus: '太陽のような明るさ、楽しく温かなエネルギーをもっています。' },
  'Jupiter_Leo': { essence: 'あなたを幸福へと導く鍵は、明晰性・幸せ・喜び・楽しさがキーワードとなります。\nあなた自身がワクワクすると感じるものを知性を使って選択し、実行していくことが、あなたの発展や拡大に向かっていくのです。\n自分自身が楽しいと思うもの、喜びを感じるもの。\nあなたは太陽のような明るさでたくさんの人々を楽しませ、ポジティブで快活な人間関係を作り出すことができます。\n自分を知ること、意欲的にあなたが楽しめることを学ぶことが発展に繋がっていきます。\n自己中心的な考え、完璧でなければいけないというマインドから自分を解き放つことができるようになると、あなたは自分らしくありのままの働きができ、何事にも楽しみを見つけ出して意欲的に快活に過ごせるようになっていきます。\n人目を気にせず、自分らしく個性を生きた分、創造性を発揮し、ユーモアで周囲を楽しませることができ、あなた自身も陽気に日常を楽しんでいきます。\nあなたのリーダーシップを発揮してください。\nその生き方は人に夢と希望を与え、場の中心となり、自分が輝くことで周りも輝かせていくでしょう。' },
  'Saturn_Leo': { essence: '頭が切れるあまり、物事を難しく考えてしまい、混乱してしまうことがあるようです。\nあなたのバランスが崩れ、わがままや傲慢になるとついつい人や状況をコントロールしてしまいがちになったり、心配や不安にさいなまされることがあるのではないでしょうか。\n自分らしく振舞えない時には、人目を気にしてしまい、緊張や恐れを感じてしまうこともあるようです。\nパーフェクトでなければという思い、緊張感を感じている自分自身に気づいたら、\nあなた自身がリラックスできる空間に身を置いたり、自分に喜びをあげることにエネルギーを注ぎましょう。\nすると、光を取り戻し、自己中心的な状態から、バランスのとれた心のセンター（真ん中）に戻ってきます。' },
  'Support_Leo': { essence: 'あなたを一生サポートしてくれているスピリットカラーはイエローです。\nイエローは太陽のように自分や周囲に明るさや温かさ、パワーをもたらしてくれる色です。\n太陽のような明晰性、学んだ知識、知性と喜びの色。\nイエローには『自己を知る』という意味があります。\nどんな状況でもポジティブに捉えて、暗闇の中に光を見出す力を与えてくれる色です。\n自分自身が喜び、楽しめることを学び、学びを消化して理解していくことで、自分を知ります。\n今までももしかしたら、暗闇の中にいる時に、自分を知ることや学ぶことで光を見出してきたのかもしれません。\nまた、知性的でユーモアがあり、明晰に物事を見てすばやく決断することができ、日常を楽しめる陽気な側面も表します。\nですから、喜びや幸せ、楽しさ、自己を知ること、ポジティブに考えること、ユーモア、陽気さなど、そういった自分自身でいればいるほど、サポートが入ってきます。\nあなたがのびのびと生きる事で、個性を生きるメッセージを伝える事ができ、躍動感いっぱいの快活な日々を過ごすことができるでしょう。\n自分を知ることは、他の人との違いに気づくということでもあります。\n人を気にしてしまい、自分らしく振舞えない時に、緊張や恐れを感じたり、情報が消化しきれないと混乱したり、知性的な反面、考えすぎて心配や不安が出てくることを示します。\n自分のインスピレーションを大切にし、わくわく楽しい事に時間を使ってください。\nあなたの中にある純粋なる創造性が発揮されます。\nあなたがリラックスできず緊張感を感じていたり、わがままになってコントロールしてしまったように感じることがあったとしてもイエローはいつもあなたをサポートしています。\n・賢く知的でシャープ。\n・自己愛。\n・明るさ。\n・機知に富んでいて周囲を楽しませる明るさ。\n・何かを学ぶことに意欲的。\n・希望や夢を与える。\n・自分の意思を明確に持っている。\n・個性を発揮。\n・リーダーシップ。\n・健全なる自我の表現。\n・場の中心となる。\n・王道を歩む。\n・ありのままの働きができる。\n・人を躍動させる。\n・快活さ。\n・無邪気さ。\n・わくわく楽しいことをする。\n・エンターテイメント性に長けている。\n・他者を笑いやユーモアで喜ばせる力。\n・インスピレーションの光となる。\n・個性を生きるメッセージを伝える力を持つ。\n・純粋なる創造性を発揮できる。\n・のびのびと生きる。\n・躍動感いっぱいの表現。\nあなたがつらい時も嬉しい時もどんな時もイエローはあなたのサポートをしています。\nもし、サポートが必要な時はイエローのパワーを使ってください。' },
  'YearColor_Leo': { essence: '今年のあなたはイエローが力強い味方となります。\nイエローは喜び、幸せ、知識、個性、明晰性、自己を知る、ポジティブなどといった意味があります。\nあなたの明るさ、快活さ、楽しさ、元気が増し、あなたの個性が発揮されていく年となるでしょう。\nあなたも自分自身のワクワク感がこみ上げてきているのを感じられているのではないでしょうか。\n今年はあなたの学びへの意欲（自分をより知りたい、学びを消化したい、知識を増やしたいという欲求）が溢れています。\nあなたが自分を知っていく中で、他の人との違いに戸惑ったり、人を気にしてしまい、考えすぎてしまうことがあれば、自分らしく個性を生かしポジティブに切り替えることです。\nあなたがのびのびと自分の意志をもつことで、どんな状況でも光を見出すことができます。その在り方が周囲の人に希望や夢を与え、リーダーシップを発揮するでしょう。\n機知に富んでいて周りを楽しませ、笑いやユーモアに包まれながら場の中心となる年となりそうです。\n明晰に物事を見て、すばやく決断することができ、日常を楽しめる真夏の太陽のような、そんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Virgo': { essence: 'オリーブが表すのは、個性、競争ではない共同創造、調和と成長です。\nみんなと調和しながら個人として開花していき、そして平和な世界を創造していくことができる人です。\nあなたは、皆のそれぞれの個性を引き出し、共によりそいながら他者の成長をサポートするのが得意なのではないでしょうか。\nですから、柳のような折れないしなやかさで、皆をこつこつと励ましながら見捨てることなく関わっていくことができます。\n周りの人が諦めても、あなたは長い時間をかけてゆっくりと育み、共に成長していこうという思いやりの深い人。\nそんなあなたの思いに触れ、あなたのリーダーシップで、周りの人は希望を持ち続けることができるのです。\nリーダーシップと言えば、自分が先頭に立ちみんなを引っ張っていくというイメージがありますが、オリーブが表わすリーダーシップは、競争ではなく、共存。\nそれは自分も人もお互いが個性を生かし、共に協力して新しいものを生み出していく姿です。\nストイックな部分を持っているので、自分にも人にも厳しくなり、要求水準が自然と高くなってしまうことがあるのでしょう。\nそうなると、一人で戦っているような気持ちになり、孤独や寂しさを感じてしまいます。\nそんな時は、自分を優しく育み、安心できる人からでも寂しさなどの感情を伝えることで調和のとれた自分自身に戻っていくでしょう。' },
  'SunRealize_Virgo': { plus: '思いやりが深く、周りとの協調、調和をとることに長けています。\n周囲との調和を重んじながら自己主張もきちんとできるその姿はまさにフェミニンリーダーです。\nあなたはその女性的なリーダーシップで周りの人たちに希望の光をもたらす存在です。\n世のため人のための奉仕の心で困った人を助け、全員が勝つ仕組みや豊かさを作り出す礎となります。\nしなやかな心を持ち、自分の根幹がぐらつくほどの試練に直面したとしても、それを乗り越えるパワーが備わっています。\nですから、行き詰まった時も我慢強く努力を積み重ね、何度でも挑戦し、必ず新しい方法や結果を出していくのです。' },
  'Moon_Virgo': { essence: 'オリーブは、イエローの『個人』とグリーンの『調和』とのコンビネーションです。\n個人主義ではなく、平和的で調和のとれた世界。\n長い歴史を見ればわかるように、常に人間は競争を繰り返してきました。\nそういった男性的な「勝つか負けるか」という奪い合うだけの競争から自由になるということです。競争ではなく共同創造するということ。\n周りと協力し、一人一人がみんなと調和しながら自分らしく生きていくということ。\n深い所ではみんなが繋がっていることを知り、愛に満ちた世界を築くことが私たちのテーマです。\nオリーブは新しい時代の訪れを告げる希望の色です。\nそしてオリーブは乾ききった大地に育ち、そんな環境でも自分を適応させて、生きるためのユニークな道を見つけ出し力強く成長していきます。\n困難を乗り越え、価値あるものを生み出すことができるとオリーブは教えてくれています。\nあなたは状況がどんなに厳しくても、何らかの道を必ず見出せると確信を持つことが出来る人。どんなところからでも成長できることをよく知っています。\nテーマを深く探求し、役立つことを実践して体系化していく努力を確実に実にしていきます。\nそれ故、力の抜き方がわからず、頑張りすぎてまわりが見えなくなることがあるのかもしれません。\n頑張りすぎてしまい、力を抜くところとのバランスが崩れてしまうと、完璧でないと認められないという思いや失敗が許せないという思いに駆られ、融通がきかなくなることも。\nあなたは世のため人のために自分にできることをしたい、という思いを秘めています。\nそして自分も人もお互いが個性を生かし、共に協力して新しいものを生み出すことを望んでいます。\nこの世界に完璧なものはないということを思い出し、不完全な自分を愛することです。\n誰か一人が勝つのではなく、仲間と繋がり、チーム全員で達成することをサポートしていきたいという思いが強いのではないでしょうか。\nその姿は、まさに人の才能を引き出し、勇気と希望を与えるフェミニンリーダーです。' },
  'Mercury_Virgo': { essence: 'オリーブのあなたは周囲との調和を大切にしながら、自己主張もできる力があり、それぞれの個性を引き出しあいながら仲間やチームと共同達成出来る人です。\n共同達成したいという思いがあるので、困っている人を助け、こつこつと励ましながら見捨てることなく長い時間をかけてでもゆっくり人を育てることも得意です。\n自分も人もお互いが個性を生かし、共に協力して新しいものを生み出す関係を創り出すかかわりができる人です。\n誰かとの競争ではなく協力・調和を重視し、それぞれの個性を生かし共に創り出すことに価値を置いているのではないでしょうか。\nしなやかで強い心を持っているので、困難な出来事や状況に直面したとしても、『ここからどうすれば抜け出せられるのか』『他に有効な方法は何か』『あと何をすると達成できるのか』と考えることができるので、乗り越える発想を生み出し、打開策を見いだし実行に移していきます。\nストイックで、困難を乗り越えることに価値を見いだすところがあるので、楽に楽しみながら手にしたものには物足りなさを感じることがあるのかもしれません。\n完璧主義な部分が顔を出すと、助けを求められなかったり、弱い自分を見せられなくなってしまいます。\nそんな時は、「ゆっくりと人を育てられる自分自身の能力」を思い出し、自分をゆっくりと思いやりながら育ててあげてください。\nそうするとあなたの中の寂しさや強がってしまう気持ちがゆっくりと解け、自分自身を大切にしているという実感が湧き出してくるでしょう。' },
  'Venus_Virgo': { essence: 'あなたの愛の表現やパートナーシップは、しなやかでいて、自己主張もできるようです。\n相手からの返答を待つことができる人。\nその場だけを取り繕うような返答は好まず、時間がかかってもいいから、きちんと返答してほしいと思うようです。\n自分の創り出したい関係において、目の前の人に寄り添い、すぐに結果を求めるのではなく、長い時間をかけてゆっくり関係を育てていける方ではないでしょうか。\n大切な人が夢を実現することにも積極的に援助します。\nその中で、たとえ困難なことや障害があったとしても、それを乗り越えより絆を深めることができます。\nストイックな面から、一人で抱え頑張りすぎて助けや協力を求めることが苦手なようです。\nそうなると、相手は、あなたに何でも頼ろうとしたり、自分が必要とされていないと感じる場合があります。\nあなたが人に援助を求めることも意識してみてください。\n相手への思いやりが深く、人の才能を引き出す力もありますから、相手との調和を大切にしながら、自己主張もできるといった関係を作っていくでしょう。\nそしてあなたは、個性を生かすもの、チームで何かを成し遂げること、人々に希望をもたらすこと、世のため人のために力を尽くすことや、そういう生き方をしている人に惹かれるようです。\nそしてあなた自身もそうありたいと思っているところがあるのでしょう。', plus: '無から有を生み出すこと、基礎・土台の構築、全員が勝つ仕組み作り、役立つことやもの、人を育むこと、一見辛いことや過酷な事の中に希望や勇気を見出せる事に惹かれる傾向があります。\n達成感があるものやチームで作り上げられるものを好みます。' },
  'Mars_Virgo': { essence: 'あなたは、共によりそい、人の才能を引き出すのが得意です。\n誰かとの競争ではなく、それぞれの個性を生かし共に創り出すことに心を動かされ、一人で何かをするよりも、誰かと共に何かを作り出していくことや夢を応援したり、人の才能を引き出すような分野に足が向かいます。\nしなやかな心を持っており、自分の根幹がぐらつくほどの大きな壁に直面したときでも、それを乗り越えるパワーが備わっています。行き詰まった時も我慢強く努力を積み重ね、必ず新しい方法を見つけ出していきます。\n仲間と繋がり、チームで取り組むことや何度でも挑戦するそのエネルギーがあなたを目標達成へ向かわせます。\n実践し役立つことを体系化したり、基礎や土台を構築したり、全員が勝つ仕組み作りなど、無から有を生み出す知恵を使って、そのテーマを深く探求し豊かさを作り出す行動もできる人です。\nストイックな面もあるので、そんな時は頑張りすぎず、バランスをうまくとり、自分をっ大切にしてください。', plus: '知性と感性を兼ね備えたしなやかで強いエネルギーをもっています。' },
  'Jupiter_Virgo': { essence: 'あなたを幸福へと導く鍵は、オリーブの持つ調和と成長です。\nコツコツ長い時間ゆっくり育っていくオリーブは加工することで、栄養価も高くなり、甘みを持った味わいへと変わります。\nオリーブは過酷な環境で生き抜く知恵を表し、過去に受けたハートの恐れ、苦みを解毒して、ハートの喜び、甘みへと変える『変容のプロセス』を意味します。\nあなたの中で、過去の傷や痛みがあるなら、それを癒してあげることでハートはどんどんしなやかに強くなっていき、ご自身でも成長と変容を感じられるでしょう。\n全員が勝つ仕組み作りや基礎や土台の構築などが得意ですから、興味のあるテーマを深く探求し役立つことを体系化していくと発展へと向かっていきます。\n一人で何かをするよりも、お互いの個性を生かしながら周りの人と共に協力することが幸福へと向かい、チーム力・絆が深まっていきます。\n競争するのではなく、ともに美しい世界を創るために力を合わせ成長していくことです。\n一人一人が皆と調和しながらユニークなこの唯一無二の自分を生きていく。\n難しく捉えることなく、柔軟性と思いやりをもって取り組んでいくことで平和で調和のとれた世界へと発展していくでしょう。' },
  'Saturn_Virgo': { essence: 'あまりにも完璧主義になってしまっているときは、頑固になりやすく、周りが見えなくなる傾向があるかもしれません。\nストイックで自分を律することができ、また困難も乗り越えるパワーを持っているので、自分にも人にも厳しくなり、要求水準が自然と高くなってしまうことがあるようです。\nそんな時は、自分にも他人にも厳しくなり、力を抜くバランスが分からなくなったり、寂しさを出せずについつい意地を張ってしまうことも。\nそういった自分に気づいたら、満点でない自分、至らないと思っている部分、出来ない事を認め、そんな自分を大切にすることが必要かもしれません。\n事務的な働きが得意なため、安定を求めることを選びがちな傾向があるようです。\n難しく捉えることなく、自分の個性を大切にしながら、あなたの持つしなやかな強さで挑戦していきましょう。' },
  'Support_Virgo': { essence: 'あなたを一生サポートしてくれているスピリットカラーはオリーブです。\n調和と成長の色。ハートの苦味を甘みへ変える力のオリーブ。\nオリーブは、グリーンの『道』にイエローの『太陽の光』があたり、進む道が光で明るく照らされた色です。\n自分や周囲の人々に希望の光をもたらします。\n自分の根幹がぐらつくほどの大きな壁に直面したときでも、それを乗り越えるパワーをくれる色です。\n太陽が進む道を明るく照らすように、多くの人に勇気を与えます。\nイエローのパワーと知性、グリーンの心と感性の両方を兼ね備え、女性的なリーダーシップで道を進みます。\nオリーブの木は過酷な環境の中で成長します。\nそのため、その実は苦く、加工することで、栄養価が高く、甘みを持った味わいへと変わるのです。\nオリーブは過酷な環境で生き抜く知恵を表し、過去に受けたハートの恐れ、苦味を解毒して、ハートの喜び、甘みへと変える「変容のプロセス」を意味します。\nハートはしなやかに強くなっていきます。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、このメッセージから勇気やヒントをもらってください。\nあなたが頑張りすぎていたり、大きな壁に直面し、あきらめそうになることがあったとしてもオリーブはいつもあなたをサポートしています。\n・フェミニンリーダー。\n・勇気と希望。\n・実践哲学に向く。\n・柳のように折れないしなやかさを持つ。\n・実務的な働きができる人。\n・困っている人を助ける。\n・世のため人のための奉仕ができる。\n・チーム力。\n・困難だとしてもやり遂げる力。\n・基礎、土台の構築。\n・全員が勝つ仕組みを創り出せる。\n・豊かさを創る礎となる。\n・人々に希望をもたらす。\n・無から有を生み出す知恵をもつ。\n・実践し役立つことを体系化する。\n・テーマを深く探求する。\n・人を優先できる心を持つ。\n・何度でも挑戦し結果を出す。\n・有限実行。\n・新しい時代を開く新しいやり方ができるリーダー。\n・それぞれの個性を引き出しあいながら人々を率いる。\n・仲間と繋がり、チームで達成する。\n・周囲との調和を重んじながら自己主張もきちんとできる力。\n・夢を応援する力。\nあなたがつらい時も嬉しい時もどんな時もオリーブはあなたのサポートをしています。\nもし、サポートが必要な時はオリーブのパワーを使ってください。' },
  'YearColor_Virgo': { essence: '今年のあなたはオリーブが力強い味方となります。\nオリーブは平和、希望、フェミニズム、ユニークさ、個性などといった意味があります。\nあなたの女性的なリーダーシップで道を進み、周りの人に勇気と希望を与えていく年となるでしょう。\nあなたも自分自身の心の平和やしなやかな強さが自分の中に広がっているのを感じられているのではないでしょうか。\n今年はあなたの調和と成長のエネルギーが溢れています。\n仲間と繋がり、それぞれの個性を引き出しあいながら、人々を率いていきます。\nプロセスの中で何か壁に直面したとしても、それを乗り越え、進んでいくことができるでしょう。\nあなたの中で、頑張りすぎて自分にも人にも厳しくなってしまうところや、融通がきかないところが顔を出してしまったら、相手の個性を尊重し、自分自身も大切にする時間をとってみてください。\nそしてだらけてしまう自分自身にＯＫを出して、休息をとりましょう。\n実務的な働きで、困っている人を助けたり、夢を応援したり、人を優先できる気持ちが高まってくるでしょう。\nこつこつと励ましながら思いやりを持って人の才能を引き出していくことができます。\nチームに所属しているなら、周りの人との調和を重んじながら自己主張もきちんとでき、チームで達成できる年となりそうです。\n困難なことに対してもやり遂げられる、豊かさを創る礎となる、そんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Libra': { essence: 'グリーンが表すのは、調和と癒し、自然、再生力です。\nあなたは自然を愛し、ハートからの愛を生きる、感謝して生きるという美しい特質を持ち、まわりにいる人たちがありのままの自分でいられる空間を作ることができる人です。\n自然を愛し、地球環境に関しても思いやれるそんな懐の広さを持った人。\nあなたと一緒にいる人がその心地よさに気づき、どんどん自分を取り戻すといったサポートが自然と出来るのではないでしょうか。\nそれはあなたがありのままの自分でいることの心地よさをよく知っているからです。\nですから、あなたのそのナチュラルさ、ありのままの姿に、周りの人は安心感を感じ、ネガティブな状態に陥っている時は、その感情が和らぎ、落ち着いていくのを実感していることでしょう。\nあなたに触れる人は、呼吸が深まり、リラックスできるのです。\nあなたが忙しすぎると、バランスを崩してしまいます。\nバランスが崩れた状態になると、自分の言いたいことが言えなくなったり、八方美人になったり、人との境界線が引けなくなる、という『周囲に振りまわされる』という形で表れる傾向があるようです。\n周囲に振り回される状態になると、自分の意見が不明確になり、自分のことが分からなくなったり、方向性に迷ってしまうということがあるかもしれません。\nそんな自分に気づいたら、忙しくしすぎているのかどうか自分の心を眺めて、調整を心がけることや森林などの自然に触れてみることで、調和のとれた自分自身に戻っていくでしょう。' },
  'SunRealize_Libra': { plus: 'あなたはとても思いやりが深く、懐が広く、受容力に長けています。\n人をありのままに認めることができ、ネガティブな感情を和らげる能力を発揮し、心地よいスペースをつくります。\nですから周りにいる人々は、あなたといると安心し、あなたに触れられると呼吸が深まり、ありのままでいられることの心地よさを感じることができます。\nお金に執着することもなく、自然体でハートから愛を生き、心のままに感謝しながら生き、内なるバランスを上手にとりながら、真の自己と共にいる実感があります。\n広い視野をもって人生を捉え、学んだことを活かして可能性を広げていきます。\n自然な境界線を持って、自分の時間と空間の中でリラックスしています。' },
  'Moon_Libra': { essence: 'グリーンはリラックス、リフレッシュを与えてくれる色。\n虹の7色の真ん中に位置していることからもわかるように、グリーンはバランスを表します。バランスがとれているとき、人はリラックスできます。\nあなたはありのままでいるということの大切さをよく知っている人。\n心のままにナチュラルに生き、自分に対しても、周りの人に対しても、心地いい空間を作る能力をもっています。\n人にあわすことができる協調性に富み、調和をとりながら心地いい空間を作り出します。\n360度の気づきを起こすことができる人です。\n360度の気づきというのは、眺めのいいグリーンの丘から四方に広がる風景を見下ろすように、一段高いところから自分の心の中を見渡すこと。\nつまり俯瞰して見るということです。\n自分を俯瞰して見ることができるととても自由です。\n静かな気持ちで自分を見ることができます。\nするといろんな気づきが起きてくるでしょう。\nそしてバランスがとれると、そこに自分の真実、進むべき方向性が見えてきます。\n広い視野をもって人生を捉え、学んだことを活かして可能性を広げていきます。\nグリーンは真実の色。真実はハート、自分の心の中にあります。\nあなたは自分自身がありのままで、俯瞰して物事を眺め、ハートから生きていきたいと望んでいるのではないでしょうか。\nそしてその生き方ができる人です。\n愛を受けとり表現できる色がグリーンです。愛を受けとり、与えていくもの。\nそのバランスが大切です。\n呼吸も同じように吐いては吸うというバランスが大切。循環、バランス、調整。\nバランスが崩れてしまうと、呼吸が浅くなったり、周囲の人にネガティブな感情を抱いてしまうのでしょう。\n周りに振り回され、方向性に迷って決断できなくなることがあるのかもしれません。\nそんな時は、ゆったりとくつろぎ、心から安らげる空間で休息をとることです。\nすると、あなたの才能である調和・バランスが戻り、360度の気づきが起きてくるでしょう。' },
  'Mercury_Libra': { essence: 'グリーンのあなたは、そこにいる人がありのままの自分でいられる環境をつくり、スペースを提供する、そんな場所に喜びを見出す事が出来る人です。\nグリーンは虹の真ん中の色で、調和や内なるバランスを表します。\n心のままにナチュラルに生きていきたいという思いがあるので、和やかな空気感で人とコミュニケーションします。\n人をありのままに認めることができ、調和をとることが得意です。誰かとの競争や比較には全く興味がありません。あなたは受容能力が高く懐の広い人。和やかで思いやりに溢れた癒しの人です。\n調和・バランスを重視し、それぞれの個性をそのまま表現できることに価値を置いているのではないでしょうか。\nあなたが自然体でリラックスしてコミュニケーションするので、相手もリラックスし、あなたといると自分らしくいれるという感覚を感じるでしょう。\nあなたのそのエネルギーは周りの人々が自分を取り戻すサポートをしているのです。\nあなたはネガティブなものをポジティブに変える力もあります。周りの人のネガティブな感情を和らげ、あなたが触れることで相手の呼吸を深くすることができます。\n相手がリラックスしていくのを感じ取ることができるでしょう。\n物事を広い視野を持って俯瞰して見ることができ、真の方向性を見つけようとします。\nバランスを崩してしまうと、何でも引き受けてしまって周囲に振り回されたり、自分の意見が不明確になって優柔不断になってしまいます。\nそんな時は、森林など自然に触れられる時間と空間の中で過ごしてみると良いでしょう。\n内なるバランスがとれ、リフレッシュして自分を取り戻していく感覚を感じられるでしょう。' },
  'Venus_Libra': { essence: 'あなたの愛情表現は、思いやりがあり自然体で受容的です。\n自然や森林の色を持っているので、あなたは気取らずに等身大の自分自身で愛を自然と表現できる人です。\n好きなことや好きな人を懐の広さを持って和やかなエネルギーで包みます。\nありのままの自分でいることの心地よさを知っているので、ハートから愛を表現することができ、相手に対する感謝もナチュラルに伝えることができるのではないでしょうか。\n相手の気持ちを無視して、自分の思いを優先して気持ちをぶつけるといったことは好みません。\n相手に合わすこともできます。協調性を持って、相手のペースを大切にすることができ、相手を尊重しながらハートから愛を表現します。人が自然体でリラックスできる空間作りを大切にし、あなたは自然とその空間を作り出すことができます。\nもしかすると、相手の方から積極的に近づかれたり、複数の人から近づかれると、相手に影響されて、自分の意見が分からなくなったり、相手との境界線が引けなくなったりと八方美人や優柔不断の一面が顔を出してしまうことがあるのかもしれません。\nあなたが惹かれる人は、和やかな空気感を持ち、協調性のある安心感を持った方なのでしょう。\nゆっくりと話を最後まで聴いてくれるような、あなたのペースを大切にしてくれるような人。お金に執着がなく、あなたが無理なくありのままでいられる人。\nそしてあなた自身もそうありたいと思っているところがあるのでしょう。', plus: '自分自身が安心できるところ、自然体で、無理なくリラックスできるものや、空間に魅力を感じるようです。\n和やかな空気感を感じられる所や人をありのままに認められる場所、地球環境に関することなどに惹かれます。\n広い視野をもって人生が捉えられるものや、学んだことを活かして可能性を広げられるものに興味が湧くのではないでしょうか。' },
  'Mars_Libra': { essence: 'リラックス、リフレッシュできるものに足が向かいます。\n自然に触れられるところや、和やかな空気感のあるところなど、自分自身がありのままの状態、自然体で心地よい空間で時間を過ごすことを大切にしています。\nそういう時間と空間の中で、真の自分を取り戻し、自分自身のバランスをとり調整します。\n安心してナチュラルに存在できる心地よい場所に足が向かうようです。\nせかせかと忙しいエネルギーや自己主張の強いエネルギーの空間の中では、周りとの境界線が引けなくなり、自分の中に迷いが生じたり、言いたいことが言えなくなったりしてしまうのではないでしょうか。\n人に合わせることのできる能力があるので、ついつい相手を優先してしまうようです。\nあなたが自分の時間と空間の中でリラックスして過ごせば過ごすほど、行動への意欲や目標達成への原動力になっていきます。\n広い視野をもって人生を捉えることができたり、学んだことを活かせることのできる可能性を感じられるところにも足が向かいます。', plus: 'あなたは自然体で思いやりと受容のエネルギーの持ち主。和やかで安心感のある呼吸が自然と深まるようなリラックスしたエネルギーをもっています。' },
  'Jupiter_Libra': { essence: 'あなたを幸福へと導く鍵は、グリーンの持つ内なるバランス･調和・リラックスです。\nあなたが心から安らげるリラックスした時間と空間の中で取り組むことが幸福感を味わえるのではないでしょうか。\nその状態とは、愛を生きている実感があり、自然を愛し、感謝が湧いている感覚です。\nあなたがその状態でいると、周りの人のこともありのままに認めることができ、安心感を与え、和やかに人と関わることができます。\n一緒にいる人が自分自身を取り戻すサポートができる力を発揮し、心地よい空間作りができます。\nネガティブなものをポジティブに変える力もあります。周りの人のネガティブな感情を和らげ、あなたが触れると相手の呼吸が深くリラックスしているのを感じ取れることができるでしょう。\nあなたの内なるバランスが整い調和がとれると、広い視野をもって人生を捉え、ハートから真の方向性を見つけ出すことができるので、その選んだ道がどんどん拡大し発展へと向かっていきます。' },
  'Saturn_Libra': { essence: '協調性に富むあなたは、ついつい相手を優先し相手に合わせてしまい、自分の言いたいことが言えなくなることがあるようです。\nそのため、自分の意見が不明確になったりと人との境界線が引けずに、相手に影響され、自分自身が分からなくなってしまうという傾向があるのではないでしょうか。\n自然と調和をとることができてしまうので、リーダーシップをとることに躊躇したり、優柔不断になってしまいがち。\nそんな時は無理をして引き受けたり、流れでＹＥＳと言わずに、できないことにはＮＯと伝え、自分自身を優先し、忙しくさせないことが大切です。\n自分の心のバランスを持つためにも心にゆとりを持つ時間を意識し、緑の多い環境に出かける事や、自分のリラックス出来る空間にお気に入りの香りや音楽を置くのもいいでしょう。\nあなたの内なるバランスが整い、ありのままの自分に戻っていくでしょう。' },
  'Support_Libra': { essence: 'あなたを一生サポートしてくれているスピリットカラーはグリーンです。\n虹の真ん中の色、自然のバランス。\nグリーンは自然や森林の色。\n木々の成長と再生力を表します。調和と癒しの色。\n自然な境界線を持ち、自分の時間と空間の中でリラックスして自然体でいられ、どのような状態の時にでも真の自分を取り戻す事ができます。\n嫉妬心や怒りや悲しみの感情をやわらげ、心にゆとりを持って、リフレッシュしてくれる色。\nより広く全体的に物事を見て、ハートからの真の方向性を決断することを表します。\nブルーの「天の意志」をイエローの「個人の意志」が受け入れひとつになると、グリーンの「真実の道」が見えてきて進むことができます。\n逆の意味では、忙しすぎてバランスを崩したり、周囲に振り回されたり、方向性に迷い、決断できなくなることを示します。\nあなたが周囲に振り回されたり、バランスを崩したり、方向性に迷ったように感じることがあったとしてもグリーンはいつもあなたをサポートしています。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、このメッセージから勇気やヒントをもらってください。\n・自然体でいられる。\n・癒しの人。\n・ハートから愛を生きる、感謝して生きるという美しい特質を持つ人。\n・自然を愛する。\n・ありのままの自分でいることの心地よさを知っている人。\n・お金に執着がない。\n・和やかな空気感。\n・心のままにナチュラルに生きていく。\n・地球環境に関することに向く。\n・人をありのままに認めることができる。\n・広い視野をもって人生を捉える。\n・学んだことを活かして可能性を広げられる。\n・人に合わすことができる協調性に富む。\n・安心感を与える。\n・調和をとる才能。\n・触れた相手の呼吸を深くすることができる。\n・心地良い空間つくりができる。\n・一緒にいる人が自分を取り戻すサポートができる。\n・ネガティブな感情を和らげる能力をもつ。\nあなたがつらい時も嬉しい時もどんな時もグリーンはあなたのサポートをしています。\nもし、サポートが必要な時はグリーンのパワーを使ってください。' },
  'YearColor_Libra': { essence: '今年のあなたはグリーンが力強い味方となります。\nグリーンは真実、バランス、調和、中庸、ヒーリング、自然体、広い視野などといった意味があります。\n自然や地球環境に関することに興味が増すかもしれません。\n広い視野をもって、自分自身とのバランスをとっていくこと、調和することができる一年となるでしょう。\nネガティブに思えていた出来事も今年はポジティブなものへと変えていくことができそうです。\nあなたも自分自身のエネルギーがとてもナチュラルでリラックスしているのを感じられているのではないでしょうか。\n今年はあなたの受容のエネルギー（懐の深さや広さ、思いやり、感謝）が溢れています。\nあなたと一緒にいる人に安心感を与え、その人がその心地良さに気づき、どんどん自分を取り戻していく、といったサポートも出来るでしょう。\n人との自然な境界線を持ち、リラックスして、真の自分を取り戻せる一年です。\n心にゆとりが出るので、学んだことを活かして可能性を広げたり、広い視野を持って、人生を捉えることが出来るでしょう。\n自分の時間と空間の中でリラックスして自然体で過ごす。\nそんな和やかなエネルギーがあふれる１年になりそうです。' },
  'Sun_Scorpio': { essence: 'ターコイズが表すのは、イルカのように自由に生きること、ハートからのコミュニケーションです。\nあなたはイルカのようにみんなの幸せを願い、自由に楽しく仲間と分かち合いたいという想いが強い人。\nグリーン（真実・ハート）とブルー（コミュニケーション）からなるターコイズ。\nハートとコミュニケーションし、自分自身を表現していくのをサポートしてくれます。\nハートからのコミュニケーションを大切にし、感情を自分らしく表現する能力に長けています。\nあなたのその無邪気で自由気ままに楽しむ姿に、周りの人は「やりたいことをやっていいんだよ。今この瞬間を楽しんでいいんだよ。」というメッセージを受け取り、楽しく軽い気持ちを感じているのではないでしょうか。\n物事を自由な発想でとらえ、独自の解釈をすることができます。\nですから、あなたが関わることで、人は今まで気づかなかった発想や捉え方ができるようになり、自分の枠組みから解放されるのです。\n自由で無鉄砲にみられることもありますが、自分の人生を選択し、その責任をとれる力も持っているからこそ「自由」を生きられるのです。\n人からの指図や束縛を嫌い、枠にはめられることが苦手なようです。\n自分は何者なのか、自分はどう生きたいのかということが定まらないと、根無し草のように迷ったり不安や混乱を感じることも。\nどう生きるのかを明確に持ち、今を心から楽しむことが流れに乗る生き方に繋がっていきます。' },
  'SunRealize_Scorpio': { plus: 'ハートからのコミュニケーション、個性、自由、イルカやクリスタルとの繋がり、自分らしさを生きる流れに乗る才能、遊び心、自由な感情表現をクリエイティブに発揮します。自分の気持ちをありのまま表現できる人です。\n心が感じたものをそのまま伝えることができるので、相手に気持ちがしっかり伝わります。また、人の心の奥底にある気持ちも感じ取ることができ、心と心が通じ合う関係を作りだす力を持っています。\nまた、個性を生かすもの、コミュニケーションにかかわること、言葉を超えて表現するもの（絵画・音楽・ものづくり・ダンスや演劇など）の才能も持ち合わせています。\n直観力と自由に楽しむ力があるので、思いついたことは深く考えずにやってみると、おのずと道が開けていく。そんな力を秘めています。' },
  'Moon_Scorpio': { essence: 'ターコイズは創造と表現を表す海の色。\n自由を愛し、自分の個性を大切に生きていきたいという思いが強いあなた。\n誰にも縛られることなく、軽やかに生きることを望んでいます。\n一つのことをやり続けるよりも、その時その時に必要なものをハートで受け取って表現していくことの方が自分らしいと感じられているのではないでしょうか。\nハートからコミュニケーションし、感情を自分らしく表現していくこと、自分の人生を自由に選択し、自分でその責任をとれる力を持ち、個性を生かして発揮したいという思いがあるようです。\nですから心で思っていることを言葉にできなかったり、表現できない場ではストレスが溜まり、のどが詰まる感覚を感じることがあるのかもしれません。\nターコイズはイルカの色でもあります。\nあなたは遊び心があり、開放的で軽い感覚の表現をし、自由にいきいきと柔軟に流れに乗る生き方ができる人。\nイルカのように自由に楽しく仲間と生きたい、分かち合いたいという強い思いを持っています。\n自分自身が自由でいたい、という思いもありますが、人々が豊かなイメージができるようにサポートし、枠を外し、自由に導く能力にも長けています。\n聡明で直感的。第6感、サイキック能力があります。別次元とのつながりや内側で何かしらのメッセージを感じる体験があるのかもしれません。\nターコイズは、エネルギーを拡大増幅させるクリスタルとの繋がりがある色です。\n自分が感じたことをハートからクリエイトする。\nそれがターコイズのエネルギーです。\nそして情報を多くの人と分かち合うマスコミュニケーションの色でもあるので、大勢の人々へのコミュニケーションや、情報を広めたり、伝達することが得意なようです。\n自分自身が何者なのかについてのアイデンティティを感じられないと不安になってしまいます。\nどう生きたいかを明確に持ち、ハートの声に耳を傾け、心のままに生きる事が大切です。\n自分自身が『創造主』であること、自分を心のままに表現させてあげる『表現者』であることの意識を持つとより自分とのバランスがとれていきます。' },
  'Mercury_Scorpio': { essence: 'ターコイズのあなたは心のままにコミュニケーションができ、感情を自由に表現することができる人。\n相手にも自由に表現してほしいという思いもあり、お互いがありのままで関われる関係を好みます。\n自由で独創的な発想を持っているので、理屈や理論でコミュニケーションを取ろうとする人が苦手な傾向にあるようです。\n内側で感じるメッセージを伝えたり、人々の枠を外し自由に導くこと、豊かなイメージができるようなコミュニケーションが得意であり、軽い感覚で開放的に遊び心をもって、人と関わることができます。\n絵画や音楽、ダンス、デザイン、料理などの言葉を超えた創造的・芸術的表現を通して、自分を表現していきたいと思っているのではないでしょうか。\nコンピューターやマスメディアで表現することなど、大勢の人々へ向けたコミュニケーション、情報発信もあなたが届けたいと思った時には役に立ちます。\n「自分はいったい何者なのか」というアイデンティティの問いの答えが見えないと不安を抱えてしまったり、伝えたいことを言葉にできないもどかしさを感じてしまいます。\nその時は、自分以外のものに答えを求める必要はなく、あなたの中の「偉大なる教師(インナーティーチャー）」がいることを思い出してください。\n豊かなイメージ力と第六感、サイキック能力を持っているので、偉大なる教師を自分の中に見出すことができます。\n言葉に惑わされず内側で感じ取れる感性と心豊かにイメージできる能力をうまく生かすことで、様々な人とイルカのように生き生きとした開放的で爽やかなコミュニケーションが取れるでしょう。' },
  'Venus_Scorpio': { essence: 'あなたの愛情表現は、ありのままでストレートです。\n自由に心が感じたものをそのまま伝えることができるので、相手に気持ちがしっかり伝わります。\n好きな人や好きなことをハートで感じ取り、自由なエネルギーで包みます。\nイルカのように言葉に囚われず、お互いに自由な表現でのコミュニケーションを楽しめる人です。\nですから、相手を縛り付けることはなく、相手の個性を受け止めて愛そうとするのではないでしょうか。\n相手の価値観や生き方からその人の個性を発見するとワクワクし、一緒に楽しんだり幸せを感じられる人です。\n大切な人との関係においては、本音で表現し開放的なコミュニケーションを求めます。\nそして言語だけに囚われず、自由な遊び心で表現し、絵画や音楽、ダンス、デザイン、料理などの言葉を超えた創造的、芸術的表現の才能も豊かです。\nお互いが自由でいられる関係では、個性を尊重しあいのびのびと楽しい関係をつくれますが、束縛や干渉されることが嫌いなのでしょう。\nもしかすると、理屈っぽい人や本音と建前を使い分けたり、計画をきっちりと立てる人には苦手意識が強く出ることがあるのかもしれません。\n自分のペースを崩されたくない傾向があるので、自分らしくいられなくなると距離を置きたくなってしまうこともあるようです。\nあなたが惹かれる人は、自由で遊び心があり、心のままに生きている在り方の人なのでしょう。\n自由に物事を捉え、柔軟性のある人。\nそしてあなた自身もそうありたいと思っているところがあるのでしょう。', plus: 'コミュニケーションに関わることや、芸術・独創的なもの、自分の存在で何かを表現するクリエイティブな人やものに惹かれるのではないでしょうか。\nイルカやクリスタル、きれいな海や宇宙など神秘的なものも好みます。' },
  'Mars_Scorpio': { essence: '自分自身の感情を自由に表現できるものに足が向かいます。\n自分を自由に表現し、ありのままの自分でいられることが何よりも幸せと感じています。\nですから、そういう場所、状況に向かって行動します。\nまた、個性を生かすもの、言葉を超えて表現するもの（絵画・音楽・ものづくり・ダンスや演劇など）にも興味を持ち、ひとたびやりたいことが見つかると、心から楽しんで集中力を発揮します。\n遊び心があるような軽い感覚の爽やかな場所、開放的で柔軟なエネルギーの場所に足が向かうのではないでしょうか。\n枠にはめられるような場や理論的裏づけを求められるようなものなど、縛られるようなエネルギー空間の中では、のどが詰まるような感覚を感じたり、流れを止められるような感覚で心が重たくなってしまうようです。\n心豊かにイメージし、流れに乗る才能があります。ハートの声に耳を傾けることで行動への意欲や目標達成への原動力になっていきます。', plus: '自由で爽やか、開放的なエネルギーの持ち主。\n遊び心があり、軽くて柔軟なエネルギーをもっています。' },
  'Jupiter_Scorpio': { essence: 'あなたを幸福へと導く鍵は、ターコイズのハートからの創造性、コミュニケーションです。\n心豊かにイメージできる才能があり、軽い感覚の表現ができるので、情報を広めたり、あなたが感じるメッセージを伝えることで可能性がより広がっていきます。\nあなた自身がハートからのコミュニケーションを心がけ、自由に生きることで発展していきます。\n大勢の人々へのコミュニケーションや絵画や音楽、ダンス、デザイン、料理などの言葉を超えた創造的・芸術的表現ができるもの、コンピューターやマスメディアで表現すること、イルカやクリスタルに触れることもいいでしょう。\n軽い感覚で開放的にご自身の感情を自分らしく表現していくこと、ハートの声に耳を傾け心のままに生きる事が幸運へと向かっていきます。\n内側で感じるメッセージを伝えたり、人々の枠を外し自由に導くこと、豊かなイメージができるようにサポートすることなどは得意であり、またそういった活動があなた自身を拡大していきます。\n自分の人生を自由に選択し、自分でその責任をとれる力を持ち、個性を生かして発揮することで社会全体へと広がっていくのです。' },
  'Saturn_Scorpio': { essence: '心で思っていることをうまく言葉にできない時や、自分を自由に表現できない場所ではストレスを感じやすい傾向があります。\n表現できない場ではストレスが溜まり、のどが詰まる感覚を味わったり、流れを止められることへの苛立ちを感じることがあるかもしれません。\nまた、厳格なルールや段取り通りを求められると、束縛されているとか枠にはめられていると感じることがあるのではないでしょうか。\n自由な遊び心と創造性に富んだあなたは、理屈や理論的なことへの拒否感がでて、枠にはめられるような仕事や集団を嫌う傾向があるようです。\nその結果、自分が何のために生きているのか、どう生きたいのかというアイデンティティが不明確になったり、先を見据えて計画的に生きることを難しく思う時もあるのでしょう。\n自分のハートの声に耳を傾け生きること、今を心から楽しむ生き方が近道となります。' },
  'Support_Scorpio': { essence: 'あなたを一生サポートしてくれているスピリットカラーはターコイズです。\n創造と表現の色。\nハートからのコミュニケーションを表し、心が感じたものを増幅して表現する力を与えてくれます。\nターコイズは、グリーン（ハート）とブルー（コミュニケーション）の間の色です。\n両方の色の要素を持っており、心のままに（グリーン）コミュニケーション（ブルー）し、感情を自分らしく表現することを示しています。\n本音を表現することを後押ししてくれるので、自分や周りの人が心を解放し自由に楽しんで生きることにつながっていきます。\nターコイズは海の色で、言語を超え、自由な遊び心と創造性を表します。\n大勢の人々へのコミュニケーションや、絵画や音楽、ダンス、デザイン、料理などの言葉を超えた創造的・芸術的表現の才能を現します。\nコンピュータやマスメディアによる表現とも関係があります。\n自分の人生を自由に選択し、自分でその責任をとれる力を持ち、個性を生かして発揮することで社会全体に役立てるという、新しい時代性を示しています。\nあなたが心で思っていることを言葉にできなかったり、自分が何者なのか分からず不安を感じることがあったとしてもターコイズはいつもあなたをサポートしています。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、このメッセージから勇気やヒントをもらってください。\n・自由に生きる。\n・ハートの表現。\n・創造的に生きる。\n・軽い感覚の表現ができる。\n・自由を愛する。\n・エネルギーを流す、滞りを解放する力。\n・開放的。\n・流れに乗る生き方。・軽くて柔軟。\n・遊び心がある。\n・内側で感じるメッセージを伝える能力。\n・手放す能力。・伝達、情報を広めることが得意。\n・人々を自由に導く能力。\n・爽やかさ。\n・自由で独創的。\n・物事を自由に捉えられ、自分なりの解釈ができる。\n・心豊かにイメージできる才能を持つ。\n・聡明で直感的。\n・第6感、サイキック能力がある。\n・別次元とのつながり。\n・本音を表現する力。\n・人の枠を外し、導く力。\n・豊かなイメージができるサポート力。\n・イルカのように自由に楽しく仲間と生きたい、分かち合いたいという思いが強い人。\nそしてその生き方が出来る人。\n・偉大なる教師を自分の中に見出す力。\nあなたがつらい時も嬉しい時もターコイズはあなたのサポートをしています。\nもし、サポートが必要な時はターコイズのパワーを思い出してください。' },
  'YearColor_Scorpio': { essence: '今年のあなたはターコイズが力強い味方となります。\n心のままにコミュニケーションすることを後押ししてくれる色。\nそして個性を大切にし、自由で自分らしく生きることを応援してくれる色です。\nターコイズは、自由に生きる、個性、ハートからのコミュニケーション、遊び心、流れに乗るなどといった意味があります。\nあなたの遊び心、個性、創造性が増し、周りの人と軽やかに楽しく過ごせる年となるでしょう。\nあなたも自分自身の個性を自由に表現できている感覚を感じられているのではないでしょうか。\n今年はあなたのイルカのようなエネルギー（自由さ、無邪気さ、今を楽しむ力、仲間と共に楽しむ力）が溢れています。\n自分らしさがよりはっきり表れるようになり、今まで何となく不自由さや行き詰った感覚を感じていたなら、そこから解放され、気持ちが軽くなっていく1年になりそうです。\n感情を自分らしく表現し、物事を自由に捉えられ、開放的に過ごすことができるでしょう。\n無邪気さ、創造性、遊び心といったイルカのパワーを発揮すればするほど、あなたの個性が輝き、多くの人を自由へと導き人の枠を外していく。\nそんな自由で軽やかなエネルギーがあふれる１年になりそうです。' },
  'Sun_Sagittarius': { essence: 'ブルーが表すのは、平和と信頼、コミュニケーション、天の意志。\nあなたは穏やかで平和なエネルギーを持ち、安定感のある人柄で周囲から信頼される人です。\n静かで調和のとれた平和のパワーで、人々を罪悪感から解放し、心の安らぎを得るお手伝いをしたり、よくよく話を聴き認めてあげられる受容力の持ち主です。\n必要な時に必要なものが来るという感覚の持ち主でもあり、自分自身とのコミュニケーションも上手くとれる能力があります。\n清らかな心で、道徳を重んじる気持ちが強く、誠実に人と関わることができるのではないでしょうか。\nあなたは落ち着いた物腰や安定感を持っています。\nそれはあなたが自分の信念をしっかりと持ち、努力を積み重ね着実に行動していく資質を持っているためです。\nその生き方ゆえに、あなたの言葉には説得力があり、あなたが周りから信頼されることにつながっているのいます。\n人生をまじめに捉えすぎてしまうこともあり、自分の価値基準やルールに縛られてしまうことがあるのかもしれません。\n縛られすぎると物事を善悪で判断しがちになったり、融通が利かなくなったりする面が出てしまいます。\nもしかすると権威者に対してはその面が出やすいのかもしれません。\n自分の価値観を少しずつでも手放しながら相手の価値観を認め受け止めることを意識することで、あなたの柔軟性、寛容さが増していくでしょう。' },
  'SunRealize_Sagittarius': { plus: 'あなたはとてもよく話を聴き認めてあげる受容力が高く、誠実で安らぎに満ちた周りから信頼される人。\n自分自身とコミュニケーションをとり、必要なときに必要なものがくるという感覚を持って、平和な心で日々を過ごすことができます。\n教師の質を持っているので、説得力があり、清らかな心で、道徳や高潔な志をもつことを教え導いていくでしょう。\n精神性が高く、スピリチュアルティーチャーの能力を持っているので、天とコミュニケーションし、無条件の愛で穏やかに、人々を囚われから解放し、心の安らぎを得るサポートをすることができます。\n道を示し、別の視点を与え、あなたの周りの人は道を進む支えとなるでしょう。' },
  'Moon_Sagittarius': { essence: 'ブルーは平和を象徴する色、そして天の色。\n穏やかで平和なエネルギーと安定感のある人柄で、周囲から信頼される存在なのではないでしょうか。\nブルーは私たちの心に平和、静けさをもたらしてくれます。\n本来、私たちの心はとても平和な状態です。\n穏やかで平和なエネルギーをまとっているあなた。\n内側が平和であれば権威に萎縮することはありません。\n権威に対しての問題や悲しみが時に浮上することがあるかもしれませんが、バランスがとれると平和な心に戻っていきます。\n自分の中にしっかりとした信念を持ち、その信念に基づいて着実に努力を積み重ねることができる人です。\nコミュニケーションの才能を持っているので、お互いに理解し信頼しあえる関係を作ることができ、人々の囚われやルールからの解放をサポートし、新しい枠組みを創りだせる力を持っています。\nその姿をとおして、いつのまにか人に道を示し、導いているのです。\nあなたはルールにとらわれず、自分の才能を活かす生き方を望んでいます。\nそして、才能を活かすというのは、天の意志、ブループリントを思い出し、受け取り、表現していくということと同じ意味を表します。\n安らぎに包まれたときに浮かんでくる自分の声、心のつぶやきを大切にしましょう。\nブループリントを生きようと決め、生まれてきたことは私たちの望んだことでもありますが、それは同時に天の意志でもあります。\nブループリントを生き始めると天からのサポートを得られるようになります。\nサポートしてくれる人が現れタイミングよく色々なことが起きはじめるでしょう。\n精神性が高く、スピリチュアルティーチャーの能力を持っているので、天とコミュニケーションし、無条件の愛で穏やかに、心の安らぎを得るサポートをすることができます。\n何か自分で不必要だと思いながらも手放せていないものや、古い価値観、昔の自分には必要だったけど、今の自分には役に立たない価値基準、自分を縛っているルール、世間体や権威者に対する観念、幸せにならない正しさなどがあれば、どんどん手放し、解放することで、信頼をもってブループリントを生きていくことができます。' },
  'Mercury_Sagittarius': { essence: '穏やかで平和なエネルギーのあなたは自他共にコミュニケーション能力が高く青空のようにスッキリとした思考で他の人にも伝える力に長けています。\nブルーは平和と信頼、コミュニケーションと保護の色です。\n自分自身とのコミュニケーションも得意で、周りの人にもよくよく話を聴き、認めてあげられる受容力の高い人。\n安定感のある人柄で、周囲からも信頼される事も多いでしょう。\nあなたの持つ、清らかなエネルギーで周りの人の罪悪感を解放するようなサポートや心の安らぎを得るお手伝いが出来る人です。\n違った視点や角度から物事をとらえるため、かかわる人に新たな気づきを与えたり、思い込みから解放するサポートができます。\n教師の質を持っているので、道徳を伝えたり、高潔な志を教えたり、道を示し、導いたりとあなたの表現は、説得力があるのではないでしょうか。\n確固とした信念を持ち、自分の価値観やルールを重んじる真面目なところがあります。\n「お天道様は見てるから」という考えで道徳心、精神性が高い人です。\nそして「必要な時に必要なものがやってくる」という考えも持っているのいます。\n天から守られている、そう思うとき、あなたは天とコミュニケートしています。\nもしかすると、権威者に対する観念は何か強いものをもっているのかもしれません。\nですが、あなたの内側が平和であれば権威に委縮することもありません。\nもし、自分の出した結論に固執したり、正しさへのこだわりなどに縛られたら、委ねる、受容する、認めるという寛容さと柔軟性を持つことを意識してください。\nそうするとあなたの解放のエネルギーでまた平和で穏やかな自分へと戻っていくでしょう。' },
  'Venus_Sagittarius': { essence: 'あなたの愛情表現は受容的でとても穏やかです。\n相手を信頼し見返りを求めず、まさに無条件の愛を注ぎます。\n好きなことや好きな人をマリアのような平和なエネルギーで包みます。\n相手の言葉に真摯に耳を傾け、どんな部分も受け止めて愛そうとするのではないでしょうか。\nそしてそのための努力も惜しみません。\n相手の気持ちをよく聴いた上で、自分の気持ちを表現することのほうが多いのかもしれません。\nルールや常識に縛られず解放的に生きている人や、確固たる信念を持っている精神性の高い人に惹かれる傾向があります。\nコミュニケーション力があり、自分自身とコミュニケーションをとることも得意なため、自分自身が表現する時は、自分の思いをスマートに伝えることができます。\n自分の愛に固執してしまうと、相手をジャッジすることがあるのかもしれません。\nそれは善悪で判断してしまったり、自分と合わない価値観が許せなくなったり、自分の正しさを相手に押しつけようとしてしまったり、という形で表れます。\n道徳心があり、清らかな心を持っています。相手の不道徳な部分や、不誠実な一面を知ると正そうとしたくなるかもしれません。\n愛の価値観は人それぞれだということを理解し、認めるという寛容さと柔軟性をもって関わることが鍵になります。', plus: '高潔で清らかなもの、安らぎを与えてくれるものや精神性が高まるもの、神聖な場所やヒーリングスポットにも惹かれるようです。' },
  'Mars_Sagittarius': { essence: '平和な心で過ごすことができる空間や、静かで清らかなものに足が向かうようです。\n（神聖な場所、精神性が高まりそうなもの、心安らぐところなど。）\nブルーには『平和と信頼』『安らぎと解放』『ヒーリング・思考の癒し』『聖職者・神聖・精神性』などのメッセージもあり、そういったものや場所には興味を持って動くのではないでしょうか。\n視野が狭くなると、人をジャッジしたり、時には価値観の合わない人とはコミュニケーションをとらないという行動に出ることがあるのかもしれません。\n人の話を聞き認めてあげられる受容力が高く、説得力もあるので、他の人の教師となり、誰かの心の安らぎを得るお手伝いや、スピリチュアルな視点から新しい道を示せる事、アドバイザー的なポジションに足が向かいます。\nまた、自分の中にしっかりとした信念を持っており、ブレずにその信念に基づいて努力・行動することができます。', plus: '穏やかで清らかな平和なエネルギーをもっています。' },
  'Jupiter_Sagittarius': { essence: 'あなたを幸福へと導く鍵は、ブルーのもつ平和とギフト（生まれつき持つ才能）です。\nブルーは自分の才能を生かした生き方や、コミュニケーションをサポートしてくれる色です。\nですから自分自身へのギフトを受け入れ、それを生かしていくことが、あなたの発展に向かっていきます。\nご自身の才能を認めてあげるところから。\n自分の心と天の意志（ハイヤーセルフ）とコミュニケーションをとり、必要なときに必要なものがくるという自分自身の感覚を信頼してください。\nあなたは自分が望む生き方や本当はどうしたいのかを実は知っています。\nその信頼をもってブループリントを受け取り表現していきましょう。\nそこからはブルーの特性である精神性の高さ、解放へと導く能力に磨きがかかり、人々を囚われていることから解放したり、別の視点を与えたり、道を指し示し、導いていくパワーを発揮し、あなたをより輝かせていくことでしょう。' },
  'Saturn_Sagittarius': { essence: '高潔な志をもち、自分の信念や価値観をしっかりともっているあなたは、そこに固執してしまうと、その価値観に縛られて融通が利かなくなってしまうことがあるようです。\nそうなると、普段は穏やかで平和なエネルギーのあなたなのですが、自分がいかに正しいかをわかってもらおうと必死になってしまい、いつの間にか説教口調になってしまうことも。\n最初から価値基準に合わないと感じた人にはあなたの方からはコミュニケーションをとらない、とはっきりしているところがあるようです。\nまた、権威に対してマイナスのイメージや価値観を持っている傾向があり、上司や親、権力者には厳しい態度をとったり批判的になりやすいのかもしれません。\n柔軟性を意識し、こだわりの解放が進めば進むほど、あなたの中にある安らぎや癒し、無条件の愛の力が蘇ってくるでしょう。' },
  'Support_Sagittarius': { essence: 'あなたを一生サポートしてくれているスピリットカラーはブルーです。\nブルーは平和と信頼、コミュニケーションと保護の色。\n平和とギフト（生まれつき持つ才能）の色。\n自分の才能を生かした生き方や、コミュニケーションをサポートしてくれる色。\nブルーは空、そして天の色。つまり天からの意思を表します。\n天から与えられた自分の才能を生かすこと、そしてコミュニケーションをサポートしてくれる色でもあります。\n空のブルーは父性を示し、天から守られているという平和、安らぎ、信頼を意味します。\n信頼を持ってブループリントを受け取り、表現していきます。\nコミュニケーションの才能を持ち、青空のようにすっきりした思考を伝えることができ、内側が平和であれば権威に委縮することはありません。\n必要な時に必要なものがやってくるという感覚でいると、自分自身とコミュニケーションをとることをサポートしてくれます。\n一方、ブルーは海の色でもあります。\n海は生き物を生み育む「母性」を表し、滋養と養育をもたらす色です。\nブルーには父性と母性の両方の意味が含まれています。\nブルーは権威に関する問題や悲しみも表しますが、バランスがとれると平和な心へと戻っていきます。\n穏やかなエネルギーで、まわりの人に信頼感や安心感を与えるサポートになります。\nブルーはマリア様の色とも言われています。\nあなたが正しさにこだわってしまったり、視野が狭くなって、権威に委縮してしまうことがあったとしてもブルーはいつもあなたをサポートしています。\n・穏やかで平和なエネルギー。\n・無条件の許し。\n・安定感のある人柄で周囲から信頼される人。\n・確固とした信念を持つ。\n・解放のエネルギー。\n・努力を着実に積み重ね行動する力を持つ。\n・必要な時に必要なものがくるという感覚の持ち主。\n・自分自身とコミュニケーションできる力。\n・平和な心で過ごすことができる。\n・教師の質。\n・静かで調和のとれた平和のパワー。\n・説得力。\n・人々を罪悪感から解放する力をもつ。\n・清らかな心、道徳を伝える能力。\n・道を示し、導く人。\n・別の視点を与えることができる。\n・高潔な志をもつことを教えられる。\n・囚われやルールからの解放をサポート。\n・新しい枠組みを創り出せる力。\n・清らかな空気感をもち、誠実な人。\n・真摯な信頼できる人。\n・心の安らぎを得るお手伝いができる。\n・よくよく話を聴き認めてあげられる受容力。\nあなたがつらい時も嬉しい時もどんな時もブルーはあなたのサポートをしています。\nもし、サポートが必要な時はブルーのパワーを使ってください。' },
  'YearColor_Sagittarius': { essence: '今年のあなたはブルーが力強い味方となります。\nブルーは、安らぎ、開放、天の意志、信頼、精神性、思考の癒しやコミュニケーションなどといった意味があります。\nあなたの穏やかさ、安らぎ、信頼が増し、安定感のある人柄で周りの人からより信頼される年となるでしょう。\nあなたも自分自身の平和な心が広がっているのを感じられているのではないでしょうか。\n今年はあなたのマリア様のようなエネルギー（平和な心、無条件の許し、受容力や包容力、穏やかさ、和やかさ、安心感など）が溢れています。\nもし、あなたの中で正しさへのこだわりや、権威への観念、古い価値観があるなら、自分自身を開放し手放していくことです。\n手放す作業が進めば進むほど、自分自身とのコミュニケーションでき、必要な時に必要なものがくるという体験が増していくでしょう。\n自分の才能を生かした生き方をどんどん積極的に取り組むことができる一年になりそうです。\n今までの自分自身を縛っていた思考から解放し、信頼と安らぎをもって新しいことにチャレンジしてください。\nあなたがあなたらしく生きる事で、沢山の人々が持っている自分の枠組みからの解放をサポートする1年になるでしょう。\nマリア様のパワーを発揮すればするほど、多くの人に無条件の愛を与え調和のとれた平和な人間関係を創造していく。\nそんな穏やかなエネルギーがあふれる１年になりそうです。' },
  'Sun_Capricorn': { essence: 'ロイヤルブルーが表すのは、直感・スピリチュアリティ・潜在能力・神秘性・洞察力・豊かな感性です。\n深海と夜空の色であるロイヤルブルーは夜になると星が見えてくるようにそこにあって見えなかったものを深く見聴き出来、感じ取る研ぎ澄まされた力があります。\n高次元・スピリチュアルとの繋がりも深く、見えないものを見通す力で、人々の目覚めにサポートする事が出来る人です。\n感覚器官が冴えて第六感が働きインスピレーションを受け取りやすいことが多いでしょう。\n鋭い感受性と高いコミュニケーション能力の持ち主で深い洞察力を持ち物事の本質を感じ取ることができます。\nインスピレーションや第六感といわれる直観力に優れ、傷つくことを恐れず自分や人の深い部分を洞察し、物事の本質を感じとり、表面に見えない問題を解決へと導く力を持っています。\nもしかすると、よく人から、「鋭いね」「どうしてそこまでわかるの？」などと言われることも多いのではないでしょうか。\n感性が鋭く繊細な分、周りのエネルギーに影響も受けやすいようです。\nその影響がネガティブなものだと、ネガティブな感情に覆われてしまい、それがなかなか払拭できずに、人と関わることに疲れたり、自分の世界に閉じこもってしまいたくなることもあるでしょう。\n時には自分の直感が信じられず混乱したり、人生を難しく捉えてしまったりすることも。\n自分の感覚を信頼し、自分らしく生きる勇気を持つことが鍵になります。\nそして、ふと思いついたり心に浮かんだことは、実はあなたが直感で受け取った、サポートメッセージかもしれません。' },
  'SunRealize_Capricorn': { plus: 'あなたはとても鋭く高い感受性を持ち、本質を感じ取れる力に長けています。\n深い洞察力と物事の本質を感じ取れる力を発揮し、絡まった糸をほぐすように、人々の根深い問題や葛藤を紐解いていきます。\nあなたの発する言葉には鋭さと説得力があり、人々に深い問いを与え、恐れを超えて踏み込んでいくあなたの姿は、人を変容へと導いていきます。\nスピリチュアルを現実に落とし込み、宇宙の法則を生き方を通して伝えていくでしょう。\nあなたの神秘的なエネルギーに触れ、周りの人を高次元との関係や宇宙などあらゆる関係性への目覚めにサポートしていきます。\nそのインスピレーション、第六感が研ぎ澄まされた感性と深い洞察力で迷っている人を助ける力があります。' },
  'Moon_Capricorn': { essence: '昼間の明るい空の下では輝く星は見えませんが星はちゃんと存在しています。\nそれと同じように、神秘も、普段の生活の中で目に見えるものではありませんが、その力は存在し、大いなるものの神秘的な力に守られ、影響を受けながら過ごしています。\nロイヤルブルーは、神秘が姿を現すとき、そこにある色。\nブルーとヴァイオレットを合わせた神秘の色。\nいつもは見えないものを洞察する力、物事の深い部分を見極めていく力です。\n高いコミュニケーション能力やインスピレーションを受け取る力が備わっているあなたは、自分や人の深い思いや存在理由まで見通すことができる人です。\nその洞察力を使って、物事の深みや本質を自然と感じ取っているのではないでしょうか。\nそしてその時の意識としては、頭で考えて洞察しているという感覚ではなく、自分自身の超感覚、第３の目を使っているという感覚なのだろうと思います。\n神秘とは、自然、宇宙、天の知られざる力に思いを馳せること。\n昔からあなたは宇宙の神秘や自分の中に眠る潜在的な力について深い関心ををもっているのいます。\n神秘的な力とつながると起こるシンクロニシティ（共時性・意味ある偶然の一致）。\nそれは、私たちの日常に「直感」・「インスピレーション」という形で訪れているのです。\nふと気になったことや思ったことなど、たくさんのインスピレーションを受けとってきたのでしょう。\nそして、そのインスピレーションに従って、実行に移した時、あなたは今まで何度もシンクロニシティを体験されているはず。\nあなたは、人や物事を深く見て、深く聴き、深く感じ取るといった研ぎ澄まされた感受性をもち、スピリチュアルとの繋がりが深く、人々の目覚めを促す働きができる能力を持っています。\nですから、自分の存在価値を見失っている人や、何のために生まれてきたのか確信が持てない人を目覚めさせるサポートをあなたは無意識にしていきます。\nそしてあなた自身もより自分のスピリチュアリティに確信を持ちたいと望んでいるのでしょう。\n自分のスピリチュアリティに確信を持ち、その上でこの現実の世界で自分らしく生きていくことを望んでいるようです。' },
  'Mercury_Capricorn': { essence: 'ロイヤルブルーのあなたは物事を深く見、深く聴き、感じ取れる感性が鋭いので、\n周りの人に対しても、優れた洞察力を発揮できる人。\n深い問いを与えることで、絡まった問題・葛藤が紐解き、迷っている人を助けたり、人の根深い問題を解決へ導くコミュニケーションをとることができます。\n物事の深みや本質を感じ取れるので、周囲のネガティブエネルギーを拾ってしまうことがあるのではないでしょうか。\nそうなるとネガティブな感情に覆われて引きこもってしまったり、自分の世界に閉じこもって人とコミュニケーションをとりたくなくなることもあるようです。\n鋭い感性と高いコミュニケーション能力を持っているあなたは、会話の中から深い部分も感じ取れるので、相手は時には理解されたと感じ、時には鋭すぎて警戒することもありそうです。\nまた、感性が鋭く繊細なため、相手がどう感じたのかまでキャッチしてしまい、敏感になりすぎて人と距離を置いてしまうこともあります。\n鋭い感性の持ち主なのでインスピレーションを受けとりやすく、ふと思いついたアイデアを実行してみるとうまくいったという体験が多いのでしょう。\nついつい物事や人生を難しく考えてしまうと自分の感覚を信じられなくなり混乱してしまいます。データや論理的な裏付けに加え、インスピレーションに従って行動するという双方のバランス感覚をうまく使えれば、あなたの持つ潜在能力がより発揮されるでしょう。' },
  'Venus_Capricorn': { essence: '鋭く高い感受性をもち、持ち前の高いコミュニケーション能力を使って愛を表現します。\n相手のルックスや職業、年齢などは見ていません。\nあなたは感覚器官が冴えており、相手を心の目、第３の目で見ているからです。\n社会や組織で権威ある人たちには特に関心が向かないのかもしれません。\n宇宙や高次元、スピリチュアリティ、潜在的な力について関心をもっている人や洞察力、感受性が高い人に安心感を感じることが多いのではないでしょうか。\n好きなことや好きな人を表面を見るのではなく、深く見て、深く聞き、深く感じ取ろうとします。\nその為、相手の心の痛みや傷ついた部分を敏感に感じ取ることもあり、その痛みを自分自身のものとして体感することもあるでしょう。\nその上で、相手に深い問いを与えたり、絡まった問題や葛藤を紐解いてあげたりと、その傷を癒し前に進んで行けるようサポートしようとします。\nあなたには人の中にある根深い問題を感じ取り、解決へ導く力を持っています。\nロイヤルブルーは傷つくことを恐れずに学ぶことを応援し、傷つきやすい人の心をサポートする色です。\nですから無意識に、傷ついた心を持った人に惹かれてしまうという側面があるのかもしれません。\nその内に、相手のネガティブな感情に覆われてしまったり、それがなかなか払拭できずに数日その状態で過ごしてしまうといったこともあるのでしょう。\n痛みばかりにとらわれると、それは愛ではなく同情になってしまうこともあるようです。\nそんな時は自分と相手を信頼して痛みや恐れを乗り越える勇気を持つことが、より良いパートナーシップにつながります。', plus: '潜在能力を引き出したり生かすこと、根深い問題を解決へ導くもの、高次元との関係や宇宙の法則など、スピリチュアルな世界や目に見えないものに惹かれます。' },
  'Mars_Capricorn': { essence: '第六感やインスピレーションに富んでいるので、自分の直感に従って行動することが多いのではないでしょうか。\nふと行きたいなと思ったところ、なんだか気になる場所など自分の中ではっきりとした理由がなくとも、『なんとなくそう感じたから』というインスピレーションを大切にして行動します。\n宇宙の神秘や、自分の中に眠る潜在的な力について深い関心を持ち、物事を表面だけでなく、深みや本質を感じ取れるもの、神秘的なものや、スピリチュアルなものに対して行動への意欲が湧き上がってきます。\nその他にも、傷つくことを恐れずに学ぶことを応援したり、傷つきやすい人の心をサポートするようなところに足が向かいやすいのでしょう。\nそして、人の中に根深い問題や葛藤を見いだすと、複雑に絡まった糸を紐解くように、その人の深い部分に問いかけ、サポートしようと動きます。', plus: '見えないものを見通すような霊性の高さを感じさせる神秘的なエネルギーをもっています。' },
  'Jupiter_Capricorn': { essence: 'あなたを幸福へと導く鍵は、ロイヤルブルーの持つインスピレーションと研ぎ澄まされた深い洞察力です。\nあなたが自分の感性や直感を信頼して行動すると、見えないものを見通す力と高いコミュニケーション能力が発揮され、今まで問題だと思っていたことの答えが見えたり、抱えていた葛藤が解消されていきます。\nまた、あなたの高いコミュニケーション能力を使って、周りの人に深い問いを与え、根深い問題を解決へ導き、問題解決のサポートをしていくでしょう。\n自分自身の第６感への信頼を増し、あなたのスピリチュアリティに尊厳を持って生きることが拡大へと向かい、スピリチュアルを現実に落とし込んでいけるのです。\n宇宙の法則を生き方を通して伝えていくことが、人々の絡まった問題や葛藤を紐解いて人々の目覚めへと発展していきます。\n自分の世界からあなたの持つインスピレーションを外の世界へと生かすことです。' },
  'Saturn_Capricorn': { essence: '感性の鋭さと繊細さをもっているあなたは、時に傷つきやすく、ネガティブな感情に支配されることがあるようです。\n自分のスピリチュアリティ･インスピレーションへの疑いを感じたり、ディスカウントし、自分の感覚を信頼できず混乱してしまうというような状態です。\n他者のネガティブエネルギーをもらってしまうことも多いため、そのネガティブエネルギーがなかなか払拭できずに重たさを感じてしまうこともあるのではないでしょうか。\nそうなると、人との関わりに敏感になり、周りの人との摩擦に疲れてしまって、自分の世界に閉じこもってしまうこともあるようです。\nそんな時はあなたのふと思いついたインスピレーションを大切にしてください。\nそして自分の感覚や感性を信頼し、そのアイデアを外の世界に向けて実行してみましょう。外へ踏み出して実行していくことで、現実の世界で自分らしく生きる勇気が湧き、葛藤が紐解かれていきます。' },
  'Support_Capricorn': { essence: 'あなたを一生サポートしてくれているスピリットカラーはロイヤルブルーです。\nロイヤルブルーは神秘、直感、超感覚、超能力、変容、スピリチュアリティ、第3の目、尊厳、潜在能力などの意味があります。\n今までも、もしかしたらふと思ったことに従ったら人生が展開しはじめた、とかふと湧いたことが現実に起きた、という体験が多いのではないでしょうか。\nロイヤルブルーは傷つくことを恐れずに学ぶことを応援し、傷つきやすい人の心をサポートする色です。\nブルーが深まると、深海と夜空の色であるロイヤルブルーになります。\n夜になると星が見えてくるように、そこにあって見えなかったものを、深く見て深く聞き、感じ取るといった研ぎ澄まされた力を表す色です。\nこれはあなたが深い洞察力をもち、物事の深みや本質を感じ取れるということ。\nそして高い感受性と高いコミュニケーション能力を持ち、感覚器官が冴えて第6感が働き、インスピレーションを受け取りやすくなります。\n人間や地球との関係に留まらず、宇宙や、より高次元との繋がりなど、様々な関連性に目覚めることを意味します。\n逆の意味では、過度に敏感なため、社会との繋がりが持てず、自分の世界に閉じこもった状態でバーチャルな世界を彷徨います。\n社会や組織との問題などの深い権威の問題も表します。\nあなたがネガティブな感情に覆われてしまっても、過去の権威などの問題が浮上し、心が縛られるように感じることがあったとしてもロイヤルブルーはいつもあなたをサポートしています。\n・鋭く高い感受性を持つ。\n・スピリチュアルな才能。\n・高いコミュニケーション能力。\n・深く見、深く聴き、感じ取れる感性の鋭さ。\n・第六感、インスピレーションが冴えている。\n・直感力が鋭く優れた洞察力を持っている。\n・宇宙の神秘、自分の中に眠る潜在的な力について深い関心をもつ。\n・見えないものを見通す力。\n・インスピレーションに富んだ感性豊かな人。\n・深い洞察力をもつ。\n・物事の深みや本質を感じ取れる力。\n・迷っている人を助ける力。\n・スピリチュアルとの繋がりが深い。\n・人々の目覚めを促す働きができる人。\n・スピリチュアルを現実に落とし込み、宇宙の法則を生き方を通して伝えることができ\n・人の根深い問題を解決へ導くサポートができる。\n・深い問いを与えることができる。\n・絡まった問題、葛藤を紐解く力。\nあなたがつらい時も嬉しい時もどんな時もロイヤルブルーはあなたのサポートをしています。\nもし、サポートが必要な時はロイヤルブルーのパワーを使ってください。' },
  'YearColor_Capricorn': { essence: '今年のあなたはロイヤルブルーが力強い味方となります。\nロイヤルブルーは神秘、直感、超感覚、潜在能力、スピリチュアリティや第3の目などといった意味があります。\nあなたの物事を深く見、深く聴き、感じ取れる感性の鋭さが光り、スピリチュアリティとの繋がりが深まっていく年となるでしょう。\nあなたも自分自身の第六感、インスピレーションが冴えているのを感じられているのではないでしょうか。\n直感やインスピレーションを大切にし、ふと思いついたことはやってみる、行動してみることで、本来持っている洞察力やコミュニケーション力がより磨かれていく年となりそうです。\n物事の深みや本質を感じ取れるので、周りの人に対しても、優れた洞察力を使い深い問いを与えることで、絡まった問題・葛藤が紐解かれ、迷っている人を助けたり、人の根深い問題を解決へ導くサポートができるでしょう。\n人間や地球との関係に留まらず、宇宙や、より高次元との繋がりなど、様々な関連性に目覚めることもありそうです。\n鋭く高い感受性、インスピレーションに従って実行すればするほど、人々の目覚めを促す働きができ、解決への導き手になる。\nそんな神秘的なエネルギーがあふれる１年になりそうです。' },
  'Sun_Aquarius': { essence: 'ヴァイオレットは2極のバランスを整え、スピリチュアリティを教えてくれる色。\nあなたは物質的な側面だけにとらわれることなく、精神面の充足を探求していくことに価値をおいているようです。\n深いスピリチュアリティを持つあなたは、物事の対極にあるもの、男性性と女性性、思考と感性、光と影、ポジティブとネガティブなどを統合し、変容をもたらす力を持っています。\nまた、人と違う独自の感性を持ち、芸術的な発想や創造性も発揮します。\nそのため、あなたの独特な魅力がカリスマ性となって、その魅力にひかれる人も多いでしょう。\nそんな個性的な発想や感性から、人から理解されていないと感じたり、周囲となじめない感覚になりやすい面もあります。\nそうなると、孤独感を感じたり、自分の世界に閉じこもりがちになって幻想に生きてしまいやすくなります。\n「地上に天国を」というのもヴァイオレットの大切なキーワードです。\nレッドとブルーの2つの色を含むヴイオレットですから、現実（レッド）の中で、自分の天の意志（ブルー）を生きることで地上に天国を（ヴァイオレット）もたらすことができます。\n夢や幻想を持ちすぎると、かえってそれが自分を追い込むことになりかねません。\n現実世界で生きることと自分のスピリチュアリティに確信を持って生きることの2極のバランスを整えることのできるあなたのパワーを思い出してください。' },
  'SunRealize_Aquarius': { plus: 'あなたは芸術的感性が豊かで創造力、直観力に富んでいます。\nですから、人とは違った感性を使いこなし、その発想力で新しいものを創り出していきます。\n必要がなくなったものに終止符を打ち、機能していないものを壊し、変容させていくような改革のエネルギーで人生をクリエイトしていくパワーがあります。\nそのあなたの新しい風をもたらす生き方に人が集まり、その姿はまさにカリスマ。\n2極のバランスを上手に整え、自分の中のエネルギッシュで活動的な男性性と、ソフトで受容的な女性性の２つの側面を認め、スピリチュアリティをもって、地に足をつけて現実社会を生きていきます。' },
  'Moon_Aquarius': { essence: 'あなたは本来、気高く神聖なエネルギーを持っています。\n高いスピリチュアリティと感性で本当に大切なものを見極めることができます。\n自分の人生の目的や使命をあなたの魂はよく知っていて、あとはその魂の声に従ってただ生きるだけなのです。\nもしかしたら、まだ自分自身のスピリチュアリティや感性を信頼できない部分があるのかもしれません。\nですが自分が感じ取る魂の声に従っていくと、本来持っている想像力や直観力、あるいは芸術的な才能が発揮され、常識や枠組みにとらわれることなく、改革や変容をもたらします。\n少し人とは違う感性を持っていることに対して、時には自分の感覚に確信が揺らぎ、漠然とした不安や不信感を抱えてしまうことがあるかもしれません。\nですが、そういった人とは違う感性があるからこそ、古い環境に新しい風をもたらすことができるのです。\n変化を怖れる必要はありません。\nその斬新な発想が新しい扉を開いていきます。\nそしてあなた自身も自分に全幅の信頼をおいて、感性のまま生きていきたいと望んでいるようです。\n人生で何かに行き詰った時でも、その力で自然と打開策が見出せます。\nそしてそんなあなたの姿は、周りの人に「本来の自分を生きてもいいんだ」という勇気と希望を与えるのです。\nそしてその力を人のために役立てたいという献身的な面もあります。\n昔から宗教的な場面でもたくさん使われてきたとされる高貴な色です。\n天の美しいエネルギーと繋がることができると言われるスピリチュアルな色。\nですからあなたは、自分では自覚がないかもしれませんが、人が寄ってくるカリスマ性の持ち主なのです。\n自分の感性への疑いと信じたいという気持ちの揺らぎの中で時間を過ごすのではなく、\nあなたが自分の感性を信頼し、直観に従って自分の道を生きると決めた時、あなたの中にある霊性が輝き始めます。' },
  'Mercury_Aquarius': { essence: 'ヴァイオレットのあなたは、人のエネルギーを流したり整えたりすることが出来る人。\n人とは違う感性を持っているので、斬新な発想が得意です。\nヴァイオレットはレッドとブルーの二つの色を含み、天と地、陰と陽、男性性と女性性、思考と直感など、２極の統合を表します。\n機能しないものを壊し、変容させる力があり、２極の思考を上手く使いこなせる力があります。\n２つの相反することに対して、どちらか一方を選ぶということだけに囚われることなく、そこから新しく第３の答えを導きだすという考えができるのではないでしょうか。\n芸術的な感性が豊かで、直観力や想像力に富んでいます。\nまた、奉仕の精神を持っており、人の痛みや深い思いを敏感に感じ取り、寄り添いサポートすることに進んで関わろうとします。\n自分独自の感性や視点で物事をとらえるため、斬新な発想で問題を処理したり、改革する力を持っています。\n一方で、人と違う発想や感性を持っているため、何となく馴染めない、人から理解されていないなどの感覚にとらわれることがあり、人と距離を取ってしまうことがあるのかもしれません。\nそうなると目の前の現実から目をそらしたくなったり、自分の考えや感覚に確信が持てなくなり、否定的な感情に支配されやすくなります。\nあなたはしっかりと現実を生きながら、同時に自分らしく夢の翼を広げていくというバランスが大切だと思っていますし、実際にバランスをとって生きることができる人です。\n自分の中の２極のものの側面を認めバランスをとりながら生きられるようになると、より自由に、新しい自分との出会い、他者との出会いを楽しんでいくことができます。' },
  'Venus_Aquarius': { essence: 'あなたには本当に大切なものを感じ取れる力があります。\n好きなことや好きな人と深くかかわり、表面的なつながりではなく、心を込めること、魂でつながることにエネルギーを注ぎます。\n相手の外側（ルックスや職業、年収など）には全くといっていいほど目が向かないのではないでしょうか。\nそこで判断することはなく、常識や世間体に縛られることもなく、自分自身の感性を大切にし、あなたのその霊性の高さを使って相手の精神性を見ています。\n自分を貫くエネルギーを持つヴァイオレットの人は、人とは違う感性の持ち主なので、自分自身の感覚を受け止め、理解してもらえることが大切です。\nあなたの思いや感覚が理解されないと感じると、自分の存在理由に確信が持てなくなり、\n現実逃避したり自分の中に閉じこもってしまうこともあるかもしれません。\nですからあなたの感覚を理解してくれていると思える人に安らぎを感じ、惹かれるようです。\n男性性と女性性のバランスがとれている人に安心感を感じることが多いのでしょう。\nヴァイオレットはカリスマ性を意味する色でもあるので、カリスマ的存在の人や２極のものを使いこなして生きているギャップのある人、斬新な発想でどんどんと新しいことを創造していく人に魅力を感じる事が多いのかもしれません。\n直観力・創造性・スピリチュアル・前例のないもの・芸術性・高貴なエネルギーといったキーワードにも惹かれます。', plus: 'そしてあなたが惹かれるものは、ヒーリングやスピリチュアルなもの、瞑想の世界。\n奉仕活動にも積極的にかかわっていく人に魅かれます。' },
  'Mars_Aquarius': { essence: '瞑想やヒーリング、奉仕活動、エネルギーを扱うものなど、スピリチュアリティを感じるものに足が向かうようです。\n（機能しないもの、必要のないものを壊し変容させるものや天と地のエネルギーを動かしたり、エネルギーを流したり整えたりするもの、新しい風をもたらすと感じるものや天の意思を地上で具現化するもの、２つの相反することに第３の答えを導けるものなど。）\nあなたはヒーリングや瞑想にかかわることや、スピリチュアルなものに心を動かされ、興味を持って動きます。\nまた、芸術的感性が豊かで、直観力や想像力も兼ね備えているので、本当に大切なものを感じ取り、表面的なものには惑わされません。\n表面的なつながりではなく心を込めること、魂でつながることにエネルギーを注ぎます。\n高貴で優雅なものに美しさを感じ、ヒーリングや奉仕活動、深いスピリチュアリティにも関心があります。', plus: 'あなたは高貴で優美なエネルギーの持ち主。\n芸術的感性が豊かで、想像力、直観力に富んでいます。\n人とは違う感性を持っているので、人が寄ってくるカリスマ性があります。\n新しい発想、斬新な発想が湧けば湧くほど、行動への意欲・目標達成への原動力になっていきます。' },
  'Jupiter_Aquarius': { essence: 'ヒーリングや瞑想にかかわることや、エネルギーを流したり整える才能を持っています。\nまた、芸術的感性が豊かで、直観力や想像力も兼ね備えています。\nあなたを幸福へと導く鍵は、ヴァイオレットの持つスピリチュアリティ、自分を貫くエネルギー、２極のものの統合、変容をもたらすパワーです。\nもしこの中にあなたがすでに自覚しているものがあれば、あなたはすでにその才能を生かして幸せに向かって踏み出しているということ。\nあなたが自分のスピリチュアリティを受け入れて行動すること、ネガティブな自分の闇の部分、理解されない悲しみや怒りを受け止めることができるようになると、変容をもたらすパワーと２極の思考をうまく使いこなし、新しい発想を生みだし、相反するものに第３の答えを導き出していくことができます。\nまた、あなたの斬新なアイデアで、新しい扉を開き、閉塞感は打破され、前例のないものを生み出したり、改革を起こしていく可能性を秘めています。\n変化を怖れず地に足をつけ天のエネルギーを生きることで自分の地上に天国を創造していくでしょう。' },
  'Saturn_Aquarius': { essence: 'あなたはすべてを見通しており、何が必要かもわかっています。\nただそれをするのはかなり勇気がいることで、今の現実にはそぐわないからとあきらめてしまいそうな気持ちになることがあるのではないでしょうか。\n現実世界に疲れ、幻想の世界に逃避したくなる衝動にかられてしまうことも。\n「こんな私はおかしい。人並みではない。何がしたいのかわからない。」\nそんな焦りや不安があるのかもしれません。\nですが、あなたはもう知っています。\nあとは感性と直感、想像力に任せ、本来持っているカリスマ性を隠さず発揮することです。\n矢面に立てば違和感が襲ってくることも、めんどくさいことも、叩かれることもあるでしょう。\nそんな時でも、ありのままのあなたでただそこにいるだけでいいのです。' },
  'Support_Aquarius': { essence: 'あなたを一生サポートしてくれているスピリットカラーはヴァイオレットです。\n気高さとヒーリングの色であるヴァイオレット。\n本来の大切なものを見る色。\nそして最も波動の高い虹の最後の色。\nヴァイオレットは最も高く細やかな波動を持ち、過度な思考や精神性を鎮めて癒しをもたらします。\nこの高い波動は大切なものを見極め、人生の目的や使命を実践し、奉仕することを意味します。\nヴァイオレットは、昔から神聖な儀式や宗教的な場でも多く使われてきた高貴な色でもあり、スピリチュアリティ、ヒーリング、発想力、カリスマ性、変容をもたらす力などを表します。\nヴァイオレットはレッド（現実）とブルー（天）から成り立っています。\n現実の世界で天の意志、ブループリントを生きていくことが、本当にスピリチュアルな生き方であるということ。\nそしてあなたにはそんな生き方ができると教えてくれています。\nあなたが自分の感覚に疑いをもったり、悲しみや怒りに支配されている感覚を感じたり、変化を怖れることがあったとしてもヴァイオレットはいつもあなたをサポートしています。\nあなたが何かに迷ったり、一歩踏み出そうとするとき、このメッセージから勇気やヒントをもらってください。\n・高貴で優美なエネルギー。\n・瞑想やヒーリング、奉仕活動に興味を持ち、実際にやっていく人。\n・芸術的感性が豊か。\n・想像力、直観力に富む。\n・深いスピリチュアリティ。\n・人が寄ってくるカリスマ性を持つ。\n・機能しないものを壊し、変容させる力。\n・新しい風をもたらすパワー。\n・閉塞感を打破する力。\n・天と地のエネルギーを動かす改革の力を持つ。\n・エネルギーを流したり整えるパワーを持つ。\n・２極の思考をうまく使いこなすことができる。\n・直感的。\n・創造的。\n・クリエイターの質。\n・感性が豊か。\n・斬新な発想力。\n・人とは違う感性の持ち主。\n・新しい発想の改革のパワーで新しい扉を開くことができる。\n・天の意思を地上で具現化できる。\n・２つの相反することに第３の答えを導き出す。\n・前例のないことをするエネルギー。\nあなたがつらい時も嬉しい時もどんな時もヴァイオレットはあなたのサポートをしています。\nもし、サポートが必要な時はヴァイオレットのパワーを使ってください。' },
  'YearColor_Aquarius': { essence: '今年のあなたはヴァイオレットが力強い味方となります。\nヴァイオレットはヒーリング、変容、スピリチュアリティ、終わりと始まり、発想力などといった意味があります。\nあなたのスピリチュアリティ、発想力、芸術性、改革のエネルギーが増し、あなたの感性がより研ぎ澄まされる年となるでしょう。\nあなたも自分自身のスピリチュアリティが高まっているのを感じられているのではないでしょうか。\n今年はあなたの豊かな感性が溢れ、変容の年となるでしょう。\nそのためには、何か終わりを告げるものが出てくる可能性もあります。\n何かが終わりを迎えるというのは、新しい始まりでもあります。\n変化を怖れずに勇気をもって進んでいくことで、閉塞感を打破し、新しい自分自身を感じられるでしょう。\nあなたの直感や感性に従って行動したり、自分や周りの人を癒すことに携わっていく機会に多く遭遇するかもしれません。\nその結果、自分がやりたかったことがはっきりしたり、没頭できるものに出会ったり、そこから違う発想が生まれたりと、いろんな形であなたの個性を生かすことを後押ししてくれます。\nですから、いつもより直感や感性に正直に行動してみる1年にしてみてください。\n変容を受け入れ、自分の感性を信頼し、新しい扉が開いていく。\nそんな素敵なエネルギーがあふれる１年になりそうです。' },
  'Sun_Pisces': { essence: 'マゼンタが表すのは、大いなる天の愛、人類愛、慈愛です。\n見えないものの中にこそ多くの可能性を見いだし、この世界のすべてのものに愛と感謝を感じられる力を持っています。\n慈愛や繊細な感性で天からすべてを見守っているかのように、道ばたに咲いている花や、四季の移り変わりなど、当たり前の日常や出来事に愛と感謝を見いだせる資質が備わっているのです。\nそういったささやかな物事の中に価値を見出していくマゼンタは、日本人の色といわれています。\nあなたは、小さなことにも目が行き届き、細やかな心遣いができるのではないでしょうか。\n周りの人に対しても献身的で細やかな気配りができ、愛を注ぎ、思いやりと情熱を持って、人を理解する力に長けています。\nそれが一方的になってしまうと、自己犠牲になったり過保護・過干渉になることがあるのでしょう。\n人の期待に応えようと一生懸命になりすぎて疲弊してしまったり、自分は何をしたかったのか分からなくなってしまいます。\nそんな時は、自分と人との適切な境界線を心がけ、自分自身を優先し、自分を楽しませることを意識するとパワーが戻ってくるでしょう。\nマゼンタが表す偉大なる天からの愛、宇宙の采配を存分に味わいましょう。\nその愛を受けとれる力をあなたはすでに持っています。' },
  'SunRealize_Pisces': { plus: 'あなたは本来、女神のような気高さと力強さを持っています。\n人智を超えたもの、天や宇宙、神、守護天使など目には見えない大いなる何かが守ってくれているという大きな愛を感じること、受け取ること、そしてその愛を日常の小さなものにも渡していくことができます。\n細やかで愛情溢れた配慮をし、あなたのその姿は、人々の心に愛をよみがえらせていきます。\n慈愛に基づいて人と関わりケアし、世のために尽くすことを情熱をもって取り組んでいき、それはまさに大きな愛をエネルギッシュに表現していくマザーテレサやナイチンゲールのようです。' },
  'Moon_Pisces': { essence: '全ての色を含んでいるマゼンタ。\nその本質についてはまだ未知の部分があるといわれています。\nですから「神秘の色」であり、全てを包む「宇宙の愛、天からの愛の色。」\nあなたはこの地球全体を包み込むほどの深くて大きな愛を持って生まれてきました。\nマゼンタはたくさんの経験を経て、多くの可能性と才能を持つことを表します。\n無限の可能性をもつマゼンタ。\nもし、経験や知識だけで自分の人生を限定し、自分の可能性を小さくしてしまっているのであれば、未知領域に飛び込んでみてください。\nあなたには、未知領域にある愛を探求できる可能性をたくさん持っているからです。\n今まで私たちが経験したことのない大きな愛。\nそしてその大きな愛は日常のささやかな出来事の中にあります。\n神は細部に宿るという言葉があるように、天からの愛は細部すべてに宿っています。\nですから、あなたは人に対してだけではなく、この世に命を持って生きているすべての物に対して感謝と慈しみの気持ちを感じることのできる愛を持って生まれてきました。\nささやかな物事の中に価値を見出していくあなたは、小さなことにも目が行き届き、どんな出来事にも感謝する心を持っています。\n何気ない日々の中でも、ふと空を見て、天からの祝福、宇宙からのサポート、大きな何かが守ってくれているという安心感を感じ、感謝がこみ上げてくるということが多いのではないでしょうか。\n小さなことにも愛を注ぎ、思いやりと情熱を持って生きていくことができます。\nその生き方は、力強く愛を生きる女神のエネルギーに繋がっています。\n目の前の人が何を必要としているのかを自然と感じ取り、細やかな配慮をもって行動でき、人の喜びを自分の喜びとして感じられる力も持っています。\nそんなあなたから、周りの人は温かさや思いやり、そして自分を理解してくれているという安心感を感じるのです。\nあなたは慈愛に溢れ、細やかな気配りや配慮ができる分、人のニーズや期待も敏感に察知できてしまいます。\n人の期待に応えようと抱え込みすぎている自分や他者を優先しすぎて自分の気持ちを後回しにしていることに気づいたら、自分の責任の範囲について立ち止まって考えてみると、人との適切な境界線が見えてくるでしょう。' },
  'Mercury_Pisces': { essence: '自分に起きてくることに対し\nて、大きな愛で受けとることができる方。\n一見「ネガティブ」だと思える出来事に対しても、「これはもしかしたら、天からのお知らせかもしれない。大いなる何かが今の私に必要なことを教えてくれているのだろう。」という風に捉え、対応することができるのではないでしょうか。\n人とのコミュニケーションも同様に、どんな相手にでも心を閉ざすことなく、今の目の前のこの人に何が必要なのかを感じ取り、慈愛に基づいて関わります。\nそれはあなたの思いやり、受容力、人類愛から出るものです。\n時には周りの空気を読み過ぎて自分を出せなくなったり、人の問題も抱え込んでしまったりすることもありますが、それも相手の立場に立って考えながらコミュニケーションをとれるがゆえのこと。\n人の期待に応えようと一生懸命になりすぎている自分に気づいたら、自分の責任の範囲について立ち止まって考えてみると、人との適切な境界線が見えてくるでしょう。\n自分の気持ちを大切にして関わることで、あなたの強みとして生かすことができます。\n人の喜びを自分の喜びとしてとらえられるので、サポートをすることが苦にならず、やりがいを感じながら関わることができます。\n「自分さえ良ければいい」という考えはなく、「地上を豊かにするにはどうしたらいいのだろう。」「社会をより良くするためには私に何ができるだろう。」といった「全体にとって」という広い視野で物事を考えます。\n平凡な毎日の中に大きな愛を見出せるという考えが出来る方ですので、日々のささいな出来事にも感謝する気持ちを持ち、幸せをたくさん見つけ出せる、とてもお得な視野の持ち主です。' },

// テキスト整形ヘルパー: \n を段落 <br> に変換
function fmtTxt(t){
  if(!t) return '';
  return t.split('\n').map(function(s){return s.trim();}).filter(function(s){return s.length>0;}).join('<br>');
}

  // 天体別×星座 の専用テキストがあれば使い、なければ汎用フォールバック
  const getByPlanet = (planet, sign) => {
    const key = planet + '_' + sign;
    return WORD_PLANET_TEXT[key] || null;
  };

  const getInfo = sign => OUTER_RING_CW.find(o=>o.sign===sign)||{ja:sign,hex:'#888'};
  const sunInfo=getInfo(planetVals.Sun), moonInfo=getInfo(planetVals.Moon);
  const mercInfo=getInfo(planetVals.Mercury), venusInfo=getInfo(planetVals.Venus);
  const marsInfo=getInfo(planetVals.Mars), jupInfo=getInfo(planetVals.Jupiter);
  const satInfo=getInfo(planetVals.Saturn);
  const maleInfo=getInfo(maleSign), femaleInfo=getInfo(femaleSign);
  const totalInfo=getInfo(totalSign), supportInfo=getInfo(supportSign);
  const yearCInfo=getInfo(yearColorSign);

  const sun=get(planetVals.Sun), moon=get(planetVals.Moon);
  const merc=get(planetVals.Mercury), venus=get(planetVals.Venus);
  const mars=get(planetVals.Mars), jup=get(planetVals.Jupiter), sat=get(planetVals.Saturn);
  const total=get(totalSign), support=get(supportSign), yearC=get(yearColorSign);

  const dot = (hex,size=14) => '<span style="display:inline-block;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+hex+';border:1px solid rgba(0,0,0,0.2);vertical-align:middle;margin-right:4px;"></span>';

  const section = (icon, title, heading, hex, colorName, signJa, body) =>
    '<div class="reading-section">' +
      '<div class="reading-header">' +
        '<span class="reading-icon">'+icon+'</span>' +
        '<div><div class="reading-title">'+title+'</div><div class="reading-sub">'+heading+'</div></div>' +
        '<div class="reading-color-badge">'+dot(hex,12)+colorName+'・'+signJa+'</div>' +
      '</div>' +
      '<div class="reading-body">'+body+'</div>' +
    '</div>';

  const sub = (title, body) => body ?
    '<div class="reading-subsection"><div class="reading-subsec-title">'+title+'</div><div>'+body+'</div></div>'
    : '';

  // 天体専用テキスト取得（fallback: 汎用essence/plus）
  const planetText = (planet, sign, field) => {
    const t = getByPlanet(planet, sign);
    if(t && t[field]) return t[field];
    const d = get(sign);
    return d[field] || '';
  };

  let html = '<div class="reading-wrap">';

  // 1. 主人格（プラス＋マイナス）
  (function(){
    var wordSunData = WORD_PLANET_TEXT['Sun_'+planetVals.Sun];
    var sunBody = '<p>あなたの人生を占める主人格は<strong>'+sun.name+'</strong>のエネルギーを持つ人です。</p>'+
      '<p>'+fmtTxt(planetText('Sun',planetVals.Sun,'essence'))+'</p>';
    if(!wordSunData){
      sunBody += sub('あなたの強み・本来の力', planetText('Sun',planetVals.Sun,'plus'))+
        sub('気をつけたいパターン', getMinus(planetVals.Sun));
    }
    html += section('🌟','主人格','太陽星座 ／ '+sunInfo.ja+' ／ '+sun.name,
      sunInfo.hex, sun.name, sunInfo.ja, sunBody);
  })();

  // 2. 自己実現（プラスのみ）
  html += section('✨','自己実現の形','太陽星座 ／ '+sunInfo.ja+' ／ '+sun.name,
    sunInfo.hex, sun.name, sunInfo.ja,
    '<p>あなたの自己実現の形は、この本来の力を最大限に発揮することです。</p>'+
    '<p>'+fmtTxt(planetText('SunRealize',planetVals.Sun,'plus'))+'</p>'+
    '<p>このエネルギーが自然に溢れ出しているとき、あなたは最も自己実現に近い場所にいます。何かに迷ったとき、「今の自分はこの力を発揮できているか？」と自問することが羅針盤になります。</p>'
  );

  // 3. 月（プラスのみ）
  html += section('🌙','無意識の自分・プライベートの顔','月星座 ／ '+moonInfo.ja+' ／ '+moon.name,
    moonInfo.hex, moon.name, moonInfo.ja,
    '<p>プライベートのあなた、ありのままの顔、隠された欲求と隠れた強みを持っています。</p>'+
    '<p>'+fmtTxt(planetText('Moon',planetVals.Moon,'essence'))+'</p>'+
    sub('好きなこと・得意なこと・隠れた強み', planetText('Moon',planetVals.Moon,'plus'))
  );

  // 4. 水星（両面）
  (function(){
    var wordMercData = WORD_PLANET_TEXT['Mercury_'+planetVals.Mercury];
    var mercBody = '<p>外からの刺激への反応、物事の捉え方、人との関わり方にはこんな特徴があります。</p>'+
      '<p>'+fmtTxt(planetText('Mercury',planetVals.Mercury,'essence'))+'</p>';
    if(wordMercData && wordMercData.plus){ mercBody += sub('コミュニケーション・思考の強み', wordMercData.plus); }
    else if(!wordMercData){ mercBody += sub('コミュニケーション・思考の強み', planetText('Mercury',planetVals.Mercury,'plus'))+sub('気をつけたいパターン', getMinus(planetVals.Mercury)); }
    html += section('💬','思考・知覚・コミュニケーションのパターン','水星 ／ '+mercInfo.ja+' ／ '+merc.name,
      mercInfo.hex, merc.name, mercInfo.ja, mercBody);
  })();

  // 5. 金星（両面）
  (function(){
    var wordVenusData = WORD_PLANET_TEXT['Venus_'+planetVals.Venus];

    if(wordVenusData && wordVenusData.plus){ venusBody += sub('愛の表現・美意識', wordVenusData.plus); }

    '<p>'+fmtTxt(planetText('Jupiter',planetVals.Jupiter,'essence'))+'</p>'+
    '<p>'+fmtTxt(planetText('Jupiter',planetVals.Jupiter,'plus'))+'</p>'+

  html += section('🪐','課題・バランスをとるもの','土星 ／ '+satInfo.ja+' ／ '+sat.name,

  html += '<div style="height:28px;"></div>';

  const wordTotalMission = WORD_TOTAL_MISSION[totalSign] || TOTAL_MISSION[totalSign] || {learn:'',role:'',influence:''};
  html +=
    '<div class="reading-section reading-mission">' +
      '<div class="reading-header">' +
        '<span class="reading-icon">🌈</span>' +
        '<div><div class="reading-title">統合色数（自分らしく在るときの性質）</div>' +
        '<div class="reading-sub">統合色数 ／ '+totalInfo.ja+' ／ '+total.name+'</div></div>' +
        '<div class="reading-color-badge">'+dot(totalInfo.hex||'#888',12)+total.name+'・'+totalInfo.ja+'</div>' +
      '</div>' +
      '<div class="reading-body">' +
        '<p>'+fmtTxt(wordTotalMission.learn)+'</p>' +
      '</div>' +
    '</div>';

  // 12. サポートカラー（箇条書き対応）
  (function(){
    var rawSup = planetText('Support',supportSign,'essence');
    var bulletIdx = rawSup.search(/\u30fb/);
    var supBody = '';
    if(bulletIdx > 0){
      var para = rawSup.substring(0, bulletIdx).trim();
      var bulletPart = rawSup.substring(bulletIdx);
      var bullets = bulletPart.split('\u30fb').map(function(s){return s.replace(/\n/g,'').trim();}).filter(function(s){return s.length>0;});
      supBody = '<p>'+fmtTxt(para)+'</p>';
      if(bullets.length>0){
        supBody += '<ul style="list-style:none;padding:0;margin:10px 0 0;">';
        bullets.forEach(function(b){ if(b) supBody += '<li style="padding:2px 0 2px 1em;text-indent:-1em;">・'+b+'</li>'; });
        supBody += '</ul>';
      }
    } else {
      supBody = '<p>'+fmtTxt(rawSup)+'</p>';
    }
    html += section('⭐','サポート色数','いつもあなたを支えるエネルギー ／ '+supportInfo.ja+' ／ '+support.name,
      supportInfo.hex||'#888', support.name, supportInfo.ja, supBody);
  })();

    // 13. 年運カラー
  html += section('🌟','今年（'+targetYear+'年）の年運カラー','年運サポートメッセージ ／ '+yearCInfo.ja+' ／ '+yearC.name,
    yearCInfo.hex||'#888', yearC.name, yearCInfo.ja,
    '<p>'+fmtTxt(planetText('YearColor',yearColorSign,'essence'))+'</p>'
  );

  html += '</div>';
  return html;
}
